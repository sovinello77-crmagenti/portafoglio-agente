<style>
/* Layout: barra laterale scura + area di lavoro a due colonne (elenco / scheda); su telefono la scheda sostituisce l'elenco. */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --ink:#16222a; --muted:#5b6a73; --line:#dde2df;
  --accent:#0f5c63; --accent-ink:#ffffff; --accent-soft:#dcebec; --side:#12262c; --side-ink:#d5e3e4; --side-mute:#86a1a5;
  --ok:#23703f; --ok-soft:#dcefe2; --warn:#97580a; --warn-soft:#f8e8cd; --bad:#a93229; --bad-soft:#f6dcd9; --info-soft:#e3e8ef; --info:#3a4d6b;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --surface:#162226; --ink:#e5ecec; --muted:#93a4a8; --line:#273639;
  --accent:#55b6bd; --accent-ink:#05181a; --accent-soft:#1b3a3e; --side:#0a1113; --side-ink:#cfdcdd; --side-mute:#6f898d;
  --ok:#6fcf92; --ok-soft:#173424; --warn:#e7b25f; --warn-soft:#3a2a12; --bad:#ff8f84; --bad-soft:#40201d; --info-soft:#1f2b3b; --info:#9fb6d8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517; --surface:#162226; --ink:#e5ecec; --muted:#93a4a8; --line:#273639;
  --accent:#55b6bd; --accent-ink:#05181a; --accent-soft:#1b3a3e; --side:#0a1113; --side-ink:#cfdcdd; --side-mute:#6f898d;
  --ok:#6fcf92; --ok-soft:#173424; --warn:#e7b25f; --warn-soft:#3a2a12; --bad:#ff8f84; --bad-soft:#40201d; --info-soft:#1f2b3b; --info:#9fb6d8;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}

.shell{display:grid;grid-template-columns:208px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:4px;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));overflow:auto}
.brand{font-family:var(--f-display);font-size:19px;font-weight:700;color:#fff;padding:2px 10px 16px;line-height:1.15}

.nav{display:flex;flex-direction:column;gap:2px}

.top h1{font-size:21px;flex:1;min-width:0}

.list{display:flex;flex-direction:column;gap:6px}

.row:hover{border-color:var(--accent)}

input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;max-width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.btn{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--bg)}

.link{background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--info-soft);color:var(--info);width:max-content}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.customs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.customs li{display:flex;gap:10px;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}
.customs li span{flex:1;min-width:0;overflow-wrap:anywhere}
.customs li b{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
.muted{color:var(--muted)}
h5{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;background:var(--bg);white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td input{width:100%}
td input.q{width:70px;text-align:right}
td input.p{width:116px;text-align:right}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font:700 15px var(--f-display);flex:none}
.thumb-prev{display:block;max-width:140px;max-height:110px;border-radius:6px;margin-top:6px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink);font-size:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font:700 28px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px}
.scrim{position:fixed;inset:0;background:rgba(5,15,18,.55);z-index:20}
.sheet{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet header{display:flex;justify-content:space-between;align-items:center}
.sheet footer{display:flex;justify-content:flex-end;gap:8px}
.sheet p{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.full{grid-column:1/-1}
.fld span{font-size:12px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{width:100%}
.qgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.drop{position:relative}
.dd{position:absolute;z-index:5;left:0;right:0;top:100%;margin-top:2px;background:var(--surface);border:1px solid var(--accent);border-radius:8px;max-height:260px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.dd button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.dd button:hover{background:var(--accent-soft)}
.dd small{color:var(--muted)}
.sel{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.sel div{min-width:0;overflow-wrap:anywhere}
.totals{margin-left:auto;width:min(340px,100%);display:flex;flex-direction:column;gap:4px}
.totals div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.totals .g{font:700 20px var(--f-display);border-top:2px solid var(--ink);padding-top:6px;margin-top:4px}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:500;max-width:calc(100% - 32px)}
@media (min-width:861px){.shell.wide{grid-template-columns:minmax(0,1fr)}.shell.wide .side{display:none}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));overflow-x:auto;gap:8px}
  .brand,.mode{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav button{white-space:nowrap;gap:6px}
  .split{grid-template-columns:1fr}
  .split.has-sel .list{display:none}
  .split:not(.has-sel) .detail{display:none}
  .back{display:block}
  .top{padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
  .work{padding:14px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .qgrid,.grid{grid-template-columns:1fr}
  .dhead h2{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.row,.btn{transition:border-color .12s}}
</style>
<div class="shell">
  <aside class="side">
    <div class="brand">Portafoglio<br>Agente<small>CRM</small></div>
    <nav class="nav" id="nav" aria-label="Sezioni"></nav>
    <div class="mode" id="mode"></div>
  </aside>
  <section class="main">
    <div class="top"><h1 id="title">Panoramica</h1><div class="search" id="searchBox"></div><div id="topAct" class="acts"></div></div>
    <div class="work" id="app"></div>
  </section>
</div>
<div id="modal"></div>
<div id="toastBox"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',useGrouping:'always'}).format(n||0);
const fmtQty=v=>{if(v===''||v==null)return '';const n=Number(typeof v==='number'?v:parseFloat(String(v).replace(',','.')));if(!isFinite(n))return String(v);const s=String(+n.toFixed(5)),neg=s[0]==='-',[i,f]=s.replace('-','').split('.');return (neg?'-':'')+i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(f?','+f:'')};
const qtyNum=v=>{let s=String(v==null?'':v).trim();if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');const n=parseFloat(s.replace(',','.'));return isFinite(n)?n:0};
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const r5=n=>Math.round((n+Number.EPSILON)*1e5)/1e5;
const eurp=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:5,useGrouping:'always'}).format(n||0);
const fix5=n=>String(r5(num(n)));
const today=()=>new Date().toISOString().slice(0,10);
const fdate=d=>d?d.split('-').reverse().join('/'):'';
const COLS=['clients','companies','items','quotes','plists','settings','sectors','marketing'];
const S={clients:[],companies:[],items:[],quotes:[],plists:[],settings:[],sectors:[],marketing:[]};
const byId=(c,id)=>S[c].find(d=>d.id===id);
let DB=null,ASSETS=null,DL=null,mode='local',capDone=false;
const ui={sector:'',view:'home',sel:null,q:'',itemQ:'',qid:null,status:''};
const TITLES={home:'Panoramica',clienti:'Clienti',settori:'Settori',marketing:'Marketing',mappa:'Mappa',aziende:'Aziende',preventivi:'Preventivi',ordini:'Ordini'};

/* ---------- sconti a cascata: "40+10+5" ---------- */
const cascade=s=>String(s||'').split(/[+\/]/).map(num).filter(x=>x>0).reduce((f,d)=>f*(1-d/100),1);
const effPct=s=>r2((1-cascade(s))*100);
const fmtDisc=s=>{s=String(s||'').trim();if(!s)return '—';return s.replace(/\./g,',')+'%'+(/[+\/]/.test(s)?' (= '+String(effPct(s)).replace('.',',')+'% effettivo)':'')};

/* prezzo netto di un articolo per un cliente: personalizzato > sconto base del cliente */
function priceFor(client,companyId,item){
  const L=(client&&client.links||[]).find(l=>l.companyId===companyId);
  const list=item.price||0;
  if(!L)return {net:list,how:'Listino'};
  const c=(L.customs||[]).find(x=>x.itemId===item.id);
  if(c)return c.type==='netto'?{net:num(c.value),how:'Netto personalizzato'}:{net:list*cascade(c.value),how:'Sconto personalizzato '+c.value+'%'};
  return {net:list*cascade(L.discount),how:L.discount?'Sconto base '+L.discount+'%':'Listino'};
}

/* ---------- salvataggio ---------- */
function lsLoad(){try{const j=JSON.parse(localStorage.getItem('portafoglio_v1')||'null');if(j)COLS.forEach(c=>S[c]=j[c]||[])}catch(e){}}
function lsSave(){try{localStorage.setItem('portafoglio_v1',JSON.stringify(S))}catch(e){toast('Memoria del browser piena: elimina qualche foto')}}
async function save(col,doc,quiet){
  const i=S[col].findIndex(d=>d.id===doc.id);
  if(i>=0)S[col][i]=doc;else S[col].push(doc);
  if(DB){try{await DB.collection(col).doc(doc.id).set(doc)}catch(e){toast('Salvataggio non riuscito ('+(e.code||'errore')+')')}}else lsSave();
  if(!quiet)render();
}
async function remove(col,id,quiet){
  S[col]=S[col].filter(d=>d.id!==id);
  if(DB){try{await DB.collection(col).doc(id).delete()}catch(e){}}else lsSave();
  if(!quiet)render();
}
let toastT;
function toast(m){const b=$('#toastBox');b.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>b.innerHTML='',3200)}
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
function softRender(){const a=document.activeElement;if(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&(ui.qid||ui.pl))return;render()}

/* ---------- foto ---------- */
function resizeImg(file,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',.82)};img.onerror=()=>rej(new Error('img'));img.src=u})}
const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function storePhoto(file){
  const b=await resizeImg(file,720);
  if(ASSETS){try{const r=await ASSETS.upload(b,{type:'image/jpeg'});return {photoId:r.id}}catch(e){}}
  return {photo:await blobToData(b)};
}
const photoSrc=i=>i.photoId?blobSrc(i.photoId):(i.photo||'');
const thumb=i=>photoSrc(i)?`<img class="thumb" src="${esc(photoSrc(i))}" alt="" loading="lazy">`:`<span class="thumb">${esc((i.name||i.code||'?').trim().charAt(0).toUpperCase())}</span>`;

/* ---------- modali ---------- */
function closeModal(){$('#modal').innerHTML=''}
function openForm(title,fields,vals,onSave,note){
  vals=vals||{};
  const body=fields.map(f=>{
    const v=vals[f.k]==null?'':vals[f.k],id='f_'+f.k;let inp;
    if(f.type==='textarea')inp=`<textarea id="${id}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    else if(f.type==='select')inp=`<select id="${id}">${f.opts.map(o=>{const a=Array.isArray(o)?o:[o,o];return `<option value="${esc(a[0])}" ${String(a[0])===String(v)?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`;
    else if(f.type==='image')inp=`<input id="${id}" type="file" accept="image/*">`+(vals._img?`<img class="thumb-prev" src="${esc(vals._img)}" alt="">`:'');
    else inp=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}" ${f.type==='number'?'step="any"':''} placeholder="${esc(f.ph||'')}">`;
    return `<label class="fld ${f.full?'full':''}"><span>${esc(f.label)}</span>${inp}</label>`}).join('');
  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><form class="sheet" id="theForm"><header><h3>${esc(title)}</h3><button type="button" class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>${note?`<p class="muted">${note}</p>`:''}<div class="grid">${body}</div><footer><button type="button" class="btn ghost" data-act="closeModal">Annulla</button><button class="btn pri" type="submit">Salva</button></footer></form>`;
  $('#theForm').onsubmit=async e=>{
    e.preventDefault();const o={};
    for(const f of fields){const el=$('#f_'+f.k);o[f.k]=f.type==='image'?el.files[0]:(f.type==='number'?num(el.value):el.value.trim())}
    const btn=e.target.querySelector('.pri');btn.disabled=true;btn.textContent='Salvo…';
    try{await onSave(o)}catch(err){toast('Operazione non riuscita')}
    closeModal();
  };
  const el=$('#f_'+fields[0].k);if(el)el.focus();
}
function confirmBox(msg,onYes,label){

}

<script>
const VAL_OPTS=['15 giorni dalla data del preventivo','30 giorni dalla data del preventivo','60 giorni dalla data del preventivo','90 giorni dalla data del preventivo','Fino a esaurimento scorte','Salvo venduto'];
const TR_OPTS=['Franco destino','Franco partenza','Porto franco','Porto assegnato','Ex works (ritiro a cura del cliente)','Corriere espresso a carico del cliente','Trasporto a nostro carico','Franco destino addebito in fattura'];
function trOpts(){return [...new Set([...S.quotes.map(x=>String(x.transport||'').trim()).filter(Boolean),...TR_OPTS])]}
/* ---------- PREVENTIVI ---------- */
const isOrd=q=>!!q&&q.kind==='ordine',qView=q=>isOrd(q)?'ordini':'preventivi',QS=()=>S.quotes.filter(q=>!isOrd(q)),OS=()=>S.quotes.filter(isOrd),qWord=q=>isOrd(q)?'ORDINE':'PREVENTIVO';
const ORD_ST=['Da evadere','In lavorazione','Spedito','Evaso','Annullato'];
const QST=['Bozza','Inviato','Accettato','Rifiutato'];
const qCls=s=>(s==='Accettato'||s==='Evaso')?'ok':(s==='Rifiutato'||s==='Annullato')?'bad':(s==='Inviato'||s==='In lavorazione'||s==='Spedito')?'warn':'';
function qTotals(q){
  const sub=r2((q.lines||[]).reduce((s,l)=>s+num(l.qty)*num(l.net),0)),vat=r2(sub*num(q.vat)/100),co=byId('companies',q.companyId);
  return {sub,vat,tot:r2(sub+vat),com:r2(sub*num(co&&co.commission)/100)};
}
const qCN=q=>{const c=byId('clients',clientIdOf(q));return c?c.name:(q.clientName||'')};
function quoteRow(q){
  const c=byId('clients',clientIdOf(q)),co=byId('companies',q.companyId);
  return `<button class="row" data-act="openQuote" data-id="${q.id}"><div class="r2"><b>${isOrd(q)?'Ord. ':'N. '}${esc(q.number)} · ${esc(qCN(q)||'Cliente non scelto')}</b><span class="pill ${qCls(q.status)}">${esc(q.status)}</span></div><div class="r2"><span>${esc(co?co.name:'Azienda non scelta')} · ${fdate(q.date)}</span><b>${eur(qTotals(q).sub)}</b></div></button>`;
}
function quotesList(){
  const q=QL(),L=S.quotes.filter(x=>(!ui.status||x.status===ui.status)&&(!q||[x.number,qCN(x),(byId('companies',x.companyId)||{}).name].some(v=>String(v||'').toLowerCase().includes(q)))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||String(b.number).localeCompare(String(a.number)));
  const f=`<div class="acts" style="margin-bottom:12px"><button class="btn sm ${ui.status?'':'pri'}" data-act="qStatus" data-s="">Tutti</button>${QST.map(s=>`<button class="btn sm ${ui.status===s?'pri':''}" data-act="qStatus" data-s="${s}">${s}</button>`).join('')}</div>`;
  if(!S.quotes.length)return `<div class="empty"><h3>Nessun preventivo</h3><span>Scegli il cliente e l'azienda: sconti e condizioni riservate si caricano da soli.</span><button class="btn pri" data-act="newQuote">Nuovo preventivo</button></div>`;
  return f+`<div class="list">${L.map(quoteRow).join('')||'<p class="muted">Nessun preventivo trovato.</p>'}</div>`;
}
function nextNumber(){
  const y=new Date().getFullYear(),max=QS().filter(q=>String(q.number).startsWith(y+'/')).reduce((m,q)=>Math.max(m,parseInt(String(q.number).split('/')[1],10)||0),0);
  return y+'/'+String(max+1).padStart(3,'0');
}
/* prezzo di una riga: netto personalizzato / sconto personalizzato del cliente, altrimenti sconto delle condizioni del preventivo */
function qPrice(q,it,qty){
  {const pr=plRow(clientIdOf(q),q.companyId,it.code,qty||1);if(pr)return plNet(pr)}
  const cl=byId('clients',clientIdOf(q)),L=cl&&(cl.links||[]).find(l=>l.companyId===q.companyId),c=L&&(L.customs||[]).find(x=>x.itemId===it.id);
  if(c)return c.type==='netto'?num(c.value):(it.price||0)*cascade(c.value);
  return (it.price||0)*cascade(q.discount);
}
function recalc(q){(q.lines||[]).forEach(l=>{
  if(l.manual)return;
  const it=l.itemId&&byId('items',l.itemId),code=it?it.code:(l.pl?l.code:null);if(code==null)return;
  const r=plRow(clientIdOf(q),q.companyId,code,num(l.qty)||1);
  if(r){l.list=num(r.price);l.net=r5(plNet(r));l.note='Scaglione da '+(r.qty||1)+' · sconti '+[r.sc1,r.sc2].filter(x=>x!==''&&x!=null).join('+')+(num(r.gift)?' · omaggio '+r.gift+'% incluso':'')}
  else if(it){l.list=it.price||0;l.net=r5(qPrice(q,it,l.qty));l.note=''}
})}
function applyConditions(q){
  const cl=byId('clients',clientIdOf(q)),L=cl&&(cl.links||[]).find(l=>l.companyId===q.companyId);
  if(L){q.discount=L.discount||'';if(L.payment)q.payment=L.payment}
  recalc(q);
}
function lineRow(q,l,i){
  const it=l.itemId&&byId('items',l.itemId),disc=l.list>0&&!l.manual&&it?(l.net<l.list?(l.net===0?'':'−'+String(r2((1-l.net/l.list)*100)).replace('.',',')+'%'):'—'):(l.list>0&&l.net<l.list?'−'+String(r2((1-l.net/l.list)*100)).replace('.',',')+'%':'—');
  return `<tr><td style="width:56px">${it?thumb(it):''}</td><td class="mono">${esc(l.code||'')}</td><td>${(l.itemId||l.pl)?`<b>${esc(l.name)}</b>${l.note?`<div class="muted">${esc(l.note)}</div>`:''}${l.gift?`<div class="muted">Omaggio riservato: ${esc(l.gift)}</div>`:''}`:`<input data-in="lineName" data-i="${i}" value="${esc(l.name||'')}" placeholder="Descrizione riga libera">`}</td><td class="num"><input class="q" type="number" step="any" min="0" data-in="lineQty" data-i="${i}" value="${l.qty}" aria-label="Quantità"></td><td class="num">${(l.itemId||l.pl)?eurp(l.list):`<input class="p" type="number" step="any" data-in="lineList" data-i="${i}" value="${l.list||0}" aria-label="Prezzo">`}</td>${(l.itemId||l.pl)?`<td class="num" id="ls_${i}">${disc}</td>`:`<td class="num"><input class="s" id="ld_${i}" data-in="lineDisc" data-i="${i}" value="${esc(l.disc||'')}" placeholder="40+10" aria-label="Sconto %"></td>`}<td class="num"><input class="p" id="net_${i}" type="number" step="any" data-in="lineNet" data-i="${i}" value="${fix5(l.net)}" aria-label="Prezzo netto"></td><td class="num" id="lt_${i}"><b>${eur(num(l.qty)*num(l.net))}</b></td><td><button class="x" data-act="delLine" data-i="${i}" aria-label="Rimuovi riga">×</button></td></tr>`;
}
function quoteEditor(q){
  const cl=byId('clients',clientIdOf(q)),co=byId('companies',q.companyId),T=qTotals(q);
  const linked=cl?(cl.links||[]).map(l=>l.companyId):[];
  const coOpts=[['','— scegli azienda —']].concat(S.companies.slice().sort((a,b)=>(linked.includes(b.id)-linked.includes(a.id))||a.name.localeCompare(b.name,'it')).map(c=>[c.id,(linked.includes(c.id)?'★ ':'')+c.name]));
  const L=cl&&(cl.links||[]).find(l=>l.companyId===q.companyId),nc=(L?(L.customs||[]).length:0)+((getPl(clientIdOf(q),q.companyId)||{rows:[]}).rows.length);
  const opt=(arr,v)=>arr.map(a=>{const x=Array.isArray(a)?a:[a,a];return `<option value="${esc(x[0])}" ${x[0]===v?'selected':''}>${esc(x[1])}</option>`}).join('');
  return `<div class="detail"><button class="back" style="display:block" data-act="closeQuote">← Tutti i preventivi</button>
  <div class="dhead"><div class="t"><h2>Preventivo ${esc(q.number)}</h2></div><div class="acts"><select id="qStatusSel" data-ch="qf" data-f="status" aria-label="Stato">${opt(QST,q.status)}</select><button class="btn" data-act="toggleWide">${ui.wide?'Mostra menu':'Allarga schermata'}</button><button class="btn pri" data-act="qPreview">Anteprima e stampa</button>${DL?`<button class="btn" data-act="exportCsv">Scarica CSV</button>`:''}<button class="btn" data-act="copyQuote">Copia riepilogo</button><button class="btn ghost danger" data-act="delAsk" data-col="quotes" data-id="${q.id}">Elimina</button></div></div>
  <div class="qgrid"><section class="sec"><header><h3>Cliente e azienda</h3></header>
    <div class="fld"><span>Cliente</span>${cl?`<div class="sel"><div>${qCode(q)?`<span class="chip">Cod. Cliente <b>${esc(qCode(q))}</b></span> `:''}<b>${esc(cl.name)}</b><br><span class="muted">${esc([cl.city,cl.phone,cl.email].filter(Boolean).join(' · '))}</span></div><button class="btn sm" data-act="clearClient">Cambia</button></div>`:q.clientName?`<div class="sel"><div><b>${esc(q.clientName)}</b><br><span class="muted">Nome scritto a mano, non ancora in anagrafica</span></div><div class="acts"><button class="btn sm" data-act="saveClientFromQuote">Salva in anagrafica</button><button class="btn sm" data-act="clearClient">Cambia</button></div></div>`:`<div class="drop"><select id="qClientSel" data-ch="qClientSel" aria-label="Scegli cliente"><option value="">▾ Scegli un cliente memorizzato…</option>${S.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'it')).map(c=>`<option value="${c.id}">${esc(c.name)}${c.city?' — '+esc(c.city):''}</option>`).join('')}</select><input id="qClientQ" data-in="qClientQ" placeholder="…oppure scrivi un nome nuovo" autocomplete="off"><div id="qClientDrop"></div></div>`}</div>
    <label class="fld"><span>Azienda per cui fai il preventivo</span><select id="qCompany" data-ch="qCompany">${opt(coOpts,q.companyId||'')}</select></label>
    ${co?`<div class="acts"><button class="btn sm" data-act="coFromQuote">Apri listino di ${esc(co.name)} (${S.items.filter(i=>i.companyId===co.id).length} articoli)</button></div>`:''}
    ${cl&&co?`<div class="acts"><button class="btn sm pri" data-act="plFromQuote">Apri listino personalizzato di ${esc(cl.name)}</button><span class="muted">${((getPl(clientIdOf(q),q.companyId)||{}).rows||[]).length} righe riservate</span></div>`:''}
    ${cl&&co&&!L?`<p class="muted">Questo cliente non ha ancora condizioni per ${esc(co.name)}. <button class="btn sm" data-act="linkFromQuote">Associa ora</button></p>`:''}
  </section>
  <section class="sec"><header><h3>Condizioni riservate al cliente</h3>${nc?`<span class="chip"><b>${nc}</b> prezzi personalizzati</span>`:''}</header>
    <div class="grid"><label class="fld"><span>Sconto base % (es. 40+10)</span><input id="qDisc" data-in="qDisc" value="${esc(q.discount||'')}" placeholder="nessuno"></label><label class="fld"><span>IVA %</span><input id="qVat" type="number" data-in="qf" data-f="vat" value="${q.vat}"></label>
    <label class="fld"><span>Pagamento</span><input data-in="qf" data-f="payment" value="${esc(q.payment||'')}"></label><label class="fld"><span>Resa / consegna</span><input data-in="qf" data-f="delivery" value="${esc(q.delivery||'')}"></label>
    <label class="fld"><span>Trasporto</span><input list="dlTr" data-in="qf" data-f="transport" value="${esc(q.transport||'')}" placeholder="Scrivi o scegli dal menu" autocomplete="off"><datalist id="dlTr">${trOpts().map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label><label class="fld"><span>Validità preventivo</span><input list="dlVal" data-in="qf" data-f="validity" value="${esc(q.validity||'')}" placeholder="Scrivi o scegli dal menu" autocomplete="off"><datalist id="dlVal">${VAL_OPTS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
    <label class="fld"><span>N. preventivo (uso interno, non stampato)</span><input data-in="qf" data-f="number" value="${esc(q.number||'')}"></label><label class="fld"><span>Data</span><input type="date" data-in="qf" data-f="date" value="${esc(q.date||'')}"></label></div>
  </section></div>
  <section class="sec"><header><h3>Articoli</h3><div class="acts">${(co||cl)?`<div class="drop"><input id="qItemQ" data-in="qItemQ" placeholder="${co?'Scrivi il codice o cerca nel listino di '+esc(co.name):'Scrivi il codice articolo'}" autocomplete="off" style="min-width:360px"><div id="qItemDrop"></div></div>`:'<span class="muted">Scegli prima l\'azienda</span>'}<button class="btn sm" data-act="addFree">+ Riga libera</button></div></header>
  ${q.lines.length?`<div class="tw"><table class="qt"><thead><tr><th>Foto</th><th>Articolo</th><th>Descrizione</th><th class="num">Quantità</th><th class="num">Prezzo</th><th class="num">SC 1</th><th class="num">SC 2</th><th class="num">Omaggio</th><th class="num">Netto finale</th><th class="num">Totale</th><th></th></tr></thead><tbody id="lines">${q.lines.map((l,i)=>lineRow(q,l,i)).join('')}</tbody></table></div>`:'<p class="muted">Nessun articolo. Cercane uno nel listino: il prezzo parte già con le condizioni del cliente.</p>'}
  <div class="totals"><div><span>Imponibile</span><b id="tSub">${eur(T.sub)}</b></div><div><span>IVA ${esc(q.vat)}%</span><span id="tVat">${eur(T.vat)}</span></div><div class="g"><span>Totale</span><span id="tTot">${eur(T.tot)}</span></div>${co&&co.commission?`<div class="muted"><span>Provvigione stimata (${esc(String(co.commission).replace('.',','))}%)</span><span id="tCom">${eur(T.com)}</span></div>`:''}</div></section>
  <section class="sec"><header><h3>Note per il cliente</h3></header><textarea rows="3" data-in="qf" data-f="notes">${esc(q.notes||'')}</textarea></section></div>`;
}
function patchQuote(q){
  q.lines.forEach((l,i)=>{const n=$('#net_'+i),t=$('#lt_'+i);if(n&&document.activeElement!==n)n.value=fix5(l.net);if(t)t.innerHTML='<b>'+eur(num(l.qty)*num(l.net))+'</b>';const s=$('#ls_'+i);if(s&&l.list>0)s.textContent=l.net<l.list?'−'+String(r2((1-l.net/l.list)*100)).replace('.',',')+'%':'—'});
  const T=qTotals(q);[['#tSub',T.sub],['#tVat',T.vat],['#tTot',T.tot],['#tCom',T.com]].forEach(([s,v])=>{const e=$(s);if(e)e.textContent=eur(v)});
}
function quoteText(q){
  const cl=byId('clients',clientIdOf(q))||{},co=byId('companies',q.companyId)||{},T=qTotals(q);
  return [`${qWord(q)} ${q.number} del ${fdate(q.date)}`,`Azienda: ${co.name||''}`,`Cliente: ${qCN(q)}`,'',...q.lines.map(l=>`- ${l.code?l.code+' ':''}${l.name} | ${l.qty} x ${eurp(l.net)} = ${eur(num(l.qty)*num(l.net))}`),'',`Imponibile: ${eur(T.sub)}`,`IVA ${q.vat}%: ${eur(T.vat)}`,`Totale: ${eur(T.tot)}`,'',q.discount?`Sconto applicato: ${q.discount}%`:'',q.delivery?`Resa: ${q.delivery}`:'',q.notes||''].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n');
}
function quoteHtml(q){
  const cl=byId('clients',clientIdOf(q))||{},co=byId('companies',q.companyId)||{},T=qTotals(q);
  return `<!doctype html><html lang="it"><meta charset="utf-8"><title>Preventivo ${esc(q.number)}</title><style>body{font:14px/1.5 Arial,sans-serif;color:#17222b;max-width:820px;margin:30px auto;padding:0 20px}h1{font-size:24px;margin:0}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{padding:7px 8px;border-bottom:1px solid #ccd;text-align:left}th.n,td.n{text-align:right}.t{margin-left:auto;width:280px}.t div{display:flex;justify-content:space-between}.g{font-weight:700;font-size:18px;border-top:2px solid #17222b;margin-top:6px;padding-top:6px}.m{color:#5b6a73}</style><h1>PREVENTIVO ${esc(q.number)}</h1><p class="m">del ${fdate(q.date)}</p><p><b>${esc(co.name||'')}</b><br>${esc(addr(co))}<br>${esc(co.phone||'')} ${esc(co.email||'')}</p><p><b>Spett.le ${esc(qCN(q))}</b><br>${esc(addr(cl))}</p><table><tr><th>Codice</th><th>Descrizione</th><th class="n">Qtà</th><th class="n">Prezzo netto</th><th class="n">Totale</th></tr>${q.lines.map(l=>`<tr><td>${esc(l.code||'')}</td><td>${esc(l.name)}</td><td class="n">${esc(l.qty)}</td><td class="n">${eurp(l.net)}</td><td class="n">${eur(num(l.qty)*num(l.net))}</td></tr>`).join('')}</table><div class="t"><div><span>Imponibile</span><span>${eur(T.sub)}</span></div><div><span>IVA ${esc(q.vat)}%</span><span>${eur(T.vat)}</span></div><div class="g"><span>Totale</span><span>${eur(T.tot)}</span></div></div><p>${''}${q.delivery?'<b>Resa:</b> '+esc(q.delivery)+'<br>':''}${esc(q.notes||'')}</p></html>`;
}
function quoteCsv(q){return 'Codice;Descrizione;Quantita;Netto;Totale\n'+q.lines.map(l=>[l.code||'',l.name,l.qty,String(r5(num(l.net))).replace('.',','),(num(l.qty)*num(l.net)).toFixed(2).replace('.',',')].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n')}

/* ---------- PANORAMICA ---------- */
function home(){
  if(!S.clients.length&&!S.companies.length&&!QS().length)return `<div class="empty" style="max-width:560px;margin:30px auto"><h3>Il tuo portafoglio è vuoto</h3><span>Inizia da un'azienda che rappresenti e dal suo listino, poi aggiungi i clienti. Oppure guarda come funziona con dati di esempio, che puoi eliminare in qualsiasi momento.</span><div class="acts"><button class="btn pri" data-act="newCompany">Nuova azienda</button><button class="btn" data-act="newClient">Nuovo cliente</button><button class="btn" data-act="sample">Carica dati di esempio</button></div></div>`;
  const open=QS().filter(q=>q.status==='Inviato'),acc=QS().filter(q=>q.status==='Accettato'),sum=a=>a.reduce((s,q)=>s+qTotals(q).sub,0);
  const rec=QS().slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,6);
  return `<div class="detail"><div class="stats"><div class="stat"><b>${S.clients.length}</b><span>Clienti</span></div><div class="stat"><b>${S.companies.length}</b><span>Aziende rappresentate</span></div><div class="stat"><b>${S.items.length}</b><span>Articoli a listino</span></div><div class="stat"><b>${eur(sum(open))}</b><span>${open.length} preventivi in attesa di risposta</span></div><div class="stat"><b>${eur(sum(acc))}</b><span>${acc.length} preventivi accettati</span></div></div>
  <section class="sec"><header><h3>Riepilogo preventivi</h3></header><div class="stats"><div class="stat"><b>${QS().length}</b><span>Preventivi in totale</span></div><div class="stat"><b>${QS().filter(q=>(q.date||'').slice(0,4)===String(new Date().getFullYear())).length}</b><span>Preventivi ${new Date().getFullYear()}</span></div><div class="stat"><b>${QS().filter(q=>(q.date||'').slice(0,7)===new Date().toISOString().slice(0,7)).length}</b><span>Preventivi questo mese</span></div><div class="stat"><b>${eur(sum(QS()))}</b><span>Valore totale (imponibile)</span></div>${QST.map(s=>`<div class="stat"><b>${QS().filter(q=>q.status===s).length}</b><span>${esc(s)}</span></div>`).join('')}</div></section>
  <section class="sec"><header><h3>Ultimi preventivi</h3><button class="btn sm pri" data-act="newQuote">Nuovo preventivo</button></header>${rec.length?`<div class="list">${rec.map(quoteRow).join('')}</div>`:'<p class="muted">Ancora nessun preventivo.</p>'}</section></div>`;
}
</script>
<script>
/* ---------- render ---------- */
function setView(v){ui.sector='';ui.pl=null;ui.retQ=null;ui.view=v;ui.sel=null;ui.q='';ui.itemQ='';ui.qid=null;ui.status='';try{history.replaceState(null,'','#'+v)}catch(e){}render()}
function render(){
  if(ui.sel&&!byId(ui.view==='clienti'?'clients':'companies',ui.sel))ui.sel=null;
  if(ui.qid&&!byId('quotes',ui.qid))ui.qid=null;
  if(!ui.qid)ui.qprev=false;
  const navs=[['home','Panoramica',''],['clienti','Clienti',S.clients.length],['settori','Settori',S.sectors.length],['aziende','Aziende',S.companies.length],['preventivi','Preventivi',QS().length],['ordini','Ordini',OS().length],['marketing','Marketing',S.marketing.length],['mappa','Mappa','']];
  $('#nav').innerHTML=navs.map(n=>`<button data-act="nav" data-v="${n[0]}" ${ui.view===n[0]?'aria-current="page"':''}><span>${n[1]}</span><span class="n">${n[2]}</span></button>`).join('')+'<button data-act="editMe"><span>La mia azienda</span><span class="n">logo</span></button>';
  $('#mode').textContent=mode==='cloud'?'Dati salvati nell\'archivio di questa pagina, condivisi con chi ha accesso.':'Archivio condiviso non disponibile: i dati restano solo in questo browser.';
  $('#title').textContent=ui.qid?(isOrd(Q())?'Ordine':'Preventivo'):ui.pl?'Listino personalizzato':TITLES[ui.view];
  const listView=['clienti','aziende','preventivi','ordini'].includes(ui.view)&&!ui.qid&&!ui.pl;
  $('#searchBox').innerHTML=listView?`<input id="gq" data-in="gq" type="search" placeholder="Cerca ${ui.view==='clienti'?'cliente, città, contatto':ui.view==='aziende'?'azienda':ui.view==='ordini'?'ordine, cliente, azienda':'preventivo, cliente, azienda'}…" value="${esc(ui.q)}" aria-label="Cerca">`:'';
  const btn={clienti:['newClient','+ Nuovo cliente'],aziende:['newCompany','+ Nuova azienda'],preventivi:['newQuote','+ Nuovo preventivo'],ordini:['newOrder','+ Nuovo ordine'],settori:['newSector','+ Nuovo settore'],marketing:['mkNew','+ '+(MK_T[ui.mk||'campioni'].new)]}[ui.view];
  $('#topAct').innerHTML=btn&&!ui.qid&&!ui.pl?`<button class="btn pri" data-act="${btn[0]}">${btn[1]}</button>`:'';
  let h='';
  if(ui.view==='home')h=home();
  else if(ui.view==='clienti'&&ui.pl)h=plistView();
  else if(ui.view==='clienti'){const c=ui.sel&&byId('clients',ui.sel);h=`<div class="split ${c?'has-sel':''}">${clientList()}${c?clientDetail(c):'<div class="empty detail"><span>Seleziona un cliente per vedere anagrafica, contatti e condizioni.</span></div>'}</div>`}
  else if(ui.view==='aziende'){const c=ui.sel&&byId('companies',ui.sel);h=`<div class="split h ${c?'has-sel':''}">${companyList()}${c?companyDetail(c):'<div class="empty detail"><span>Seleziona un\'azienda per vedere contatti e listino.</span></div>'}</div>`}
  else if(ui.view==='settori')h=sectorsView();
  else if(ui.view==='marketing')h=marketingView();
  else if(ui.view==='mappa')h=mappaView();
  else h=ui.qid?(ui.qprev?quotePreview(byId('quotes',ui.qid)):quoteEditor(byId('quotes',ui.qid))):quotesList();
  document.querySelector('.shell').classList.toggle('wide',!!(ui.wide&&ui.qid));
  const w=$('#app'),st=w.scrollTop;w.innerHTML=banner()+h;w.scrollTop=st;
}
function rerenderKeep(){const a=document.activeElement,id=a&&a.id,p=a&&a.selectionStart;render();if(id){const e=$('#'+id);if(e){e.focus();try{e.setSelectionRange(p,p)}catch(_){}}}}
const Q=()=>byId('quotes',ui.qid);
const saveQ=debounce(()=>{const q=Q();if(q)save('quotes',q,true)},500);

/* ---------- azioni ---------- */
const ent=(col,id)=>byId(col,id);
const ACT={
  nav:d=>setView(d.v),
  itemMore:()=>{ui.itemLim=(ui.itemLim||200)+200;render()},
  itemAll:()=>{ui.itemLim=1e9;render()},
  closeModal:()=>closeModal(),
  sel:d=>{ui.sel=d.id;ui.itemQ='';ui.itemLim=200;render();$('#app').scrollTop=0},
  back:()=>{ui.sel=null;render()},
  gotoClient:d=>{ui.view='clienti';ui.sel=d.id;ui.q='';render()},
  newClient:()=>openForm('Nuovo cliente',CLIENT_F,{status:'Attivo'},async o=>{const c={...o,id:uid(),contacts:[],links:[]};await save('clients',c,true);ui.view='clienti';ui.sel=c.id;ui.q='';render()}),
  editClient:d=>{const c=ent('clients',d.id);openForm('Modifica cliente',CLIENT_F,c,o=>save('clients',{...c,...o}))},
  newCompany:()=>openForm('Nuova azienda',COMPANY_F,{},async o=>{const c={...o,id:uid(),contacts:[]};await save('companies',c,true);ui.view='aziende';ui.sel=c.id;ui.q='';render()}),
  editCompany:d=>{const c=ent('companies',d.id);openForm('Modifica azienda',COMPANY_F,c,o=>save('companies',{...c,...o}))},
  addContact:d=>{const e=ent(d.col,d.id);openForm('Nuovo contatto di riferimento',CONTACT_F,{},o=>save(d.col,{...e,contacts:[...(e.contacts||[]),o]}))},
  editContact:d=>{const e=ent(d.col,d.id),i=+d.i;openForm('Modifica contatto',CONTACT_F,e.contacts[i],o=>{const cs=e.contacts.slice();cs[i]=o;return save(d.col,{...e,contacts:cs})})},
  delContact:d=>{const e=ent(d.col,d.id);save(d.col,{...e,contacts:e.contacts.filter((_,i)=>i!==+d.i)})},
  addLink:d=>{const c=ent('clients',d.id),used=(c.links||[]).map(l=>l.companyId),free=S.companies.filter(x=>!used.includes(x.id));
    if(!free.length){toast(S.companies.length?'Tutte le aziende sono già associate':'Crea prima un\'azienda nella sezione Aziende');return}
    openForm('Associa azienda a '+c.name,[{k:'companyId',label:'Azienda',type:'select',opts:free.map(x=>[x.id,x.name]),full:true},...LINK_F],{},o=>save('clients',{...c,links:[...(c.links||[]),{...o,customs:[]}]}))},
  editLink:d=>{const c=ent('clients',d.id),L=c.links.find(l=>l.companyId===d.co);openForm('Condizioni · '+(ent('companies',d.co)||{}).name,LINK_F,L,o=>save('clients',{...c,links:c.links.map(l=>l.companyId===d.co?{...l,...o}:l)}))},
  delLink:d=>{const c=ent('clients',d.id);confirmBox('Scollegare l\'azienda da questo cliente? Si perdono sconto base e prezzi personalizzati.',async()=>{const P=getPl(d.id,d.co);if(P)await remove('plists',P.id,true);await save('clients',{...c,links:c.links.filter(l=>l.companyId!==d.co)})})},

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ---------- importazione listino da Excel / CSV ---------- */
const IMP={companyId:'',wb:null,sheet:'',rows:[],hdr:0,map:{},update:true,fname:'',err:''};
const IMP_F=[['code','Codice articolo *'],['name','Descrizione *'],['price','Prezzo di listino *'],['unit','Unità di misura'],['desc','Descrizione estesa / note']];
const IMP_G={code:/cod|sku|^art|ref|item/i,name:/descr|nome|denom|prodotto|articolo|title/i,price:/prez|listino|€|eur|price|importo|netto/i,unit:/^(um|u\.?m\.?|unit|uni)/i,desc:/note|dettagl|caratt|estes|misure|formato/i};
function parsePrice(v){
  if(typeof v==='number')return isFinite(v)?v:null;
  let s=String(v==null?'':v).replace(/[€\s]|eur/gi,'');if(!/\d/.test(s))return null;
  if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');
  const n=parseFloat(s);return isFinite(n)?n:null;
}
function impGuessHeader(){
  const lim=Math.min(IMP.rows.length-1,12);let best=0;
  for(let r=0;r<lim;r++){if(IMP.rows[r].filter(c=>String(c).trim()&&isNaN(parsePrice(c))||typeof c==='string'&&/[a-z]/i.test(c)).length>=2){best=r;break}}
  IMP.hdr=best;
}
function impGuessMap(){
  const h=IMP.rows[IMP.hdr]||[],used=new Set();IMP.map={};
  for(const [k] of IMP_F){IMP.map[k]=-1;const i=h.findIndex((c,j)=>!used.has(j)&&IMP_G[k].test(String(c)));if(i>=0){IMP.map[k]=i;used.add(i)}}
}
function impLoadSheet(){
  const ws=IMP.wb.Sheets[IMP.sheet];
  IMP.rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
  impGuessHeader();impGuessMap();
}
function impBuild(){
  const by=new Map();let skip=0;
  for(let r=IMP.hdr+1;r<IMP.rows.length;r++){
    const row=IMP.rows[r],g=k=>IMP.map[k]>=0?row[IMP.map[k]]:'';
    const code=String(g('code')).trim(),name=String(g('name')).trim(),price=parsePrice(g('price'));
    if(!code||!name||price==null){skip++;continue}
    by.set(code,{code,name,desc:String(g('desc')).trim(),unit:String(g('unit')).trim()||'pz',price:r5(price)});
  }
  const items=[...by.values()],ex=new Set(S.items.filter(i=>i.companyId===IMP.companyId).map(i=>i.code));
  return {items,skip,upd:items.filter(i=>ex.has(i.code)).length};
}
function impModal(){
  const h=IMP.rows[IMP.hdr]||[],ncol=IMP.rows.slice(0,60).reduce((m,r)=>Math.max(m,r.length),0);
  const colOpts=sel=>`<option value="-1">— nessuna —</option>`+Array.from({length:ncol},(_,i)=>`<option value="${i}" ${sel===i?'selected':''}>${XLSX.utils.encode_col(i)} · ${esc(String(h[i]||'').slice(0,28))}</option>`).join('');
  const B=impBuild(),prev=impBuildPreview();
  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet" style="width:min(900px,calc(100% - 24px))"><header><h3>Importa listino · ${esc((byId('companies',IMP.companyId)||{}).name||'')}</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>
  <p class="muted">File: <b>${esc(IMP.fname)}</b> · ${IMP.rows.length} righe lette</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    ${IMP.wb.SheetNames.length>1?`<label class="fld"><span>Foglio</span><select data-imp="sheet">${IMP.wb.SheetNames.map(n=>`<option ${n===IMP.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`:''}
    <label class="fld"><span>Riga delle intestazioni</span><input type="number" min="1" max="${IMP.rows.length}" value="${IMP.hdr+1}" data-imp="hdr"></label>
    ${IMP_F.map(([k,l])=>`<label class="fld"><span>${l}</span><select data-imp="map" data-k="${k}">${colOpts(IMP.map[k])}</select></label>`).join('')}
  </div>
  <div class="tw"><table style="min-width:520px"><thead><tr><th>Codice</th><th>Descrizione</th><th>UM</th><th class="num">Prezzo letto</th></tr></thead><tbody>${prev||'<tr><td colspan="4" class="muted">Scegli le colonne per vedere l\'anteprima.</td></tr>'}</tbody></table></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-imp="upd" ${IMP.update?'checked':''}> Aggiorna gli articoli già presenti con lo stesso codice (le foto restano)</label>
  <p><b>${B.items.length-(IMP.update?0:B.upd)}</b> articoli da importare${IMP.update&&B.upd?` (di cui <b>${B.upd}</b> aggiornamenti)`:''}${B.skip?` · <span style="color:var(--warn)">${B.skip} righe scartate perché senza codice, descrizione o prezzo</span>`:''}</p>
  <footer><button class="btn ghost" data-act="closeModal">Annulla</button><button class="btn pri" data-act="impGo" ${B.items.length?'':'disabled'}>Importa</button></footer></div>`;
}
function impBuildPreview(){
  const out=[];for(let r=IMP.hdr+1;r<IMP.rows.length&&out.length<5;r++){const row=IMP.rows[r],g=k=>IMP.map[k]>=0?row[IMP.map[k]]:'',p=parsePrice(g('price'));
    out.push(`<tr><td class="mono">${esc(g('code'))}</td><td>${esc(g('name'))}</td><td>${esc(g('unit'))}</td><td class="num">${p==null?'<span class="muted">?</span>':eurp(p)}</td></tr>`)}
  return out.join('');
}
function impStart(companyId){
  Object.assign(IMP,{companyId,wb:null,rows:[],update:true,fname:''});
  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet"><header><h3>Importa listino</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>
  <p>Carica il file del listino in formato <b>Excel (.xlsx, .xls)</b> o <b>CSV</b>. Nel passaggio successivo scegli quali colonne sono codice, descrizione e prezzo.</p>
  <label class="fld"><span>File del listino</span><input type="file" accept=".xlsx,.xls,.csv,.ods,.txt" data-imp="file"></label>
  <p class="muted" id="impErr" style="color:var(--bad)"></p>
  <p class="muted">Le foto non vengono lette dal file: aggiungile poi articolo per articolo.</p>
  <footer><button class="btn ghost" data-act="importText" data-id="${companyId}">Incolla testo invece</button><button class="btn ghost" data-act="closeModal">Annulla</button></footer></div>`;
}
document.addEventListener('change',async e=>{
  const t=e.target,k=t.dataset&&t.dataset.imp;if(!k)return;
  if(k==='file'){
    const f=t.files[0];if(!f)return;const er=$('#impErr');er.textContent='Leggo il file…';
    try{
      if(typeof XLSX==='undefined')throw new Error('lib');
      const buf=await f.arrayBuffer();
      IMP.wb=XLSX.read(buf,{type:'array',cellDates:false});IMP.fname=f.name;IMP.sheet=IMP.wb.SheetNames[0];impLoadSheet();
      if(!IMP.rows.length){er.textContent='Il file è vuoto.';return}
      impModal();
    }catch(err){er.textContent=typeof XLSX==='undefined'?'Lettore Excel non caricato: controlla la connessione e riprova.':'Non riesco a leggere questo file. Prova a salvarlo di nuovo come .xlsx o .csv.'}
  }
  else if(k==='sheet'){IMP.sheet=t.value;impLoadSheet();impModal()}
  else if(k==='hdr'){IMP.hdr=Math.max(0,Math.min(IMP.rows.length-1,(parseInt(t.value,10)||1)-1));impGuessMap();impModal()}
  else if(k==='map'){IMP.map[t.dataset.k]=parseInt(t.value,10);impModal()}
  else if(k==='upd'){IMP.update=t.checked;impModal()}
});
ACT.importItems=d=>impStart(d.id);
ACT.importText=d=>ACT.importTextOld(d);
ACT.importTextOld=d=>openForm('Importa da testo',[{k:'text',label:'Una riga per articolo: codice ; descrizione ; prezzo ; UM',type:'textarea',rows:9,full:true,ph:'AB-100;Piatto doccia 80x120;245,00;pz'}],{},async o=>{
  let n=0;for(const line of o.text.split(/\r?\n/)){const p=line.split(/;|\t/).map(s=>s.trim());if(p.length<3||!p[0]||parsePrice(p[2])==null)continue;
    const old=S.items.find(i=>i.companyId===d.id&&i.code===p[0]);await save('items',{...(old||{}),id:old?old.id:uid(),companyId:d.id,code:p[0],name:p[1],description:old?old.description:'',unit:p[3]||'pz',price:parsePrice(p[2])},true);n++}
  render();toast(n?n+' articoli importati':'Nessuna riga valida')});
ACT.impGo=async()=>{
  const B=impBuild(),btn=document.querySelector('[data-act="impGo"]');if(btn){btn.disabled=true;btn.textContent='Importo…'}
  let n=0,u=0;const list=B.items.filter(it=>IMP.update||!S.items.some(x=>x.companyId===IMP.companyId&&x.code===it.code));
  for(let i=0;i<list.length;i+=10){
    await Promise.all(list.slice(i,i+10).map(it=>{
      const old=S.items.find(x=>x.companyId===IMP.companyId&&x.code===it.code);if(old)u++;
      n++;return save('items',{...(old||{}),id:old?old.id:uid(),companyId:IMP.companyId,code:it.code,name:it.name,description:it.desc||(old?old.description:'')||'',unit:it.unit,price:it.price},true)}));
  }
  closeModal();render();toast(n+' articoli importati'+(u?' ('+u+' aggiornati)':''));
};
</script>
<script>
/* ---------- variazione prezzi e svuotamento listino ---------- */
const parsePct=v=>{const n=num(v);return isFinite(n)?n:0};
ACT.priceAll=d=>{
  const its=S.items.filter(i=>i.companyId===d.id),co=byId('companies',d.id);
  openForm('Aumenta o riduci tutto il listino',[{k:'pct',label:'Variazione % (es. 5 per +5%, -3 per ridurre del 3%)',type:'number',full:true}],{pct:''},async o=>{
    const p=parsePct(o.pct);if(!p||p<=-100){toast('Inserisci una percentuale valida, diversa da zero');return}
    for(let i=0;i<its.length;i+=10)await Promise.all(its.slice(i,i+10).map(it=>save('items',{...it,price:r5((it.price||0)*(1+p/100))},true)));
    render();toast('Prezzi '+(p>0?'aumentati':'ridotti')+' del '+String(Math.abs(p)).replace('.',',')+'% su '+its.length+' articoli');
  },'Si applica a tutti i <b>'+its.length+'</b> articoli di '+esc(co?co.name:'')+'. I prezzi vengono arrotondati al centesimo. Gli sconti dei clienti restano invariati e si applicano al nuovo listino; i prezzi netti personalizzati non cambiano.');
};

<script>
/* ---------- importazione condizioni riservate al cliente da Excel / CSV ---------- */
const C={clientId:'',companyId:'',wb:null,sheet:'',rows:[],hdr:0,map:{},replace:false,fname:'',mode:'auto'};
const C_F=[['code','Codice (o "codice - descrizione") *'],['desc','Descrizione'],['qty','Quantità'],['price','Prezzo'],['d1','Sconto 1'],['d2','Sconto 2'],['gift','Omaggio'],['total','Totale netto scontato']];
const C_G={code:/cod|sku|^art|ref|item/i,desc:/descr|nome|denom|prodotto/i,qty:/q\.?t|quant|^qty|pezz|^nr|^n\./i,price:/prezz|listino|price|unitar/i,d1:/(sconto|sc\.?|disc).*1|^s1|^1/i,d2:/(sconto|sc\.?|disc).*2|^s2|^2/i,gift:/omagg|gratis|free|reg/i,total:/total|netto|importo|valore/i};
function cLoad(){
  C.rows=XLSX.utils.sheet_to_json(C.wb.Sheets[C.sheet],{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
  C.hdr=0;const lim=Math.min(C.rows.length-1,12);
  for(let r=0;r<lim;r++){if(C.rows[r].filter(c=>typeof c==='string'&&/[a-z]/i.test(c)).length>=2){C.hdr=r;break}}
  cGuess();
}
function cGuess(){
  const h=C.rows[C.hdr]||[],used=new Set();C.map={};
  for(const [k] of C_F){C.map[k]=-1;const i=h.findIndex((c,j)=>!used.has(j)&&C_G[k].test(String(c).trim()));if(i>=0){C.map[k]=i;used.add(i)}}
}
function cDisc(v){
  if(typeof v==='number')return v>0&&v<1?String(r2(v*100)):(v>0?String(v):'');
  const s=String(v==null?'':v).replace(/[%\s]/g,'').replace(/,/g,'.');return /^\d+(\.\d+)?$/.test(s)&&parseFloat(s)>0?s:'';
}
function cFind(by,byName,rawCode,desc){
  const full=rawCode.trim().toLowerCase();let it=by.get(full),d=desc;
  if(!it){const m=rawCode.split(/\s+[-–—]\s+/);if(m.length>1){const c=m[0].trim().toLowerCase();it=by.get(c);if(it&&!d)d=m.slice(1).join(' - ')}}
  if(!it&&d)it=byName.get(String(d).trim().toLowerCase());if(!it)it=byName.get(full);
  return {it,desc:d};
}
function cBuild(){
  const its=S.items.filter(i=>i.companyId===C.companyId),by=new Map(its.map(i=>[i.code.trim().toLowerCase(),i])),byName=new Map(its.map(i=>[i.name.trim().toLowerCase(),i]));
  const ok=new Map(),miss=[],pre=[];let skip=0;
  for(let r=C.hdr+1;r<C.rows.length;r++){
    const row=C.rows[r],g=k=>C.map[k]>=0?row[C.map[k]]:'',raw=String(g('code')).trim();if(!raw){skip++;continue}
    const f=cFind(by,byName,raw,String(g('desc')).trim()),it=f.it;
    const q=num(g('qty')),fp=parsePrice(g('price')),tot=parsePrice(g('total')),disc=[cDisc(g('d1')),cDisc(g('d2'))].filter(Boolean).join('+'),gift=String(g('gift')).trim().replace(/^0$/,'');
    const unit=tot!=null&&tot>0&&q>0?r2(tot/q):(tot!=null&&tot>0&&!(q>0)?null:null);
    let cond=null;
    const asDisc=disc?{type:'sconto',value:disc}:null,asNet=unit!=null?{type:'netto',value:String(unit).replace('.',',')}:(fp!=null&&fp>0&&!disc?{type:'netto',value:String(r2(fp)).replace('.',',')}:null);
    if(C.mode==='sconti')cond=asDisc||asNet;else if(C.mode==='netto')cond=asNet||asDisc;else cond=asDisc||asNet;
    const diff=it&&fp!=null&&fp>0&&it.price>0&&Math.abs(fp-it.price)/it.price>0.005?fp:null;
    if(pre.length<6)pre.push({code:raw,it,cond,gift,diff});
    if(!cond&&!gift){skip++;continue}
    if(!it){miss.push(raw);continue}
    ok.set(it.id,{itemId:it.id,type:cond?cond.type:'sconto',value:cond?cond.value:'',...(q>0?{qty:q}:{}),...(gift?{gift}:{})});
  }
  return {conds:[...ok.values()].filter(x=>x.value!==''),miss,skip,pre,gifts:[...ok.values()].filter(x=>x.value==='').length};
}
function cModal(){
  const h=C.rows[C.hdr]||[],ncol=C.rows.slice(0,60).reduce((m,r)=>Math.max(m,r.length),0),B=cBuild(),cl=byId('clients',C.clientId),co=byId('companies',C.companyId);
  const opts=sel=>`<option value="-1">— nessuna —</option>`+Array.from({length:ncol},(_,i)=>`<option value="${i}" ${sel===i?'selected':''}>${XLSX.utils.encode_col(i)} · ${esc(String(h[i]||'').slice(0,28))}</option>`).join('');
  const prev=B.pre.map(p=>`<tr><td class="mono">${esc(p.code)}</td><td>${p.it?esc(p.it.name):'<span style="color:var(--warn)">non presente nel listino</span>'}${p.diff!=null?`<div class="muted">Prezzo nel file ${eurp(p.diff)}, nel tuo listino ${eurp(p.it.price)}</div>`:''}</td><td class="num">${p.cond?(p.cond.type==='netto'?'Netto '+eur(num(p.cond.value)):'Sconto '+esc(p.cond.value)+'%'):'<span class="muted">—</span>'}${p.gift?`<div class="muted">Omaggio: ${esc(p.gift)}</div>`:''}</td></tr>`).join('');
  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet" style="width:min(900px,calc(100% - 24px))"><header><h3>Importa condizioni · ${esc(cl?cl.name:'')} · ${esc(co?co.name:'')}</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>
  <p class="muted">File: <b>${esc(C.fname)}</b> · ${C.rows.length} righe lette. Gli articoli si riconoscono dal codice (o, in mancanza, dalla descrizione) nel listino dell'azienda.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
   ${C.wb.SheetNames.length>1?`<label class="fld"><span>Foglio</span><select data-cimp="sheet">${C.wb.SheetNames.map(n=>`<option ${n===C.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`:''}
   <label class="fld"><span>Riga delle intestazioni</span><input type="number" min="1" max="${C.rows.length}" value="${C.hdr+1}" data-cimp="hdr"></label>
   ${C_F.map(([k,l])=>`<label class="fld"><span>${l}</span><select data-cimp="map" data-k="${k}">${opts(C.map[k])}</select></label>`).join('')}
   <label class="fld"><span>Condizione da salvare</span><select data-cimp="mode"><option value="auto" ${C.mode==='auto'?'selected':''}>Automatica: sconti, altrimenti netto</option><option value="sconti" ${C.mode==='sconti'?'selected':''}>Sempre gli sconti 1 + 2</option><option value="netto" ${C.mode==='netto'?'selected':''}>Sempre prezzo netto (totale ÷ quantità)</option></select></label></div>
  <p class="muted">Sconto 1 e sconto 2 diventano uno sconto a cascata (es. 40+10). Il prezzo netto si ricava dal totale netto diviso la quantità. L'omaggio e la quantità vengono salvati come nota sull'articolo.</p>
  <div class="tw"><table style="min-width:520px"><thead><tr><th>Codice</th><th>Articolo</th><th class="num">Condizione letta</th></tr></thead><tbody>${prev||'<tr><td colspan="3" class="muted">Scegli le colonne per vedere l\'anteprima.</td></tr>'}</tbody></table></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-cimp="rep" ${C.replace?'checked':''}> Sostituisci tutte le condizioni personalizzate esistenti di questa azienda (altrimenti si aggiornano solo gli articoli presenti nel file)</label>
  <p><b>${B.conds.length}</b> condizioni da importare${B.miss.length?` · <span style="color:var(--warn)">${B.miss.length} articoli non trovati nel listino${B.miss.length<=8?': '+esc(B.miss.join(', ')):''}</span>`:''}${B.skip?` · ${B.skip} righe senza condizione`:''}</p>
  <footer><button class="btn ghost" data-act="closeModal">Annulla</button><button class="btn pri" data-act="cGo" ${B.conds.length?'':'disabled'}>Importa condizioni</button></footer></div>`;
}
ACT.impCond=d=>{
  if(!S.items.some(i=>i.companyId===d.co)){toast('Il listino di questa azienda è vuoto: caricalo prima');return}
  Object.assign(C,{clientId:d.id,companyId:d.co,wb:null,rows:[],replace:false,fname:'',mode:'auto'});
  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet"><header><h3>Importa condizioni da Excel</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>
  <p>Carica un file <b>Excel (.xlsx, .xls)</b> o <b>CSV</b> con le colonne: <b>codice - descrizione, quantità, prezzo, sconto 1, sconto 2, omaggio, totale netto scontato</b>. Nel passaggio successivo controlli come sono state riconosciute.</p>
  <label class="fld"><span>File delle condizioni</span><input type="file" accept=".xlsx,.xls,.csv,.ods,.txt" data-cimp="file"></label><p id="cErr" style="color:var(--bad)"></p>
  <footer><button class="btn ghost" data-act="closeModal">Annulla</button></footer></div>`;
};
document.addEventListener('change',async e=>{
  const t=e.target,k=t.dataset&&t.dataset.cimp;if(!k)return;
  if(k==='file'){
    const f=t.files[0];if(!f)return;const er=$('#cErr');er.textContent='Leggo il file…';
    try{if(typeof XLSX==='undefined')throw 0;C.wb=XLSX.read(await f.arrayBuffer(),{type:'array'});C.fname=f.name;C.sheet=C.wb.SheetNames[0];cLoad();if(!C.rows.length){er.textContent='Il file è vuoto.';return}cModal()}
    catch(err){er.textContent=typeof XLSX==='undefined'?'Lettore Excel non caricato: controlla la connessione e riprova.':'Non riesco a leggere questo file. Prova a salvarlo di nuovo come .xlsx o .csv.'}
  }
  else if(k==='sheet'){C.sheet=t.value;cLoad();cModal()}
  else if(k==='hdr'){C.hdr=Math.max(0,Math.min(C.rows.length-1,(parseInt(t.value,10)||1)-1));cGuess();cModal()}
  else if(k==='map'){C.map[t.dataset.k]=parseInt(t.value,10);cModal()}
  else if(k==='mode'){C.mode=t.value;cModal()}
  else if(k==='rep'){C.replace=t.checked;cModal()}
});
ACT.cGo=async()=>{
  const B=cBuild(),c=byId('clients',C.clientId);if(!c)return;
  const links=(c.links||[]).map(l=>{if(l.companyId!==C.companyId)return l;const keep=C.replace?[]:(l.customs||[]).filter(x=>!B.conds.some(n=>n.itemId===x.itemId));return {...l,customs:[...keep,...B.conds]}});
  closeModal();await save('clients',{...c,links});toast(B.conds.length+' condizioni importate'+(B.miss.length?' · '+B.miss.length+' articoli non trovati':''));
};

<script>
/* ---------- listino personalizzato per cliente e azienda (struttura del file Excel) ---------- */
const plId=(c,co)=>c+'_'+co;
const getPl=(c,co)=>byId('plists',plId(c,co));
const nrm=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,'').replace(/^0+/,'');
const plNet=r=>num(r.price)*(1-num(r.sc1)/100)*(1-num(r.sc2)/100)*(100/(100+num(r.gift)));
const fmtNet=r=>r.price===''||r.price==null?'':plNet(r).toLocaleString('it-IT',{minimumFractionDigits:5,maximumFractionDigits:5});
function plRow(clientId,companyId,code,qty){
  const P=clientId&&companyId&&getPl(clientId,companyId);if(!P)return null;
  const k=nrm(code);if(!k)return null;
  const ok=r=>r.price!==''&&r.price!=null;
  let t=P.rows.filter(r=>nrm(r.code)===k&&ok(r)),approx=false;
  if(!t.length&&k.length>=6){
    const cs=[...new Set(P.rows.filter(ok).map(r=>nrm(r.code)).filter(c=>c.length>=6&&c!==k&&(c.startsWith(k)||k.startsWith(c))))];
    if(cs.length===1){t=P.rows.filter(r=>nrm(r.code)===cs[0]&&ok(r));approx=true}
  }
  if(!t.length)return null;
  t=t.slice().sort((a,b)=>num(a.qty)-num(b.qty));
  let best=null;for(const r of t){if(num(r.qty)<=qty)best=r}
  const r=best||t[0];return approx?{...r,_approx:true}:r;
}
function plVirtual(q,v){
  const P=clientIdOf(q)&&q.companyId&&getPl(clientIdOf(q),q.companyId);if(!P||!v)return '';
  const known=new Set(S.items.filter(i=>i.companyId===q.companyId).map(i=>nrm(i.code))),seen=new Set(),out=[];
  for(const r of P.rows){const k=nrm(r.code);if(!k||known.has(k)||seen.has(k))continue;
    if(String(r.code).toLowerCase().includes(v)||String(r.desc).toLowerCase().includes(v)){seen.add(k);out.push(r)}
    if(out.length>=8)break}
  return out.map(r=>`<button type="button" data-act="addPl" data-code="${esc(r.code)}"><span><b>${esc(r.code)}</b> · ${esc(r.desc)}<br><small>Dal listino personalizzato · netto ${eurp(plNet(plRow(clientIdOf(q),q.companyId,r.code,1)))}</small></span></button>`).join('');
}
function ensurePl(c,co){let P=getPl(c,co);if(!P){P={id:plId(c,co),clientId:c,companyId:co,rows:[]};S.plists.push(P)}return P}
const savePl=debounce(()=>{if(!ui.pl)return;const P=getPl(ui.pl.clientId,ui.pl.companyId);if(!P)return;
  if(JSON.stringify(P).length>240000)toast('Listino molto grande: oltre ~1500 righe potrebbe non salvarsi');save('plists',P,true)},600);

function plistView(){
  const {clientId,companyId}=ui.pl,c=byId('clients',clientId),co=byId('companies',companyId);
  if(!c||!co){ui.pl=null;return ''}
  const P=getPl(clientId,companyId),rows=(P&&P.rows)||[],q=(ui.pl.q||'').trim().toLowerCase();
  const inp=(i,f,v,cls,type)=>`<input ${cls?`class="${cls}"`:''} ${type==='n'?'type="number" step="any"':''} data-in="plc" data-i="${i}" data-f="${f}" value="${esc(v==null?'':v)}">`;
  const body=rows.map((r,i)=>({r,i})).filter(({r})=>!q||String(r.code).toLowerCase().includes(q)||String(r.desc).toLowerCase().includes(q)).map(({r,i})=>
   `<tr><td>${inp(i,'code',r.code,'mono')}</td><td>${inp(i,'desc',r.desc)}</td><td class="num">${inp(i,'qty',r.qty,'q','n')}</td><td class="num">${inp(i,'price',r.price,'p','n')}</td><td class="num">${inp(i,'sc1',r.sc1,'s','n')}</td><td class="num">${inp(i,'sc2',r.sc2,'s','n')}</td><td class="num">${inp(i,'gift',r.gift,'s','n')}</td><td class="num net" id="plnet_${i}"><b>${fmtNet(r)}</b></td>${ui.retQ?`<td><button class="btn sm pri" data-act="plToQuote" data-i="${i}">Aggiungi al preventivo</button></td>`:''}<td><button class="x" data-act="plDel" data-i="${i}" aria-label="Elimina riga">×</button></td></tr>`).join('');
  return `<div class="detail"><button class="back" style="display:block" data-act="plBack">${ui.retQ?'← Torna al preventivo':'← '+esc(c.name)}</button>
  <div class="dhead"><div class="t"><h2>Listino personalizzato</h2><span class="muted">${esc(c.name)} · ${esc(co.name)} · ${rows.length} righe</span></div>
  <div class="acts"><input id="plq" data-in="plq" type="search" placeholder="Cerca articolo o descrizione" value="${esc(ui.pl.q||'')}"><button class="btn" data-act="plImport">Importa Excel</button><button class="btn" data-act="plExport">${rows.length?'Esporta Excel':'Scarica modello Excel'}</button><button class="btn" data-act="plCopy">Copia per Excel</button><button class="btn pri" data-act="plAdd">+ Riga</button>${rows.length?'<button class="btn ghost danger" data-act="plClear">Svuota</button>':''}</div></div>
  <div class="formula"><b>Prezzo netto finale</b> = Prezzo × (1 − SC 1) × (1 − SC 2) × 100 ÷ (100 + Omaggio). Lo stesso articolo può comparire su più righe, una per ogni scaglione di quantità: nel preventivo vale lo scaglione più alto raggiunto.</div>
  ${rows.length?`<div class="tw"><table class="plt" style="min-width:900px"><thead><tr><th>Articolo</th><th>Descrizione</th><th class="num">Quantità</th><th class="num">Prezzo</th><th class="num">SC 1</th><th class="num">SC 2</th><th class="num">Omaggio</th><th class="num">Prezzo netto finale</th>${ui.retQ?'<th></th>':''}<th></th></tr></thead><tbody>${body||'<tr><td colspan="10" class="muted">Nessuna riga trovata.</td></tr>'}</tbody></table></div>`
   :`<div class="empty"><h3>Il listino personalizzato è vuoto</h3><span>Importa il file Excel con le colonne Articolo, Descrizione, Quantità, Prezzo, SC 1, SC 2, Omaggio, oppure aggiungi le righe a mano.</span><div class="acts"><button class="btn pri" data-act="plImport">Importa Excel</button><button class="btn" data-act="plAdd">+ Riga</button></div></div>`}</div>`;
}
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;if(!k||!ui.pl)return;
  if(k==='plq'){ui.pl.q=t.value;rerenderKeep();return}
  if(k==='plc'){const P=getPl(ui.pl.clientId,ui.pl.companyId);if(!P)return;const r=P.rows[+t.dataset.i],f=t.dataset.f;if(!r)return;
    r[f]=(f==='code'||f==='desc')?t.value:(t.value===''?'':(f==='qty'?qtyNum(t.value):num(t.value)));
    const n=$('#plnet_'+t.dataset.i);if(n)n.innerHTML='<b>'+fmtNet(r)+'</b>';savePl()}
});
Object.assign(ACT,{
  plOpen:d=>{ui.retQ=null;ui.view='clienti';ui.pl={clientId:d.id,companyId:d.co,q:''};render();$('#app').scrollTop=0},
  plToQuote:d=>{const q=ui.retQ&&byId('quotes',ui.retQ),P=ui.pl&&getPl(ui.pl.clientId,ui.pl.companyId),r=P&&P.rows[+d.i];if(!q||!r)return;
    if(!String(r.code||'').trim()){toast('La riga non ha un codice articolo');return}
    ensureCompany(q);const qty=Math.max(1,num(r.qty)),c=lineCond(q,r.code,qty);
    if(!c){toast('Articolo non trovato nel listino');return}
    const l={id:uid(),qty};applyCond(l,c);q.lines.push(l);recalc(q);save('quotes',q,true);toast('Aggiunto al preventivo: '+r.code+' · quantità '+qty+' ('+q.lines.length+' righe)')},
  plBack:()=>{ui.pl=null;if(ui.retQ){const q=byId('quotes',ui.retQ);ui.view=qView(q);ui.qid=ui.retQ;ui.retQ=null;if(q){recalc(q);save('quotes',q,true)}}render()},
  plFromQuote:()=>{const q=Q();ui.retQ=q.id;ui.qid=null;ui.view='clienti';ui.sel=null;ui.pl={clientId:clientIdOf(q),companyId:q.companyId,q:''};render();$('#app').scrollTop=0},
  plAdd:()=>{const P=ensurePl(ui.pl.clientId,ui.pl.companyId);P.rows.push({code:'',desc:'',qty:1,price:'',sc1:'',sc2:'',gift:''});save('plists',P,true);ui.pl.q='';render();const a=document.querySelectorAll('[data-f="code"]');if(a.length)a[a.length-1].focus()},
  plDel:d=>{const P=getPl(ui.pl.clientId,ui.pl.companyId);P.rows.splice(+d.i,1);save('plists',P,true);render()},

  addPl:d=>{const q=Q(),r=plRow(clientIdOf(q),q.companyId,d.code,1);if(!r)return;
    const l={id:uid(),itemId:'',pl:true,code:r.code,name:r.desc,qty:1,list:0,net:0};q.lines.push(l);recalc(q);save('quotes',q,true);render()},

/* Esporta nello stesso formato che il programma importa (e che hai nel file Esinplast). Senza righe o come "modello" produce il foglio vuoto da compilare. */
async function plExportRows(cid,coid,tpl){
  const P=getPl(cid,coid),c=byId('clients',cid),co=byId('companies',coid),rows=tpl?[]:((P&&P.rows)||[]);
  const total=Math.max(rows.length,tpl||!rows.length?50:0),last=total+2;
  const aoa=[['Articolo','Descrizione','Quantità','Prezzo','SC 1','SC 2','Omaggio','Prezzo netto finale'],[]];
  rows.forEach(r=>aoa.push([r.code,r.desc,r.qty,r.price,r.sc1,r.sc2,r.gift]));
  if(typeof XLSX==='undefined'){toast('Lettore Excel non caricato: controlla la connessione');return}
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  for(let n=3;n<=last;n++){const r=rows[n-3];
    ws['H'+n]={t:'n',f:`D${n}*(1-E${n}/100)*(1-F${n}/100)*(100/(100+G${n}))`,v:r&&r.price!==''?plNet(r):0,z:'0.00000'};
    if(ws['C'+n])ws['C'+n].z='#,##0';if(ws['D'+n])ws['D'+n].z='#,##0.00000';['E','F','G'].forEach(x=>{if(ws[x+n])ws[x+n].z='#,##0.00'})}
  ws['!ref']='A1:H'+last;ws['!cols']=[{wch:14},{wch:60},{wch:10},{wch:11},{wch:7},{wch:7},{wch:9},{wch:19}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');
  const d=new Date(),ds=String(d.getDate()).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0')+d.getFullYear(),slug=s=>String(s).replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
  const name=(tpl||!rows.length?'Modello_Listino_Personalizzato_':'Listino_Personalizzato_')+slug(co.name)+'_'+slug(c.name)+'_'+ds+'.xlsx';
  const tsv=plTsv(rows,last);
  if(DL){
    try{await DL.save({filename:name,data:XLSX.write(wb,{bookType:'xlsx',type:'array'})});toast('File salvato');return}
    catch(e){if(e&&e.code==='declined')return;plCopyModal(tsv,'Il download del file non è riuscito ('+((e&&e.code)||'errore')+').');return}
  }
  plCopyModal(tsv,'In questa vista non è possibile scaricare file.');
}
const tsvN=v=>v===''||v==null?'':String(v).replace('.',',');
function plTsv(rows,last){
  const L=[['Articolo','Descrizione','Quantità','Prezzo','SC 1','SC 2','Omaggio','Prezzo netto finale'].join('\t'),''];
  for(let n=3;n<=last;n++){const r=rows[n-3]||{};
    const code=r.code==null?'':String(r.code),desc=String(r.desc==null?'':r.desc).replace(/[\t\r\n]+/g,' ');
    L.push([/^0\d/.test(code)?"'"+code:code,desc,tsvN(r.qty),tsvN(r.price),tsvN(r.sc1),tsvN(r.sc2),tsvN(r.gift),`=D${n}*(1-E${n}/100)*(1-F${n}/100)*(100/(100+G${n}))`].join('\t'))}
  return L.join('\n');
}
function plCopyModal(tsv,why){

/* lettura del file: struttura Articolo | Descrizione | Quantità | Prezzo | SC 1 | SC 2 | Omaggio | (Prezzo netto finale) */
const PI={rows:[],fname:'',append:false};
function plSc(v){if(typeof v==='number')return v>0&&v<1?r5(v*100):(v>0?v:'');const s=String(v==null?'':v).replace(/[%\s]/g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)&&n>0?n:''}
function plParse(rows){
  let h=-1;for(let r=0;r<Math.min(rows.length,12);r++){const j=rows[r].map(x=>String(x).trim().toLowerCase());if(j.some(x=>/^(articolo|codice|cod)/.test(x))&&j.some(x=>/prezz/.test(x))){h=r;break}}
  const hd=h>=0?rows[h].map(x=>String(x).trim().toLowerCase()):[],f=(re,def)=>{const i=hd.findIndex(x=>re.test(x));return i>=0?i:(h>=0?-1:def)};
  const m={code:f(/^(articolo|codice|cod)/,0),desc:f(/descr/,1),qty:f(/quant|q\.?t/,2),price:h>=0?hd.findIndex(x=>/prezz/.test(x)&&!/netto|final/.test(x)):3,sc1:f(/sc\.?\s*1|sconto\s*1/,4),sc2:f(/sc\.?\s*2|sconto\s*2/,5),gift:f(/omagg/,6)};
  const start=h>=0?h+1:(parsePrice(rows[0]&&rows[0][3])==null?1:0),g=(row,k)=>m[k]>=0?row[m[k]]:'',out=[];let skip=0;
  for(let r=start;r<rows.length;r++){const row=rows[r],code=String(g(row,'code')).trim(),price=parsePrice(g(row,'price'));
    if(!code||price==null){if(row.some(x=>String(x).trim()!==''))skip++;continue}
    const qty=parsePrice(g(row,'qty')),gift=parsePrice(g(row,'gift'));
    out.push({code,desc:String(g(row,'desc')).trim(),qty:qty==null?'':qty,price,sc1:plSc(g(row,'sc1')),sc2:plSc(g(row,'sc2')),gift:gift>0?gift:''})}
  return {rows:out,skip,found:h>=0};
}

  <p><b>${PI.rows.length}</b> righe da importare${info.skip?` · <span style="color:var(--warn)">${info.skip} righe scartate perché senza articolo o senza prezzo</span>`:''}</p>
  ${has?`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-pli="append" ${PI.append?'checked':''}> Aggiungi alle ${P.rows.length} righe esistenti (altrimenti il listino attuale viene sostituito)</label>`:''}

document.addEventListener('change',async e=>{

function qItemDrop(q,val){
