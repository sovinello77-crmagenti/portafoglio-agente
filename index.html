<script>
/* ---------- Dai contatti agli agenti: selezione senza riscrivere ---------- */
const AGM={q:'',sel:new Set(),co:'',move:true,cid:'',only:false};
const AG_RE=/\b(agente|agenti|ag)\b\.?/i;
const agIsGuess=c=>AG_RE.test(String(c.name||''))||AG_RE.test(String(c.role||''));
function agmRows(){
  const q=AGM.q.trim().toLowerCase(),rows=[];
  S.clients.forEach(cl=>{if(AGM.cid&&cl.id!==AGM.cid)return;(cl.contacts||[]).forEach((c,i)=>{
    const dup=(cl.agents||[]).some(a=>(a.email&&c.email&&a.email.toLowerCase()===c.email.toLowerCase())||String(a.name||'').toLowerCase()===String(c.name||'').toLowerCase());
    if(dup)return;if(AGM.only&&!agIsGuess(c))return;
    if(q&&!(cl.name+' '+(c.name||'')+' '+(c.role||'')+' '+(c.email||'')).toLowerCase().includes(q))return;
    rows.push({cl,c,i,k:cl.id+'|'+i})})});
  return rows.sort((a,b)=>a.cl.name.localeCompare(b.cl.name,'it')||String(a.c.name).localeCompare(String(b.c.name),'it'));
}
function agmList(){
  const rows=agmRows(),sh=rows.slice(0,300);
  return sh.map(r=>`<label style="display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-bottom:1px solid var(--line,#e3e6ea);cursor:pointer"><input type="checkbox" style="flex:none;margin-top:3px" data-agmk="${r.k}" ${AGM.sel.has(r.k)?'checked':''}><span><b>${esc(r.c.name||'Senza nome')}</b>${r.c.role?' <span class="muted">· '+esc(r.c.role)+'</span>':''}${agIsGuess(r.c)?' <span style="background:#e6f3f1;border-radius:10px;padding:0 7px;font-size:12px">sembra un agente</span>':''}<div class="muted">${esc(r.cl.name)}${r.c.email?' · '+esc(r.c.email):''}${r.c.mobile||r.c.phone?' · '+esc(r.c.mobile||r.c.phone):''}</div></span></label>`).join('')||'<p class="muted">Nessun contatto da mostrare.</p>'+(rows.length>300?`<p class="muted">Mostrati i primi 300 di ${rows.length}: usa la ricerca.</p>`:'');
}
function agmModal(){
  const n=AGM.sel.size;
  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet" style="width:min(820px,calc(100% - 24px));max-height:94vh;overflow:auto"><header><h3>Seleziona gli agenti tra i contatti</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>
  <p class="muted">Spunta i contatti che sono agenti: diventano agenti del cliente (sezione «Agenti») con nome, email e telefono già pronti, senza riscriverli.</p>
  <div class="acts" style="gap:10px;flex-wrap:wrap;margin-bottom:8px"><input data-agmq="1" placeholder="Cerca cliente, nome, ruolo, email" value="${esc(AGM.q)}" style="min-width:260px"><label class="chk" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-agmonly="1" ${AGM.only?'checked':''}> Solo quelli con «agente» nel nome o nel ruolo</label><button class="btn sm" data-act="agmAll">Spunta tutti quelli mostrati</button><button class="btn sm" data-act="agmNone">Togli tutte le spunte</button></div>
  <div style="max-height:48vh;overflow:auto;border:1px solid var(--line,#dde);border-radius:8px;padding:2px 8px" id="agmList">${agmList()}</div>
  <div style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><label>Azienda per cui lavorano: <select data-agmco="1"><option value="">Tutte le aziende</option>${S.companies.slice().sort((a,b)=>a.name.localeCompare(b.name,'it')).map(c=>`<option value="${c.id}" ${AGM.co===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
  <label class="chk" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-agmmove="1" ${AGM.move?'checked':''}> Toglili dai contatti (altrimenti restano anche lì)</label></div>
  <footer><span id="agmN" class="muted" style="margin-right:auto">${n} selezionati</span><button class="btn ghost" data-act="closeModal">Annulla</button><button class="btn pri" data-act="agmGo">Segna come agenti</button></footer></div>`;
}
async function agmGo(){
  if(!AGM.sel.size){toast('Spunta almeno un contatto');return}
  const by={};AGM.sel.forEach(k=>{const [cid,i]=k.split('|');(by[cid]=by[cid]||[]).push(+i)});let n=0;
  for(const cid in by){const cl=byId('clients',cid);if(!cl)continue;const c={...cl,contacts:(cl.contacts||[]).map(x=>({...x})),agents:(cl.agents||[]).map(x=>({...x}))};
    for(const i of by[cid].sort((a,b)=>a-b)){const ct=c.contacts[i];if(!ct)continue;
      const clean=String(typeof soName==='function'?soName(ct.name||'',cl.name):ct.name||'').replace(/\b(agente|ag)\b\.?/ig,'').replace(/\s+/g,' ').replace(/^[\s\-–]+|[\s\-–]+$/g,'').trim()||ct.name||'';
      c.agents.push({name:clean,email:ct.email||ct.emailPers||'',phone:ct.mobile||ct.phone||'',companyId:AGM.co,listini:'',cataloghi:'',notes:[clean!==ct.name?'Da contatti: '+ct.name:'',ct.role||'',ct.notes||''].filter(Boolean).join('\n')});n++}
    if(AGM.move)c.contacts=c.contacts.filter((x,i)=>!by[cid].includes(i));
    await save('clients',c,true)}
  AGM.sel=new Set();closeModal();render();toast(n+' agenti creati'+(AGM.move?' e tolti dai contatti':''));
}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.agmq!=null){AGM.q=t.value;const l=$('#agmList');if(l)l.innerHTML=agmList()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(!d)return;
  if(d.agmk!=null){t.checked?AGM.sel.add(d.agmk):AGM.sel.delete(d.agmk);const n=$('#agmN');if(n)n.textContent=AGM.sel.size+' selezionati'}
  else if(d.agmonly!=null){AGM.only=t.checked;agmModal()}
  else if(d.agmco!=null)AGM.co=t.value;
  else if(d.agmmove!=null)AGM.move=t.checked;
  else if(d.soag!=null){const [i,j]=d.soag.split('|');SO.groups[+i].cx[+j].ag=t.checked}});
Object.assign(ACT,{
  agmOpen:d=>{AGM.cid=(d&&d.id)||'';AGM.q='';AGM.only=false;AGM.sel=new Set();
    agmRows().forEach(r=>{if(agIsGuess(r.c))AGM.sel.add(r.k)});agmModal()},
  agmAll:()=>{agmRows().slice(0,300).forEach(r=>AGM.sel.add(r.k));agmModal()},
  agmNone:()=>{AGM.sel=new Set();agmModal()},
  agmGo:()=>agmGo()
});
const _clientListG=clientList;
clientList=function(){return _clientListG().replace('data-act="soOpen">Importa contatti Outlook</button>','data-act="soOpen">Importa contatti Outlook</button><button class="btn sm" data-act="agmOpen">Segna agenti dai contatti</button>')};
const _clDetG=clientDetail;
clientDetail=function(c){return _clDetG(c).replace('data-act="addContact" data-col="clients" data-id="'+c.id+'">+ Aggiungi contatto</button>','data-act="addContact" data-col="clients" data-id="'+c.id+'">+ Aggiungi contatto</button><button class="btn sm" data-act="agmOpen" data-id="'+c.id+'">Segna agenti</button>')};

/* pulsante «È un agente» su ogni contatto della scheda cliente */
ACT.agFromC=d=>{
  const cl=byId('clients',d.id),ct=cl&&(cl.contacts||[])[+d.i];if(!ct)return;
  const clean=String(typeof soName==='function'?soName(ct.name||'',cl.name):ct.name||'').replace(/\b(agente|ag)\b\.?/ig,'').replace(/\s+/g,' ').replace(/^[\s\-–]+|[\s\-–]+$/g,'').trim()||ct.name||'';
  openForm('Segna come agente · '+(ct.name||''),[
    {k:'name',label:'Nome dell\'agente',full:true},
    {k:'companyId',label:'Azienda per cui lavora (vuoto = tutte)',type:'select',opts:[['','Tutte le aziende'],...S.companies.map(x=>[x.id,x.name])]},
    {k:'listini',label:'Riceve i listini ufficiali',type:'select',opts:[['','Sì'],['no','No']]},
    {k:'cataloghi',label:'Riceve i cataloghi',type:'select',opts:[['','Sì'],['no','No']]},
    {k:'move',label:'Toglilo dai contatti',type:'select',opts:[['si','Sì, sposta tra gli agenti'],['no','No, tienilo anche tra i contatti']]}],
    {name:clean,companyId:'',listini:'',cataloghi:'',move:'si'},
    async o=>{const c={...cl,contacts:(cl.contacts||[]).map(x=>({...x})),agents:(cl.agents||[]).map(x=>({...x}))};
      c.agents.push({name:o.name||clean,email:ct.email||ct.emailPers||'',phone:ct.mobile||ct.phone||'',companyId:o.companyId||'',listini:o.listini||'',cataloghi:o.cataloghi||'',notes:[o.name&&o.name!==ct.name?'Da contatti: '+ct.name:'',ct.role||'',ct.notes||''].filter(Boolean).join('\n')});
      if(o.move!=='no')c.contacts.splice(+d.i,1);
      await save('clients',c,true);render();toast((o.name||clean)+' è ora tra gli agenti')},
    'Nome, email e telefono vengono presi dal contatto: non serve riscriverli.');
};
const _clDetG2=clientDetail;
clientDetail=function(c){return _clDetG2(c).replace(/<button class="btn sm" data-act="editContact" data-col="clients" data-id="([^"]+)" data-i="(\d+)">Modifica<\/button>/g,(m,id,i)=>'<button class="btn sm" data-act="agFromC" data-id="'+id+'" data-i="'+i+'">È un agente</button>'+m)};
/* importazione Outlook: i contatti «agente» vanno direttamente tra gli agenti */
(function(){
  const g0=soFill;soFill=function(g){g0(g);g.cx.forEach(o=>{if(o.ag==null)o.ag=!g.mand&&o.m<0&&agIsGuess(o.c)})};
  const gh=soGroupHtml;soGroupHtml=function(g,i){return gh(g,i).replace(/<td style="width:150px">(<b style="color:#8a5a00">nuovo contatto<\/b>)/g,(m,x)=>m)};
  const gH=soGroupHtml;
  soGroupHtml=function(g,i){let h=gH(g,i),j=-1;
    return h.replace(/(<input type="checkbox" data-soc="(\d+)\|(\d+)"[^>]*>)([\s\S]*?)<td style="width:150px">(<b style="color:#8a5a00">nuovo contatto<\/b>)/g,(m,a,ii,jj,mid,tag)=>{const o=g.cx[+jj];return a+mid+'<td style="width:190px">'+tag+(g.mand?'':`<label style="display:block;margin-top:4px"><input type="checkbox" data-soag="${ii}|${jj}" ${o&&o.ag?'checked':''}> è un agente</label>`)})};
  const go0=soGo;
  soGo=async function(){
    SO.groups.forEach(g=>{if(g.mand||g.mode==='skip')return;const ag=g.cx.filter(o=>o.inc&&o.ag&&o.m<0);if(!ag.length)return;
      g.agOut=ag;ag.forEach(o=>{o._inc=o.inc;o.inc=false})});
    const pend=SO.groups.filter(g=>g.agOut);
    await go0();
    for(const g of pend){let c=g.mode==='update'?byId('clients',g.cid):S.clients.find(x=>svName(x.name)===svName(g.name));if(!c)continue;
      c={...c,agents:(c.agents||[]).map(x=>({...x}))};
      g.agOut.forEach(o=>{const k=o.c;if(c.agents.some(a=>(a.email&&k.email&&a.email===k.email)||a.name===k.name))return;c.agents.push({name:String(k.name||'').replace(/\b(agente|ag)\b\.?/ig,'').replace(/\s+/g,' ').replace(/^[\s\-–]+|[\s\-–]+$/g,'').trim()||k.name,email:k.email||k.emailPers||'',phone:k.mobile||k.phone||'',companyId:'',listini:'',cataloghi:'',notes:[k.role||'',k.notes||''].filter(Boolean).join('\n')})});
      await save('clients',c,true)}
    render();
  };
  ACT.soGo=()=>soGo();
})();
</script>
<script>
/* ---------- Prezzi di riferimento nelle offerte: listino del cliente, minimo e massimo dei listini personalizzati ---------- */
function prNet(r){return num(r.price)*(1-num(r.sc1)/100)*(1-num(r.sc2)/100)}
function prRow(rows,qty){let best=null;rows.forEach(r=>{if(num(r.qty||1)<=qty)best=r});return best||rows.slice().sort((a,b)=>num(a.qty)-num(b.qty))[0]}
function prInfo(q,code,qty){
  const k=nrm(code);if(!q||!k||!q.companyId)return null;qty=qty>0?qty:1;const cid=clientIdOf(q);let mine=null,all=[];
  S.plists.forEach(p=>{if(p.companyId!==q.companyId||!(p.rows||[]).length)return;
    const rows=p.rows.filter(r=>nrm(r.code)===k);if(!rows.length)return;const r=prRow(rows,qty),n=prNet(r);if(!(n>0))return;
    const c=byId('clients',p.clientId),e={name:c?c.name:'?',net:n,own:p.clientId===cid,tier:num(r.qty||1)};all.push(e);if(e.own)mine=e});
  if(!all.length)return null;
  all.sort((a,b)=>a.net-b.net);return {mine,min:all[0],max:all[all.length-1],n:all.length};
}
function prHtml(q,code,qty){
  const i=prInfo(q,code,qty);if(!i)return '';
  const own=i.mine?'Listino personalizzato del cliente: <b>'+eurp(i.mine.net)+'</b>'+(i.mine.tier>1?' (da '+fmtQty(i.mine.tier)+' pz)':''):'';
  const rng=i.n>1||!i.mine?'Listini dei clienti: min <b>'+eurp(i.min.net)+'</b> ('+esc(i.min.name)+') · max <b>'+eurp(i.max.net)+'</b> ('+esc(i.max.name)+') · '+i.n+(i.n===1?' listino':' listini'):'';
  return [own,rng].filter(Boolean).join(' · ');
}
const _nlLookupP=nlLookup;
nlLookup=function(){_nlLookupP();const q=Q(),c=$('#nlCode'),d=$('#nlDesc');if(!q||!c||!d||/non trovato|nessun articolo/i.test(d.textContent))return;
  const ql=$('#nlQty'),h=prHtml(q,c.value.trim(),num(ql&&ql.value)||1);if(h)d.insertAdjacentHTML('beforeend','<div data-pr="1" style="color:#0b5a55">'+h+'</div>')};
document.addEventListener('input',e=>{if(e.target.id==='nlQty'){const d=$('#nlDesc'),c=$('#nlCode'),q=Q();if(!d||!c||!q)return;const m=d.querySelectorAll('[data-pr]');m.forEach(x=>x.remove());const h=prHtml(q,c.value.trim(),num(e.target.value)||1);if(h)d.insertAdjacentHTML('beforeend','<div data-pr="1" style="color:#0b5a55">'+h+'</div>')}});
const _lineRowP=lineRow;
lineRow=function(q,l,i){const h=_lineRowP(q,l,i);if(!(l.itemId||l.pl))return h;const t=prHtml(q,l.code,num(l.qty)||1);return t?h.replace('</b>','</b><div class="muted" style="font-size:12px">'+t+'</div>'):h};
</script>
<script>
/* ---------- Sedi / magazzini del cliente ---------- */
const SITE_F=[{k:'name',label:'Nome della sede (es. Magazzino Livorno)',full:true},{k:'address',label:'Indirizzo',full:true},{k:'zip',label:'CAP'},{k:'city',label:'Città'},{k:'prov',label:'Provincia (sigla)'},{k:'phone',label:'Telefono',type:'tel'},{k:'email',label:'Email',type:'email'},{k:'notes',label:'Note (orari, referente per la consegna…)',type:'textarea',full:true}];
const siteLine=s=>[s.address,[s.zip,s.city].filter(Boolean).join(' '),s.prov?'('+s.prov+')':''].filter(Boolean).join(', ');
function siteSection(c){
  const S2=c.sites||[],cs=c.contacts||[];
  const cards=S2.map(s=>{const mem=cs.filter(x=>x.siteId===s.id);
    return `<article class="card"><header><div><h4>${esc(s.name||'Sede')}</h4><div class="role">${esc(siteLine(s))}</div></div><div class="acts"><button class="btn sm" data-act="siteEdit" data-id="${c.id}" data-sid="${s.id}">Modifica</button><button class="x" data-act="siteDel" data-id="${c.id}" data-sid="${s.id}" aria-label="Elimina sede">×</button></div></header>
    ${s.phone?`<div class="ln"><i>Telefono</i>${telL(s.phone)}</div>`:''}${s.email?`<div class="ln"><i>Email</i>${mailL(s.email)}</div>`:''}${s.notes?`<div class="muted">${esc(s.notes)}</div>`:''}
    <h5 style="margin:8px 0 2px">Contatti della sede</h5>${mem.length?mem.map(x=>`<div style="padding:3px 0;border-top:1px solid var(--line,#e3e6ea)"><b>${esc(x.name||'Senza nome')}</b>${x.role?' <span class="muted">· '+esc(x.role)+'</span>':''}<div class="muted">${[x.email?mailL(x.email):'',x.phone?telL(x.phone):'',x.mobile?telL(x.mobile):''].filter(Boolean).join(' · ')}</div></div>`).join(''):'<div class="muted">Nessun contatto assegnato.</div>'}
    <div style="margin-top:6px"><button class="btn sm" data-act="siteCt" data-id="${c.id}" data-sid="${s.id}">+ Contatto in questa sede</button></div></article>`}).join('');
  return `<section class="sec"><header><h3>Sedi / Magazzini</h3><button class="btn sm" data-act="siteAdd" data-id="${c.id}">+ Aggiungi sede</button></header>${cards?`<div class="cards">${cards}</div>`:'<p class="muted">Nessuna sede. Se il cliente ha più magazzini o punti vendita (stessi prezzi e condizioni della sede principale), aggiungili qui con indirizzo e contatti; nei preventivi e negli ordini scegli la sede di consegna.</p>'}</section>`;
}
const _clDetSite=clientDetail;
clientDetail=function(c){const h=_clDetSite(c),i=h.indexOf('<section class="sec"><header><h3>Contatti di riferimento');
  return i<0?h+siteSection(c):h.slice(0,i)+siteSection(c)+h.slice(i)};
/* nei contatti: sede di appartenenza */
const _contactsSecSite=contactsSec;
contactsSec=function(col,e){
  const h=_contactsSecSite(col,e);if(col!=='clients'||!(e.sites||[]).length)return h;
  const parts=h.split('<article class="card">');
  return parts.map((p,k)=>{if(k===0)return p;const c=(e.contacts||[])[k-1],s=c&&(e.sites||[]).find(x=>x.id===c.siteId);
    p=p.replace('</div></div><div class="acts">','</div>'+(s?'<div class="muted" style="color:#0b5a55">📍 '+esc(s.name)+'</div>':'')+'</div><div class="acts">');
    return p.replace('<button class="btn sm" data-act="editContact"','<button class="btn sm" data-act="ctSite" data-id="'+e.id+'" data-i="'+(k-1)+'">Sede</button><button class="btn sm" data-act="editContact"')}).join('<article class="card">');
};
Object.assign(ACT,{
  siteAdd:d=>{const c=byId('clients',d.id);openForm('Nuova sede / magazzino',SITE_F,{},o=>save('clients',{...c,sites:[...(c.sites||[]),{id:uid(),...o}]}))},
  siteEdit:d=>{const c=byId('clients',d.id),s=(c.sites||[]).find(x=>x.id===d.sid);if(!s)return;openForm('Modifica sede',SITE_F,s,o=>save('clients',{...c,sites:c.sites.map(x=>x.id===d.sid?{...x,...o}:x)}))},
  siteDel:d=>{const c=byId('clients',d.id),s=(c.sites||[]).find(x=>x.id===d.sid);if(!s)return;
    confirmBox('Eliminare la sede <b>'+esc(s.name)+'</b>? I suoi contatti restano al cliente, senza sede.',async()=>{await save('clients',{...c,sites:c.sites.filter(x=>x.id!==d.sid),contacts:(c.contacts||[]).map(x=>x.siteId===d.sid?{...x,siteId:''}:x)});S.quotes.filter(q=>q.siteId===d.sid).forEach(q=>{q.siteId='';save('quotes',q,true)})})},
  siteCt:d=>{const c=byId('clients',d.id);openForm('Nuovo contatto della sede',CONTACT_F,{},o=>save('clients',{...c,contacts:[...(c.contacts||[]),{...o,siteId:d.sid}]}))},
  ctSite:d=>{const c=byId('clients',d.id),i=+d.i,ct=(c.contacts||[])[i];if(!ct)return;
    openForm('Sede di '+(ct.name||'questo contatto'),[{k:'siteId',label:'Sede / magazzino',type:'select',opts:[['','Nessuna (sede principale)'],...(c.sites||[]).map(s=>[s.id,s.name])]}],{siteId:ct.siteId||''},o=>save('clients',{...c,contacts:c.contacts.map((x,j)=>j===i?{...x,siteId:o.siteId||''}:x)}),(c.sites||[]).length?'':'Prima aggiungi una sede nella sezione «Sedi / Magazzini».')}
});
/* sede di consegna nel preventivo / ordine */
const _quoteEditorSite=quoteEditor;
quoteEditor=function(q){
  let h=_quoteEditorSite(q);const c=byId('clients',clientIdOf(q)),ss=(c&&c.sites)||[];if(!ss.length)return h;
  const opts='<option value="">Sede principale</option>'+ss.map(s=>`<option value="${s.id}" ${q.siteId===s.id?'selected':''}>${esc(s.name)} · ${esc(s.city||'')}</option>`).join('');
  return h.replace(/(<select id="qCompany"[\s\S]*?<\/select><\/label>)/,m=>m+`<label class="fld"><span>Sede di consegna</span><select data-qsite="1">${opts}</select></label>`);
};
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||t.dataset.qsite==null)return;const q=Q();if(!q)return;q.siteId=t.value;save('quotes',q,true);render()});

<script>
/* ---------- Conferme d'ordine: secondo formato (CONFERMA D'ORDINE con SHIP TO / SOLD TO) ---------- */
async function svPageText(page){
  const base=await cpPageText(page);if(base==null)return base;
  const tc=await page.getTextContent(),its=tc.items.filter(i=>String(i.str).trim()!=='').map(i=>({t:i.str.trim(),x:i.transform[4],y:i.transform[5]}));
  const h=its.filter(i=>/^ARTICOLO\b/i.test(i.t)).sort((a,b)=>b.y-a.y)[0];if(!h)return base;
  const sp=its.find(i=>/^SPEDIZIONE/i.test(i.t)),W=(page.view&&page.view[2])||595,xs=sp?sp.x-3:W*.5;
  const lines=arr=>{const L=[];arr.slice().sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{const l=L.find(z=>Math.abs(z.y-i.y)<=2.5);if(l)l.it.push(i);else L.push({y:i.y,it:[i]})});return L.sort((a,b)=>b.y-a.y).map(l=>l.it.sort((a,b)=>a.x-b.x).map(i=>i.t).join(' ')).join('\n')};
  const head=its.filter(i=>i.y>h.y+2);
  return base+'\n@@COLS@@\n'+lines(head.filter(i=>i.x<xs))+'\n@@RIGHT@@\n'+lines(head.filter(i=>i.x>=xs))+'\n@@TABLE@@\n'+lines(its.filter(i=>i.y<=h.y+2));
}
function svBlock(L){
  L=(L||[]).map(x=>x.trim()).filter(Boolean);if(!L.length)return null;
  const k=L.findIndex((x,i)=>i>0&&/^\d{5}\s+\S/.test(x)),m=k>0?L[k].match(/^(\d{5})\s+(.+?)(?:\s+([A-Z]{2}))?$/):null;
  return {name:L[0],address:k>1?L.slice(1,k).join(', '):(k<0?L.slice(1).join(', '):''),zip:m?m[1]:'',city:m?m[2]:'',prov:m&&m[3]?m[3]:''};
}
function svParseB(pages){
  const docs=new Map();
  pages.forEach(raw=>{
    const txt=String(raw||'');if(/CONFERMA\s+(?:DI\s+VENDITA|D['’]ORDINE)\s+N\.?\s*\S+\s+DEL\s+\d/i.test(txt.split('@@COLS@@')[0]))return;
    const ci=txt.indexOf('@@COLS@@'),base=ci<0?txt:txt.slice(0,ci),ri=txt.indexOf('@@RIGHT@@'),ti=txt.indexOf('@@TABLE@@');
    const L=base.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
    let m=null;L.forEach(l=>{if(!m)m=l.match(/CONFERMA(?:\s+D['’]ORDINE)?\s+(\d{5,})\s+(\d\d)\/(\d\d)\/(\d{4})/i)});
    if(!m){const j=L.join(' ').match(/CONFERMA\s+(\d{5,})\s+(\d\d)\/(\d\d)\/(\d{4})/i);m=j}
    if(!m)return;
    const no=m[1];let d=docs.get(no);if(!d){d={no,date:m[4]+'-'+m[3]+'-'+m[2],ref:'',client:'',cod:'',vat:'',rows:[],ship:null,sold:null,shipSite:null};docs.set(no,d)}
    L.forEach(l=>{const c=l.match(/^(\d{3,8})\s+(?:IT\s*)?(\d{11})\b/);if(c&&!d.cod){d.cod=c[1];d.vat=c[2]}});
    if(ci>=0&&ri>ci){
      const right=txt.slice(ri+9,ti>ri?ti:undefined).split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
      const a=right.findIndex(l=>/SPEDIZIONE|SHIP TO/i.test(l)),b=right.findIndex(l=>/INTESTATARIO|SOLD TO/i.test(l));
      if(a>=0&&b>a){if(!d.ship)d.ship=svBlock(right.slice(a+1,b));if(!d.sold)d.sold=svBlock(right.slice(b+1,b+5))}
      else if(b>=0&&!d.sold)d.sold=svBlock(right.slice(b+1,b+5));
    }
    if(d.sold&&!d.client)d.client=d.sold.name;
    const tab=(ti>=0?txt.slice(ti+9):base).split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);let vs='';
    tab.forEach(l=>{
      const po=l.match(/P\.?O\.?\s*No\.?:?\s*(\S+)/i);if(po&&!d.ref)d.ref=po[1];
      const v=l.match(/^VS\.?\s*COD\.?:?\s*(\S+)/i);if(v){vs=v[1];return}
      const x=l.match(/^(\S+)\s+(.+?)\s+([A-Z]{1,3}\.?)\s+(\d[\d.]*(?:,\d+)?)\s+((?:\d[\d.]*,\d+\s+){1,3}\d[\d.]*,\d+)(?:\s+\d\d\/\d\d\/\d{2,4})?$/);
      if(!x||/^(ARTICOLO|ITEM|TOTALE)/i.test(x[1]))return;
      const nums=x[5].trim().split(/\s+/).map(svNum),n=nums.length,total=nums[n-1],net=nums[n-2],qty=svNum(x[4]);
      if(!(qty>0)||!(net>0))return;
      d.rows.push({code:x[1],desc:x[2].trim(),um:x[3].replace(/\.$/,''),qty,price:net,total,list:n>=3?nums[0]:0,vs,ship:d.date});vs='';
    });
  });
  const out=[...docs.values()].filter(d=>d.rows.length);
  out.forEach(d=>{
    if(d.ship&&d.sold){const k=s=>svName((s.address||'')+(s.city||''));if(k(d.ship)&&k(d.ship)!==k(d.sold))d.shipSite={name:d.ship.name&&svName(d.ship.name)!==svName(d.sold.name)?d.ship.name:(d.ship.city||'Sede'),address:d.ship.address,zip:d.ship.zip,city:d.ship.city,prov:d.ship.prov}}
    if(d.sold&&!d.sold.vat)d.sold.vat=d.vat});
  return out;
}
const _svParseA=svParse;
svParse=function(pages){
  const A=_svParseA(pages.map(t=>String(t||'').split('@@COLS@@')[0])),B=svParseB(pages);
  const have=new Set(A.map(d=>d.no));return A.concat(B.filter(d=>!have.has(d.no)));
};

</script>

    while(y0<H-1){let y1=Math.min(H,y0+pageH-2);if(y1<H){const c=cuts.filter(y=>y>y0+pageH*0.55&&y<=y1);if(c.length)y1=Math.min(y1,Math.ceil(c[c.length-1])+1)}sl.push([y0,Math.min(H,y1)]);y0=Math.min(H,y1)}
    const pages=[];
    for(const [a,b] of sl){const c=document.createElement('canvas');c.width=full.width;c.height=Math.max(1,Math.round((b-a)*S));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(full,0,a*S,full.width,c.height,0,0,c.width,c.height);
      const d=c.toDataURL('image/jpeg',0.92).split(',')[1],bin=atob(d),jpg=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)jpg[i]=bin.charCodeAt(i);
      pages.push({jpg,w:c.width,h:c.height,pt:(b-a)*(595.28/794)});c.width=c.height=0}
    full.width=full.height=0;return pdfFromJpegs(pages);
  }finally{host.remove()}
}

async function mkUpload(file){

    else{if(file.size>900*1024){toast('In questa vista i file grandi non si possono salvare: usa un link al cloud o apri la pagina dal suo link');return}
      o={name:file.name,size:file.size,type:file.type,data:await blobToData(file)}}

  catch(e){toast('Caricamento non riuscito: '+file.name)}

function mkAddLinkNow(){

}

Object.assign(ACT,{

<script>
/* =====================================================================
   ARCHIVIO SU ONEDRIVE
   Sostituisce l'archivio di Claude: accesso Microsoft (OAuth PKCE),
   dati in "OneDrive / Portafoglio Agente / dati / <raccolta>.json",
   foto e allegati in ".../foto/<id>", backup in ".../backup/".
   ===================================================================== */
const OD_CFG={
  clientId:'bc89b842-3fef-4db4-b55a-caa6e05fb9b6',            /* Application (client) ID della registrazione Microsoft */
  folder:'Portafoglio Agente',
  scope:'Files.ReadWrite offline_access',
  auth:'https://login.microsoftonline.com/common/oauth2/v2.0/',
  graph:'https://graph.microsoft.com/v1.0'
};
const OD_CLIENT=()=>{const c=OD_CFG.clientId;if(c&&!c.startsWith('__'))return c;try{return localStorage.getItem('pa_client')||''}catch(e){return ''}};
const OD_REDIRECT=()=>location.origin+location.pathname.replace(/index\.html$/,'');
const OD={tok:null,etag:{},busy:false,timer:null,last:null,err:'',user:'',ready:false,online:navigator.onLine};

/* ---------- piccolo archivio locale (IndexedDB) per avvio veloce e uso offline ---------- */
const IDB=(()=>{let p;const db=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('portafoglio_agente',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('blob')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const run=(st,mode,fn)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction(st,mode),s=t.objectStore(st),q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  return {get:(k,st='kv')=>run(st,'readonly',s=>s.get(k)).catch(()=>undefined),set:(k,v,st='kv')=>run(st,'readwrite',s=>s.put(v,k)).catch(()=>{}),del:(k,st='kv')=>run(st,'readwrite',s=>s.delete(k)).catch(()=>{})};
})();

/* ---------- accesso Microsoft (codice + PKCE, senza librerie esterne) ---------- */
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));
function tokLoad(){try{OD.tok=JSON.parse(localStorage.getItem('pa_tok')||'null')}catch(e){OD.tok=null}}
function tokSave(t){OD.tok=t;try{t?localStorage.setItem('pa_tok',JSON.stringify(t)):localStorage.removeItem('pa_tok')}catch(e){}}
async function odLogin(silent){
  const v=rnd(48),st=rnd(16),ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  sessionStorage.setItem('pa_pkce',JSON.stringify({v,st,hash:location.hash}));OD.leaving=true;
  const u=new URL(OD_CFG.auth+'authorize');
  Object.entries({client_id:OD_CLIENT(),response_type:'code',redirect_uri:OD_REDIRECT(),scope:OD_CFG.scope,code_challenge:ch,code_challenge_method:'S256',state:st,response_mode:'query',...(silent?{prompt:'none'}:{prompt:'select_account'})}).forEach(([k,x])=>u.searchParams.set(k,x));
  location.assign(u.toString());
}
async function odTokenReq(body){
  const r=await fetch(OD_CFG.auth+'token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:OD_CLIENT(),scope:OD_CFG.scope,...body})});
  const j=await r.json();if(!r.ok)throw Object.assign(new Error(j.error_description||'token'),{code:j.error});
  tokSave({at:j.access_token,rt:j.refresh_token||(OD.tok&&OD.tok.rt),exp:Date.now()+(j.expires_in-120)*1000});
}
async function odHandleRedirect(){
  const p=new URLSearchParams(location.search);if(!p.has('code')&&!p.has('error'))return 'none';
  let saved={};try{saved=JSON.parse(sessionStorage.getItem('pa_pkce')||'{}')}catch(e){}
  sessionStorage.removeItem('pa_pkce');
  history.replaceState(null,'',OD_REDIRECT()+(saved.hash||''));
  if(p.has('error'))return p.get('error');
  if(p.get('state')!==saved.st)return 'state';
  try{await odTokenReq({grant_type:'authorization_code',code:p.get('code'),redirect_uri:OD_REDIRECT(),code_verifier:saved.v});return 'ok'}catch(e){return e.code||'token'}
}
let refreshing=null;
async function odToken(){
  if(OD.tok&&OD.tok.at&&Date.now()<OD.tok.exp)return OD.tok.at;
  if(!OD.tok||!OD.tok.rt)throw Object.assign(new Error('login'),{code:'login'});
  refreshing=refreshing||odTokenReq({grant_type:'refresh_token',refresh_token:OD.tok.rt}).finally(()=>refreshing=null);
  try{await refreshing}catch(e){if(!navigator.onLine)throw Object.assign(new Error('offline'),{code:'offline'});tokSave(null);odNeedLogin();throw Object.assign(new Error('login'),{code:'login'})}
  return OD.tok.at;
}
function odNeedLogin(){
  /* l'accesso dura circa 24 ore: si rinnova da solo con un passaggio veloce dalla pagina Microsoft */
  if(sessionStorage.getItem('pa_silent')!=='1'){sessionStorage.setItem('pa_silent','1');odLogin(true);return}
  odGate('login');
}

/* ---------- Microsoft Graph ---------- */
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const odPath=rel=>'/me/drive/root:/'+enc(OD_CFG.folder+'/'+rel);
async function gfetch(url,opt={},retry=true){
  const t=await odToken();
  const r=await fetch(url.startsWith('http')?url:OD_CFG.graph+url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});
  if(r.status===401&&retry){OD.tok.exp=0;return gfetch(url,opt,false)}
  if(r.status===429||r.status===503){const w=(+r.headers.get('Retry-After')||3)*1000;await new Promise(z=>setTimeout(z,w));return gfetch(url,opt,retry)}
  return r;
}
async function odMeta(rel){const r=await gfetch(odPath(rel));if(r.status===404)return null;if(!r.ok)throw await odErr('lettura',r);return r.json()}
async function odGet(rel,as){
  const m=await odMeta(rel);if(!m)return null;
  const u=m['@microsoft.graph.downloadUrl']||m['@content.downloadUrl'];let r=null;
  if(u){try{r=await fetch(u)}catch(e){r=null}}
  if(!r||!r.ok)r=await gfetch(odPath(rel)+':/content');
  if(!r.ok)throw await odErr('download',r);
  return {etag:m.cTag||m.eTag,data:as==='blob'?await r.blob():await r.text()};
}
/* scrive un file; con etag si rifiuta (412) se nel frattempo è stato cambiato da un altro dispositivo */
async function odPut(rel,body,type,etag,opt_retry){
  const blob=body instanceof Blob?body:new Blob([body],{type:type||'application/json'});
  const h={};
  if(blob.size<3.5*1048576){
    const r=await gfetch(odPath(rel)+':/content',{method:'PUT',headers:{'Content-Type':blob.type||type||'application/octet-stream',...h},body:blob});
    if(r.status===412)throw Object.assign(new Error('conflict'),{code:412});
    if(r.status===404&&!opt_retry){await odEnsureFolders(true);return odPut(rel,body,type,etag,true)}
    if(!r.ok)throw await odErr('scrittura',r);{const j=await r.json();return j.cTag||j.eTag}
  }
  const s=await gfetch(odPath(rel)+':/createUploadSession',{method:'POST',headers:{'Content-Type':'application/json',...h},body:JSON.stringify({item:{'@microsoft.graph.conflictBehavior':'replace'}})});
  if(s.status===412)throw Object.assign(new Error('conflict'),{code:412});
  if(!s.ok)throw await odErr('caricamento',s);
  const {uploadUrl}=await s.json(),CH=320*1024*20;let pos=0,last;
  while(pos<blob.size){const end=Math.min(pos+CH,blob.size);last=await fetch(uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${pos}-${end-1}/${blob.size}`},body:blob.slice(pos,end)});if(!last.ok&&last.status!==202)throw new Error('chunk '+last.status);pos=end}
  {const j=await last.json();return j.cTag||j.eTag}
}

/* messaggio di errore leggibile, con il codice restituito da Microsoft */
async function odErr(what,r){let c='',m='';try{const j=await r.json();c=(j.error&&j.error.code)||'';m=(j.error&&j.error.message)||''}catch(e){}
  const e=new Error(what+': HTTP '+r.status+(c?' '+c:'')+(m?' – '+m:''));e.status=r.status;OD.detail=e.message;console.error('[OneDrive]',e.message);return e}
/* crea le cartelle dell'app se non ci sono */
async function odEnsureFolders(force){
  if(OD.folders&&!force)return;
  const mk=async(parent,name)=>{const r=await gfetch(parent+'/children',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,folder:{},'@microsoft.graph.conflictBehavior':'fail'})});if(!r.ok&&r.status!==409)throw await odErr('cartella '+name,r)};
  await mk('/me/drive/root',OD_CFG.folder);
  for(const f of ['dati','foto','backup'])await mk('/me/drive/root:/'+enc(OD_CFG.folder)+':',f);
  OD.folders=true;
}
async function odDelete(rel){const r=await gfetch(odPath(rel),{method:'DELETE'});return r.ok||r.status===404}
async function odList(rel){const r=await gfetch(odPath(rel)+':/children?$select=name,cTag,eTag,size,lastModifiedDateTime&$top=999');if(r.status===404)return [];if(!r.ok)throw await odErr('elenco',r);return (await r.json()).value}

/* ---------- raccolte: lettura, unione e scrittura ---------- */
const colFile=c=>'dati/'+c+'.json';
/* Ogni scheda ha "_t" (ora dell'ultima modifica); le cancellazioni lasciano una traccia in "deleted".
   Unendo due versioni vince, scheda per scheda, la modifica più recente: nessun dispositivo sovrascrive il lavoro dell'altro. */
const parseFile=t=>{try{const j=JSON.parse(t);return Array.isArray(j)?{docs:j,deleted:{}}:{docs:j.docs||[],deleted:j.deleted||{}}}catch(e){return {docs:[],deleted:{}}}};
const pending=()=>COLS.some(c=>OD.need[c]);
OD.need={};OD.tomb={};
async function cacheSave(){
  await IDB.set('data',{S:Object.fromEntries(COLS.map(c=>[c,S[c]||[]])),etag:OD.etag,tomb:OD.tomb});
  await IDB.set('need',OD.need);
}
function mergeCol(c,R){
  const tomb={...(R.deleted||{})},lt=OD.tomb[c]||{},old=Date.now()-90*864e5;let need=false;
  for(const [id,t] of Object.entries(lt)){if(!(tomb[id]>=t)){tomb[id]=t;need=true}}
  const map=new Map(),rem=new Map(R.docs.map(o=>[o.id,o]));
  R.docs.forEach(o=>map.set(o.id,o));
  for(const o of S[c]||[]){const r=rem.get(o.id);if(!r||(o._t||0)>(r._t||0)){map.set(o.id,o);if(!(tomb[o.id]>=(o._t||0)))need=true}}
  for(const [id,t] of Object.entries(tomb)){const o=map.get(id);if(o&&t>=(o._t||0))map.delete(id);if(t<old)delete tomb[id]}
  S[c]=[...map.values()];OD.tomb[c]=tomb;
  return need;
}
async function pullCol(c){
  const f=await odGet(colFile(c));
  const need=mergeCol(c,f?parseFile(f.data):{docs:[],deleted:{}});
  OD.etag[c]=f?f.etag:null;if(need)OD.need[c]=true;
}
async function pushCol(c){
  const m=await odMeta(colFile(c)),cur=m?(m.cTag||m.eTag):null;
  if(cur!==(OD.etag[c]||null))await pullCol(c);      /* cambiato da un altro dispositivo: prima unisco */
  OD.need[c]=false;
  try{OD.etag[c]=await odPut(colFile(c),JSON.stringify({app:'portafoglio-agente',col:c,saved:new Date().toISOString(),docs:S[c],deleted:OD.tomb[c]||{}}),'application/json')}
  catch(e){OD.need[c]=true;throw e}
}
async function odFlush(){
  if(OD.busy){OD.again=true;return}
  if(!OD.ready||!pending())return;
  OD.busy=true;OD.err='';odStatus();
  try{for(const c of COLS)if(OD.need[c])await pushCol(c);OD.last=new Date();OD.detail=''}
  catch(e){console.error('[OneDrive] salvataggio',e);OD.detail=OD.detail||String(e&&e.message||e);OD.err=navigator.onLine?'Salvataggio su OneDrive non riuscito ('+OD.detail+'): riprovo tra poco':'Sei offline: le modifiche restano qui e si salvano appena torni online';clearTimeout(OD.timer);OD.timer=setTimeout(odFlush,20000)}
  finally{OD.busy=false;await cacheSave();odStatus();if(OD.again){OD.again=false;odFlush()}}
}
const odSchedule=()=>{clearTimeout(OD.timer);OD.timer=setTimeout(odFlush,1200);odStatus()};
/* controlla se un altro dispositivo ha cambiato qualcosa */
async function odPoll(){
  if(!OD.ready||OD.busy||document.hidden||!navigator.onLine)return;
  try{
    const L=await odList('dati'),m=new Map(L.map(f=>[f.name,f.cTag||f.eTag]));let ch=false;
    for(const c of COLS){const e=m.get(c+'.json')||null;if(e!==(OD.etag[c]||null)){await pullCol(c);ch=true}}
    if(ch){await cacheSave();softRender()}
    if(pending())odFlush();
  }catch(e){}
}

/* ---------- sostituti delle funzioni dell'archivio di Claude ---------- */
save=async function(col,doc,quiet){
  doc._t=Date.now();
  ['logo','photo'].forEach(k=>{if(typeof Blob!=='undefined'&&doc[k] instanceof Blob)delete doc[k]});
  if(col==='clients'&&ui.comp&&ui.view==='clienti'&&!byId('clients',doc.id))doc.competitor=true;
  if(col==='clients'&&!ui.comp&&ui.view==='clienti'&&ui.ctab==='util'&&!byId('clients',doc.id))doc.kind='utilizzatore';
  if(col==='clients'&&!ui.comp&&ui.view==='clienti'&&ui.ctab==='hotel'&&!byId('clients',doc.id)){doc.kind='hotel';doc.hotelType=doc.hotelType||'Hotel'}
  const i=S[col].findIndex(d=>d.id===doc.id);if(i>=0)S[col][i]=doc;else S[col].push(doc);
  OD.need[col]=true;cacheSave();odSchedule();if(!quiet)render();

async function blobLoad(id){
  if(BLOBS[id])return BLOBS[id];
  return BLOAD[id]||(BLOAD[id]=(async()=>{
    let b=await IDB.get(id,'blob');
    if(!b){const f=await odGet('foto/'+id,'blob');if(!f)return '';b=f.data;IDB.set(id,b,'blob')}

};

function fillEntity(e,o){
  ['address','zip','city','prov','vat','phone','fax','email','web','pec'].forEach(k=>{if(o[k]&&!e[k])e[k]=o[k]});

  const draw=()=>{const q=mzN($('#sdQ').value),L=S.clients.filter(c=>c.id!==b.id&&!isComp(c)&&(!q||mzN([c.name,c.city,c.vat].join(' ')).includes(q))).sort((x,y)=>x.name.localeCompare(y.name,'it')).slice(0,60);
    $('#sdL').innerHTML=L.map(c=>`<button type="button" class="row" data-act="sedeGo" data-id="${c.id}" data-bid="${b.id}" style="width:100%;margin-bottom:4px"><b>${esc(c.name)}</b><span>${esc([c.address,c.city,c.prov].filter(Boolean).join(', '))}${(c.sites||[]).length?' · '+c.sites.length+' sedi':''}</span></button>`).join('')||'<p class="muted">Nessun cliente trovato.</p>'};
  const first=String(b.name).split(/\s+/).filter(w=>w.length>1)[0]||'';
  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet"><header><h3>Assegna come sede distaccata</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>
  <p><b>${esc(b.name)}</b><br><span class="muted">${esc([b.address,b.zip,b.city,b.prov].filter(Boolean).join(' '))}</span></p>
  <p class="muted">Cerca e scegli la <b>sede principale</b>: indirizzo, telefoni e contatti di questa scheda diventano una sua sede, con i contatti collegati.</p>
  <input id="sdQ" type="search" placeholder="Cerca la sede principale…" value="${esc(first)}" style="width:100%"><div id="sdL" style="max-height:50vh;overflow:auto;margin-top:8px"></div>
  <footer><button class="btn ghost" data-act="closeModal">Annulla</button></footer></div>`;
  $('#sdQ').oninput=draw;draw();$('#sdQ').focus();
}
async function sedeAssign(mainId,branchId){
  const m0=byId('clients',mainId),b=byId('clients',branchId);if(!m0||!b)return;
  const m={...m0,sites:(m0.sites||[]).map(x=>({...x})),contacts:(m0.contacts||[]).map(x=>({...x})),sectorIds:[...(m0.sectorIds||[])]};
  const codes=(b.links||[]).filter(l=>l.code).map(l=>{const co=byId('companies',l.companyId);return 'Cod. cliente '+(co?co.name:'')+': '+l.code});
  const site={id:uid(),name:b.city?(b.city+(b.address?' – '+b.address:'')):b.name,address:b.address||'',zip:b.zip||'',city:b.city||'',prov:b.prov||'',phone:b.phone||'',email:b.email||'',
    notes:[b.name!==m.name?'Ex scheda: '+b.name:'',b.phones?'Altri tel.: '+String(b.phones).split(/\n/).join(', '):'',b.fax?'Fax: '+b.fax:'',...codes,b.notes||''].filter(Boolean).join('\n')};
  m.sites.push(site);
  (b.contacts||[]).forEach(k=>{if(!m.contacts.some(x=>(k.email&&x.email&&x.email.toLowerCase()===k.email.toLowerCase())||(k.name&&x.name&&mzN(k.name)===mzN(x.name)&&k.phone===x.phone)))m.contacts.push({...k,siteId:site.id})});
  (b.sectorIds||[]).forEach(id=>{if(!m.sectorIds.includes(id))m.sectorIds.push(id)});
  /* condizioni della sede che la principale non ha: si portano dietro */
  const links=(m0.links||[]).map(l=>({...l}));
  (b.links||[]).forEach(l=>{if(!links.some(x=>x.companyId===l.companyId))links.push({...l})});m.links=links;
  for(const P of S.plists.filter(P=>P.clientId===b.id)){if(!getPl(m.id,P.companyId))await save('plists',{...P,id:plId(m.id,P.companyId),clientId:m.id},true);await remove('plists',P.id,true)}
  for(const q of S.quotes.filter(q=>q.clientId===b.id))await save('quotes',{...q,clientId:m.id,clientName:m.name,siteId:site.id},true);
  await save('clients',m,true);await remove('clients',b.id,true);
  ui.sel=m.id;render();toast(b.name+' ora è una sede di '+m.name);
}

/* ---------- immagini nei moduli: foto dalla fotocamera e copia-incolla ---------- */
function imgSet(inp,file){
  if(!file)return;
  const f=file instanceof File?file:new File([file],'immagine.'+((file.type||'image/png').split('/')[1]||'png'),{type:file.type||'image/png'});
  try{const dt=new DataTransfer();dt.items.add(f);inp.files=dt.files}catch(e){inp._file=f}
  inp._file=f;
  const wrap=inp.closest('.fld');let pv=wrap.querySelector('img.thumb-prev');
  if(!pv){pv=document.createElement('img');pv.className='thumb-prev';pv.alt='';wrap.appendChild(pv)}
  pv.src=URL.createObjectURL(f);
  const msg=wrap.querySelector('.imgmsg');if(msg)msg.textContent='Immagine pronta: premi Salva';
}
const _openFormImg=openForm;
openForm=function(title,fields,vals,onSave,note){
  /* i file presi da incolla/fotocamera arrivano al salvataggio anche dove DataTransfer non c'è */
  const save2=async o=>{for(const f of fields){if(f.type==='image'&&!o[f.k]){const el=$('#f_'+f.k);if(el&&el._file)o[f.k]=el._file}}return onSave(o)};
  _openFormImg(title,fields,vals,save2,note);
  const form=$('#theForm');if(!form)return;
  form.querySelectorAll('input[type="file"][accept="image/*"]').forEach(inp=>{
    const id=inp.id;
    inp.insertAdjacentHTML('afterend',`<div class="acts" style="margin-top:4px"><label class="btn sm" style="cursor:pointer">📷 Scatta foto<input type="file" accept="image/*" capture="environment" data-camfor="${id}" style="display:none"></label><button type="button" class="btn sm" data-pastefor="${id}">📋 Incolla immagine</button></div><span class="muted imgmsg" style="font-size:12px">Puoi anche copiare un logo (da un sito, da una mail o con uno screenshot) e premere Ctrl+V qui.</span>`);
    inp.addEventListener('change',()=>{if(inp.files[0])imgSet(inp,inp.files[0])});
  });
  form.querySelectorAll('[data-camfor]').forEach(c=>c.addEventListener('change',()=>{if(c.files[0])imgSet($('#'+c.dataset.camfor),c.files[0])}));
  form.querySelectorAll('[data-pastefor]').forEach(b=>b.addEventListener('click',async()=>{
    const inp=$('#'+b.dataset.pastefor);
    try{const items=await navigator.clipboard.read();for(const it of items){const t=it.types.find(x=>x.startsWith('image/'));if(t){imgSet(inp,await it.getType(t));return}}toast('Negli appunti non c\'è un\'immagine: copia prima il logo')}
    catch(e){toast('Premi Ctrl+V (su telefono: tieni premuto e scegli Incolla) per incollare l\'immagine')}
  }));
  form.addEventListener('paste',e=>{
    const items=[...((e.clipboardData||{}).items||[])],it=items.find(x=>x.type&&x.type.startsWith('image/'));if(!it)return;
    const inp=(document.activeElement&&document.activeElement.type==='file'&&document.activeElement)||form.querySelector('input[type="file"][accept="image/*"]');if(!inp)return;
    e.preventDefault();imgSet(inp,it.getAsFile());
  });
};

/* ---------- più numeri di telefono per clienti e aziende ---------- */
const PHONES_F={k:'phones',label:'Altri numeri di telefono (uno per riga, es. Magazzino: 0721 123456)',type:'textarea',rows:3,full:true};
[CLIENT_F,COMPANY_F].forEach(F=>{if(F.some(f=>f.k==='phones'))return;const i=F.findIndex(f=>f.k==='phone');F.splice(i<0?F.length:i+1,0,PHONES_F)});
function phonesHtml(t){
  return String(t||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const m=x.match(/^(.*?)[:\-–]\s*([+\d][\d\s\/.\-]{4,})$/),num=m?m[2]:x,lab=m?m[1].trim():'';
    return '<div>'+(lab?'<span class="muted">'+esc(lab)+':</span> ':'')+(/\d{5,}/.test(num.replace(/\D/g,''))?telL(num):esc(num))+'</div>'}).join('');
}
function withPhones(h,o){
  if(!o||!String(o.phones||'').trim())return h;
  const add=kv('Altri telefoni',phonesHtml(o.phones)),main=kv('Telefono',telL(o.phone));
  if(main&&h.includes(main))return h.replace(main,main+add);
  return h.replace('<dl class="kv">','<dl class="kv">'+add);
}
const _cdPh=clientDetail;clientDetail=function(c){return withPhones(_cdPh(c),c)};
const _coPh=companyDetail;companyDetail=function(c){return withPhones(_coPh(c),c)};

      }
      if(!confirm('Sostituire tutti i dati attuali con quelli del backup "'+f.name+'"?')){e.target.value='';return}
      try{m.textContent='Backup di sicurezza…';await odBackup(true);m.textContent='Importo…';const r=await importBackup(new File([JSON.stringify(j)],f.name));closeModal();toast('Importati '+r.docs+' elementi e '+r.photos+' foto')}catch(err){m.textContent=err.message||'Importazione non riuscita'}};
  },
  odBackupNow:async()=>{try{toast('Backup in corso…');const n=await odBackup(true);toast('Backup salvato in OneDrive: '+n)}catch(e){toast('Backup non riuscito: controlla la connessione')}},
  odBackupDl:async()=>{toast('Preparo il backup…');const blobs={};for(const id of blobIds()){const u=await blobLoad(id);if(u){const b=await (await fetch(u)).blob();blobs[id]={type:b.type,data:await blobToData(b)}}}await DL.save({filename:'portafoglio-backup-'+today()+'.json',data:backupJson(blobs)})},
  odSyncNow:async()=>{closeModal();await odPoll();toast('Dati aggiornati')},
  odLogout:()=>{if(pending()&&!confirm('Ci sono modifiche non ancora salvate su OneDrive. Uscire lo stesso?'))return;tokSave(null);IDB.del('data');IDB.del('need');sessionStorage.setItem('pa_silent','1');location.reload()},
  /* idee e migliorie: elenco da passare a Claude per i prossimi aggiornamenti */
  odIdeas:()=>{
    const L=(S.ideas||[]).slice().sort((a,b)=>(a.done-b.done)||String(b.date).localeCompare(String(a.date)));
    $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet"><header><h3>💡 Idee e migliorie</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>
    <p class="muted">Annota qui cosa vorresti cambiare o aggiungere. Quando vuoi aggiornare l'app premi <b>Copia per Claude</b> e incolla il testo in una chat con Claude.</p>
    <textarea id="ideaTxt" rows="3" placeholder="es. Nella scheda cliente vorrei il campo Codice SDI…"></textarea><div class="acts"><button class="btn pri" data-act="ideaAdd">Aggiungi</button></div>
    <ul class="customs">${L.map(x=>`<li><input type="checkbox" data-act="ideaDone" data-id="${x.id}" ${x.done?'checked':''} aria-label="Fatta"><span style="${x.done?'text-decoration:line-through;opacity:.6':''}">${esc(x.text)}<br><small class="muted">${fdate(x.date)}</small></span><button class="x" data-act="ideaDel" data-id="${x.id}" aria-label="Elimina">×</button></li>`).join('')||'<li class="muted">Nessuna idea annotata.</li>'}</ul>
    <footer><button class="btn" data-act="ideaCopy">Copia per Claude</button><button class="btn ghost" data-act="closeModal">Chiudi</button></footer></div>`;
    $('#ideaTxt').focus();
  },
  ideaAdd:async()=>{const t=$('#ideaTxt').value.trim();if(!t)return;await save('ideas',{id:uid(),text:t,date:today(),done:false},true);ACT.odIdeas();render()},
  ideaDone:async d=>{const x=byId('ideas',d.id);if(x){await save('ideas',{...x,done:!x.done},true);ACT.odIdeas();render()}},
  ideaDel:async d=>{await remove('ideas',d.id,true);ACT.odIdeas();render()},
  ideaCopy:async()=>{const L=(S.ideas||[]).filter(x=>!x.done);if(!L.length){toast('Nessuna idea da copiare');return}
    const t='Ciao Claude, vorrei aggiornare la mia app "Portafoglio Agente" (versione OneDrive su GitHub). Ecco le migliorie che ho annotato:\n\n'+L.map((x,i)=>(i+1)+'. '+x.text).join('\n');
    try{await navigator.clipboard.writeText(t);toast('Copiato: incollalo in una chat con Claude')}catch(e){toast('Copia non riuscita')}}
});
COLS.push('ideas');S.ideas=[];

/* ---------- avvio ---------- */
init=async function(){
  const v=location.hash.slice(1);if(TITLES[v])ui.view=v;
  DB={onedrive:true};mode='cloud';capDone=true;
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  render();
  if(!OD_CLIENT()){odGate('setup');return}
  const red=await odHandleRedirect();tokLoad();
  if(red==='login_required'||red==='interaction_required'||red==='consent_required'){odGate('login');return}
  if(red!=='none'&&red!=='ok'){odGate('login','Accesso non riuscito ('+red+'). Riprova.');return}
  if(red==='ok')sessionStorage.removeItem('pa_silent');
  if(!OD.tok){odGate('login');return}
  /* 1. dati in memoria locale: l'app si apre subito, anche offline */
  const cache=await IDB.get('data'),need=await IDB.get('need');
  if(cache){COLS.forEach(c=>S[c]=(cache.S&&cache.S[c])||[]);OD.etag=cache.etag||{};OD.tomb=cache.tomb||{}}
  if(need)OD.need=need;
  render();
  /* 2. dati aggiornati da OneDrive */
  try{
    const r=await gfetch('/me/drive?$select=owner');if(r.ok){const j=await r.json();OD.user=((j.owner||{}).user||{}).displayName||''}
    await odEnsureFolders();
    await Promise.all(COLS.map(pullCol));OD.ready=true;hotelMigrate();await cacheSave();render();
    if(pending())odFlush();
    odDailyBackup();
  }catch(e){
    console.error('[OneDrive] avvio',e);OD.ready=true;OD.err=e.code==='login'?'':'OneDrive non raggiungibile ('+(e.message||e)+'): lavori sui dati di questo dispositivo';render();
  }
  setInterval(odPoll,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)odPoll();else odFlush()});
  window.addEventListener('online',()=>{OD.err='';odFlush();odPoll()});
  window.addEventListener('beforeunload',e=>{if(pending()&&!OD.leaving){odFlush();e.preventDefault();e.returnValue=''}});
};

</script>
<script>init();</script>

</body></html>
