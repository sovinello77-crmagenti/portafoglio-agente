<script>
/* ---------- righe preventivo: codice -> condizioni automatiche, SC 1 / SC 2 / Omaggio, totale reale ---------- */
const dparts=s=>String(s||'').split(/[+\/]/).map(num).filter(x=>x>0);
function splitDisc(s){const p=dparts(s);return {sc1:p[0]||'',sc2:p.length>1?r5((1-p.slice(1).reduce((f,d)=>f*(1-d/100),1))*100):''}}
/* netto unitario senza arrotondamenti: Prezzo × (1−SC1) × (1−SC2) × 100/(100+Omaggio) */
const lNet=l=>num(l.list)*(1-num(l.sc1)/100)*(1-num(l.sc2)/100)*(100/(100+num(l.om)));
function omText(l){const n=Math.round(num(l.qty)*num(l.om)/(100+num(l.om)));return num(l.om)>0&&n>0?'≈ '+fmtQty(n)+' pz omaggio':''}
/* scaglioni del listino personalizzato per un codice (tolleranza su zeri, trattini e codici simili) */
function plFind(cid,co,code){
  const P=cid&&co&&getPl(cid,co),k=nrm(code);if(!P||!k)return null;
  const ok=r=>r.price!==''&&r.price!=null;
  let t=P.rows.filter(r=>nrm(r.code)===k&&ok(r)),approx=false;
  if(!t.length&&k.length>=6){
    const cs=[...new Set(P.rows.filter(ok).map(r=>nrm(r.code)).filter(c=>c.length>=6&&c!==k&&(c.startsWith(k)||k.startsWith(c))))];
    if(cs.length===1){t=P.rows.filter(r=>nrm(r.code)===cs[0]&&ok(r));approx=true}
  }
  return t.length?{rows:t.slice().sort((a,b)=>num(a.qty)-num(b.qty)),approx}:null;
}
/* vale lo scaglione piu alto la cui quantita minima e raggiunta; sotto il minimo non si applica nulla */
function plRow(cid,co,code,qty){
  const f=plFind(cid,co,code);if(!f)return null;
  let best=null;for(const r of f.rows){if(num(r.qty)<=qty)best=r}
  return best?(f.approx?{...best,_approx:true}:best):null;
}
const clientIdOf=q=>{if(q.clientId)return q.clientId;const n=String(q.clientName||'').trim().toLowerCase();if(!n)return '';
  let c=S.clients.find(c=>c.name.trim().toLowerCase()===n);if(c)return c.id;
  const k=s=>String(s||'').toLowerCase().replace(/\b(s\.?r\.?l\.?|s\.?p\.?a\.?|s\.?n\.?c\.?|s\.?a\.?s\.?)\b/g,'').replace(/[^a-z0-9]/g,''),nk=k(n);
  if(!nk)return '';c=S.clients.find(c=>k(c.name)===nk);return c?c.id:''};
function qCode(q){const c=byId('clients',clientIdOf(q));const L=c&&(c.links||[]).find(l=>l.companyId===q.companyId);return (L&&L.code)||''}
function ensureCompany(q){
  const cid=clientIdOf(q);if(q.companyId||!cid)return;
  const ps=S.plists.filter(p=>p.clientId===cid&&p.rows.length),c=byId('clients',cid),ls=c?(c.links||[]).filter(l=>byId('companies',l.companyId)):[];
  if(ps.length===1)q.companyId=ps[0].companyId;else if(!ps.length&&ls.length===1)q.companyId=ls[0].companyId;
}
function lineCond(q,code,qty){
  const k=nrm(code);if(!k)return null;
  const cid=clientIdOf(q),P=cid&&q.companyId?getPl(cid,q.companyId):null,qq=qty>0?qty:1;
  const it=S.items.find(i=>i.companyId===q.companyId&&nrm(i.code)===k)||null,r=plRow(cid,q.companyId,code,qq);
  if(r)return {itemId:it?it.id:'',pl:!it,code:it?it.code:r.code,name:it?it.name:r.desc,list:num(r.price),sc1:r.sc1,sc2:r.sc2,om:r.gift,warn:false,note:'Listino personalizzato · scaglione da '+fmtQty(num(r.qty||1))+' pz'+(r._approx?' · codice simile: '+r.code:'')};
  const f=plFind(cid,q.companyId,code),min=f?num(f.rows[0].qty):0;
  if(f&&!it)return {itemId:'',pl:true,code:f.rows[0].code,name:f.rows[0].desc,list:num(f.rows[0].price),sc1:'',sc2:'',om:'',warn:true,note:'Quantità sotto il minimo del listino personalizzato (da '+mifmtQty(n)+' pz): nessuno sconto applicato'};
  if(it){
    const cl=byId('clients',cid),L=cl&&(cl.links||[]).find(l=>l.companyId===q.companyId),c=L&&(L.customs||[]).find(x=>x.itemId===it.id);
    if(c&&c.type==='netto')return {itemId:it.id,pl:false,code:it.code,name:it.name,list:num(c.value),sc1:'',sc2:'',om:'',warn:false,note:'Netto personalizzato'};
    const d=splitDisc(c?c.value:q.discount);
    if(f)return {itemId:it.id,pl:false,code:it.code,name:it.name,list:it.price||0,sc1:d.sc1,sc2:d.sc2,om:'',warn:true,note:'Quantità sotto il minimo del listino personalizzato (da '+mifmtQty(n)+' pz): applicato '+(c?'lo sconto personalizzato':q.discount?'lo sconto base':'il listino generale')};
    const diag=P&&P.rows.length?' · codice assente nel listino personalizzato':(cid&&q.companyId?' · nessun listino personalizzato per questo cliente':(!cid?' · cliente non in anagrafica: nessun listino personalizzato':''));
    return {itemId:it.id,pl:false,code:it.code,name:it.name,list:it.price||0,sc1:d.sc1,sc2:d.sc2,om:'',warn:false,note:(c?'Sconto personalizzato':(q.discount?'Sconto base':'Listino generale'))+diag};
  }
  return null;
}
function applyCond(l,c){Object.assign(l,c);l.net=lNet(l)}
function migrateLine(l,q){
  if(l.sc1!==undefined)return;
  l.sc1='';l.sc2='';l.om='';
  if(q&&(l.itemId||l.pl)&&!l.manual){const c=lineCond(q,l.code,num(l.qty)||1);if(c)applyCond(l,c)}
  if(l.disc&&!(l.itemId||l.pl)){const d=splitDisc(l.disc);l.sc1=d.sc1;l.sc2=d.sc2;l.edited=true}
  delete l.disc;
}
function recalc(q){(q.lines||[]).forEach(l=>{migrateLine(l,q);if(l.manual||l.edited||!(l.itemId||l.pl))return;const c=lineCond(q,l.code,num(l.qty)||1);if(c)applyCond(l,c)})}
function qPrice(q,it,qty){const c=lineCond(q,it.code,qty||1);return c?lNet(c):(it.price||0)}

function lineRow(q,l,i){
  migrateLine(l,q);
  const it=l.itemId&&byId('items',l.itemId),free=!(l.itemId||l.pl);
  const inp=(f,v,cls)=>`<input class="${cls}" id="${f}_${i}" type="number" step="any" data-in="line" data-i="${i}" data-f="${f}" value="${esc(v==null?'':v)}" aria-label="${f}">`;
  return `<tr><td style="width:56px">${it?thumb(it):''}</td>
  <td><input class="mono c" id="lc_${i}" data-ch="lineCode" data-i="${i}" value="${esc(l.code||'')}" placeholder="codice" aria-label="Codice articolo"></td>
  <td>${free?`<input data-in="line" data-i="${i}" data-f="name" value="${esc(l.name||'')}" placeholder="Descrizione riga libera" style="min-width:200px">`:`<b>${esc(l.name)}</b>`}${l.note?`<div ${l.warn?'style="color:var(--warn);font-weight:500"':'class="muted"'}>${esc(l.note)}</div>`:''}${(()=>{const t=(l.itemId||l.pl)?plTiers(clientIdOf(q),q.companyId,l.code):'';return t?`<div class="muted">Scaglioni: ${esc(t)}</div>`:''})()}${l.gift?`<div class="muted">Omaggio riservato: ${esc(l.gift)}</div>`:''}</td>
  <td class="num">${inp('qty',l.qty,'q')}</td><td class="num">${inp('list',l.list||0,'p')}</td><td class="num">${inp('sc1',l.sc1,'s')}</td><td class="num">${inp('sc2',l.sc2,'s')}</td>
  <td class="num">${inp('om',l.om,'s')}<div class="muted" id="og_${i}">${omText(l)}</div></td>
  <td class="num"><input class="p" id="net_${i}" type="number" step="any" data-in="line" data-i="${i}" data-f="net" value="${fix5(l.net)}" aria-label="Prezzo netto"></td>
  <td class="num" id="lt_${i}"><b>${eur(num(l.qty)*num(l.net))}</b></td><td><button class="x" data-act="delLine" data-i="${i}" aria-label="Rimuovi riga">×</button></td></tr>`;
}
function patchQuote(q){
  q.lines.forEach((l,i)=>{
    [['list',l.list],['sc1',l.sc1],['sc2',l.sc2],['om',l.om]].forEach(([f,v])=>{const e=$('#'+f+'_'+i);if(e&&document.activeElement!==e)e.value=v==null?'':v});
    const n=$('#net_'+i);if(n&&document.activeElement!==n)n.value=fix5(l.net);
    const t=$('#lt_'+i);if(t)t.innerHTML='<b>'+eur(num(l.qty)*num(l.net))+'</b>';
    const o=$('#og_'+i);if(o)o.textContent=omText(l);
  });
  const T=qTotals(q);[['#tSub',T.sub],['#tVat',T.vat],['#tTot',T.tot],['#tCom',T.com]].forEach(([s,v])=>{const e=$(s);if(e)e.textContent=eur(v)});
}
function lineInput(q,t,i){
  const l=q.lines[i],f=t.dataset.f;if(!l)return;
  if(f==='name'){l.name=t.value;saveQ();return}
  if(f==='qty'){l.qty=qtyNum(t.value);recalc(q);if(!(l.manual||l.edited||!(l.itemId||l.pl)))applyCond(l,lineCond(q,l.code,num(l.qty)||1)||l);else if(!l.manual)l.net=lNet(l)}
  else if(f==='net'){l.net=num(t.value);l.manual=true}
  else{l[f]=t.value===''?'':num(t.value);l.edited=true;l.manual=false;l.net=lNet(l)}
  patchQuote(q);saveQ();
}
function addByCode(q,code){
  ensureCompany(q);
  const f0=plFind(clientIdOf(q),q.companyId,code),q0=f0?Math.max(1,num(f0.rows[0].qty)):1;
  const c=lineCond(q,code,q0);if(!c){toast('Codice non trovato nei listini');return false}
  const l={id:uid(),qty:q0};applyCond(l,c);q.lines.push(l);save('quotes',q,true);render();
  const e=$('#qItemQ');if(e){e.value='';e.focus()}return true;
}
Object.assign(ACT,{
  pickClient:d=>{const q=Q();q.clientId=d.id;q.clientName='';q.companyId=q.companyId||'';ensureCompany(q);applyConditions(q);save('quotes',q,true);render()},
  useClientName:()=>{const name=(($('#qClientQ')||{}).value||'').trim();if(!name)return;const q=Q(),hit=S.clients.find(c=>c.name.trim().toLowerCase()===name.toLowerCase());
    if(hit){ACT.pickClient({id:hit.id});return}q.clientId='';q.clientName=name;recalc(q);save('quotes',q,true);render()},
  addLine:d=>{const q=Q(),it=byId('items',d.id);if(it)addByCode(q,it.code)},
  addPl:d=>addByCode(Q(),d.code),
  addFree:()=>{const q=Q();q.lines.push({id:uid(),itemId:'',code:'',name:'',qty:1,list:0,sc1:'',sc2:'',om:'',net:0,edited:true});save('quotes',q,true);render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.in==='line'&&ui.qid){lineInput(Q(),t,+t.dataset.i);return}
  if(t.id==='qItemQ'&&ui.qid){
    const q=Q(),v=nrm(t.value);if(v.length<3)return;
    const codes=new Set(S.items.filter(i=>i.companyId===q.companyId).map(i=>nrm(i.code)));const P=getPl(q.clientId,q.companyId);if(P)P.rows.forEach(r=>codes.add(nrm(r.code)));
    if(codes.has(v)&&![...codes].some(c=>c!==v&&c.startsWith(v)))addByCode(q,t.value.trim());
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.id!=='qItemQ'||!ui.qid)return;e.preventDefault();
  const q=Q(),v=e.target.value.trim();if(!v)return;
  if(!addByCode(q,v)){const b=document.querySelectorAll('#qItemDrop [data-act]');if(b.length===1)b[0].click()}
});
document.addEventListener('change',e=>{
  const t=e.target;if(!(t.dataset&&t.dataset.ch==='lineCode')||!ui.qid)return;
  const q=Q(),l=q.lines[+t.dataset.i];if(!l)return;const code=t.value.trim();l.code=code;
  const c=lineCond(q,code,num(l.qty)||1);
  if(c){applyCond(l,c);l.manual=false;l.edited=false}else if(code){l.itemId='';l.pl=false;l.note='';toast('Codice non trovato nei listini: resta come riga libera')}
  save('quotes',q,true);render();
});

const sc=v=>v===''||v==null?'':String(v).replace('.',',');
function quoteText(q){
  const co=byId('companies',q.companyId)||{},T=qTotals(q);
  return [`${qWord(q)} ${q.number} del ${fdate(q.date)}`,`Azienda: ${co.name||''}`,`Cliente: ${qCode(q)?'Cod. '+qCode(q)+' - ':''}${qCN(q)}`,'',
   ...q.lines.map(l=>`- ${l.code?l.code+' ':''}${l.name} | ${l.qty} x ${eurp(l.net)}${num(l.sc1)||num(l.sc2)?' (sconti '+[sc(l.sc1),sc(l.sc2)].filter(Boolean).join('+')+'%)':''}${num(l.om)?' omaggio '+sc(l.om)+'%':''} = ${eur(num(l.qty)*num(l.net))}`),'',
   `Imponibile: ${eur(T.sub)}`,`IVA ${q.vat}%: ${eur(T.vat)}`,`Totale: ${eur(T.tot)}`,'',q.delivery?`Resa: ${q.delivery}`:'',q.transport?`Trasporto: ${q.transport}`:'',q.validity?`Validità preventivo: ${q.validity}`:'',q.notes||''].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n');
}
function quoteCsv(q){
  const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';
  return 'Articolo;Descrizione;Quantita;Prezzo;SC 1;SC 2;Omaggio;Prezzo netto finale;Totale\n'+q.lines.map(l=>[l.code||'',l.name,l.qty,sc(l.list),sc(l.sc1),sc(l.sc2),sc(l.om),sc(r5(num(l.net))),sc(r2(num(l.qty)*num(l.net)))].map(cell).join(';')).join('\n');
}
function quoteHtml(q){
  const cl=byId('clients',q.clientId)||{},co=byId('companies',q.companyId)||{},T=qTotals(q);
  return `<!doctype html><html lang="it"><meta charset="utf-8"><title>${isOrd(q)?'Ordine':'Preventivo'} ${esc(q.number)}</title><style>body{font:13px/1.5 Arial,sans-serif;color:#17222b;max-width:980px;margin:30px auto;padding:0 20px}h1{font-size:24px;margin:0}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{padding:6px 7px;border-bottom:1px solid #ccd;text-align:left}th.n,td.n{text-align:right;white-space:nowrap}.t{margin-left:auto;width:280px}.t div{display:flex;justify-content:space-between}.g{font-weight:700;font-size:18px;border-top:2px solid #17222b;margin-top:6px;padding-top:6px}.m{color:#5b6a73}</style><h1>PREVENTIVO ${esc(q.number)}</h1><p class="m">del ${fdate(q.date)}</p><p><b>${esc(co.name||'')}</b><br>${esc(addr(co))}<br>${esc(co.phone||'')} ${esc(co.email||'')}</p><p><b>Spett.le ${esc(qCN(q))}</b><br>${esc(addr(cl))}</p>
  <table><tr><th>Articolo</th><th>Descrizione</th><th class="n">Qtà</th><th class="n">Prezzo</th><th class="n">SC 1</th><th class="n">SC 2</th><th class="n">Omaggio</th><th class="n">Netto finale</th><th class="n">Totale</th></tr>${q.lines.map(l=>`<tr><td>${esc(l.code||'')}</td><td>${esc(l.name)}</td><td class="n">${esc(l.qty)}</td><td class="n">${eurp(l.list)}</td><td class="n">${esc(sc(l.sc1))}</td><td class="n">${esc(sc(l.sc2))}</td><td class="n">${esc(sc(l.om))}</td><td class="n">${eurp(l.net)}</td><td class="n">${eur(num(l.qty)*num(l.net))}</td></tr>`).join('')}</table>
  <div class="t"><div><span>Imponibile</span><span>${eur(T.sub)}</span></div><div><span>IVA ${esc(q.vat)}%</span><span>${eur(T.vat)}</span></div><div class="g"><span>Totale</span><span>${eur(T.tot)}</span></div></div><p>${''}${q.transport?'<b>Trasporto:</b> '+esc(q.transport)+'<br>':''}${q.validity?'<b>Validità preventivo:</b> '+esc(q.validity)+'<br>':''}${q.delivery?'<b>Resa:</b> '+esc(q.delivery)+'<br>':''}${esc(q.notes||'')}</p></html>`;
}

<script>
/* ---------- carta intestata: logo azienda a sinistra, logo dell'agente a destra; anteprima, stampa, salvataggio ---------- */
const ME=()=>byId('settings','me')||{};
const logoSrc=o=>o&&o.logoId?blobSrc(o.logoId):((o&&o.logo)||'');
function resizeLogo(file,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('img')),'image/png')};img.onerror=()=>rej(new Error('img'));img.src=u})}
async function storeLogo(file){const b=await resizeLogo(file,600);if(ASSETS){try{const r=await ASSETS.upload(b,{type:'image/png'});return {logoId:r.id}}catch(e){}}return {logo:await blobToData(b)}}
async function withLogo(base,o){const {logo,rmLogo,...rest}=o;const c={...base,...rest};if(rmLogo==='1'){delete c.logo;delete c.logoId}if(logo){try{const p=await storeLogo(logo);delete c.logo;delete c.logoId;Object.assign(c,p)}catch(e){toast('Logo non valido')}}return c}
const ME_F=[{k:'name',label:'La tua azienda / ragione sociale',full:true},{k:'address',label:'Indirizzo',full:true},{k:'zip',label:'CAP'},{k:'city',label:'Città'},{k:'prov',label:'Provincia'},{k:'vat',label:'Partita IVA'},{k:'phone',label:'Telefono',type:'tel'},{k:'email',label:'Email',type:'email'},{k:'web',label:'Sito web'},{k:'footer',label:'Piè di pagina del preventivo (IBAN, condizioni di vendita…)',type:'textarea',full:true},{k:'logo',label:'Il tuo logo',type:'image',full:true},{k:'rmLogo',label:'Logo',type:'select',opts:[['','Mantieni quello attuale'],['1','Rimuovi il logo']],full:true},{k:'headText',label:'Testo da mostrare in intestazione (facoltativo)',type:'textarea',rows:2,full:true,ph:'es. nome commerciale, slogan, recapiti…'}];
Object.assign(ACT,{
  editMe:()=>{const me=ME();openForm('La mia azienda · carta intestata',ME_F,{...me,rmLogo:'',_img:logoSrc(me)},async o=>{const d=await withLogo({...me,id:'me'},o);await save('settings',d)},'Questi dati e il tuo logo compaiono a destra nell\'intestazione dei preventivi. Il logo dell\'azienda rappresentata va nella sua scheda, e compare a sinistra.')},
  newCompany:()=>openForm('Nuova azienda',COMPANY_F,{},async o=>{const c=await withLogo({id:uid(),contacts:[]},o);await save('companies',c,true);ui.view='aziende';ui.sel=c.id;ui.q='';render()}),
  editCompany:d=>{const c=ent('companies',d.id);openForm('Modifica azienda',COMPANY_F,{...c,rmLogo:'',_img:logoSrc(c)},async o=>save('companies',await withLogo(c,o)))},
  qPreview:()=>{ui.qprev=true;render();$('#app').scrollTop=0},
  qBack:()=>{ui.qprev=false;render()},
  qPrint:()=>qDownload(true),
  qSaveDoc:()=>qDownload(false),
  exportHtml:()=>qDownload(false)
});

const PAPER_CSS=`.paper{background:#fff;color:#111;font:10pt/1.45 Arial,Helvetica,sans-serif;width:210mm;max-width:100%;margin:0 auto;padding:14mm;box-sizing:border-box}

const fmtQ=v=>fmtQty(v);
const Q_COLS=[['code','Articolo',0],['name','Descrizione',0],['qty','Qtà',1],['list','Prezzo',1],['sc1','SC 1',1],['sc2','SC 2',1],['om','Omaggio',1],['net','Netto finale',1],['tot','Totale',1]];
const qShown=q=>Q_COLS.filter(c=>!(q.hide&&q.hide[c[0]]));
function paperTable(q){
  const cs=qShown(q),cell=(k,l)=>({code:()=>esc(l.code||''),name:()=>esc(l.name),qty:()=>esc(fmtQ(l.qty)),list:()=>eurp(l.list),sc1:()=>esc(sc(l.sc1)),sc2:()=>esc(sc(l.sc2)),om:()=>esc(sc(l.om)),net:()=>eurp(l.net),tot:()=>eur(num(l.qty)*num(l.net))}[k]());
  if(!cs.length)return '';
  return `<table><thead><tr>${cs.map(c=>`<th${c[2]?' class="n"':''}>${c[1]}</th>`).join('')}</tr></thead><tbody>${q.lines.map(l=>`<tr>${cs.map(c=>`<td${c[2]?' class="n"':''}>${cell(c[0],l)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cs.length}">Nessun articolo.</td></tr>`}</tbody></table>`;
}
function qColsBar(q){

}
function paperBody(q,logos){

  const ht=o=>o.headText?`<div class="ht">${esc(o.headText)}</div>`:'';

  <div class="meta"><div><h1>${qWord(q)}${q.hide&&q.hide.number?'':' '+esc(q.number)}</h1><div class="sm">del ${fdate(q.date)}</div></div>

<script>
/* ---------- Clienti: import/export Excel + stampa scheda ---------- */
const CX_COLS=[['name','Ragione sociale'],['address','Indirizzo'],['zip','CAP'],['city','Città'],['prov','Provincia'],['vat','P.IVA / Cod. fiscale'],['phone','Telefono'],['email','Email'],['pec','PEC / Codice SDI'],['web','Sito web'],['status','Stato'],['sectors','Settori'],['notes','Note']];
const CX_CON=[['client','Cliente'],['name','Nome e cognome'],['role','Ruolo'],['email','Email di lavoro'],['emailPers','Email personale'],['phone','Telefono diretto'],['mobile','Cellulare'],['notes','Note']];
const nz=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const CX_RE={name:/^(ragionesociale|nomecliente|cliente|denominazione|nome$)/,address:/^(indirizzo|via)/,zip:/^cap/,city:/^(citta|comune|localita)/,prov:/^prov/,vat:/^(piva|partitaiva|cf|codfisc|codicefiscale)/,phone:/^(tel|telefono)/,email:/^(email|mail)/,pec:/^(pec|sdi)/,web:/^(sito|web)/,status:/^stato/,sectors:/^settor/,notes:/^note/};
const CC_RE={client:/^(cliente|ragionesociale|azienda)/,name:/^(nome|referente|contatto)/,role:/^ruolo/,email:/^(emaildilavoro|email|mail)/,emailPers:/^(emailpers|mailpers|emailpersonale)/,phone:/^(tel|telefono)/,mobile:/^(cell|mobile)/,notes:/^note/};
function cxSheets(){
  const co=S.companies.slice().sort((a,b)=>a.name.localeCompare(b.name,'it'));
  const cl=S.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'it'));
  const head=[...CX_COLS.map(x=>x[1]),...co.flatMap(c=>['Cod. cliente – '+c.name,'Sconto base – '+c.name])];
  const rows=cl.map(c=>[...CX_COLS.map(([k])=>k==='sectors'?secNames(c):(c[k]||'')),...co.flatMap(a=>{const L=(c.links||[]).find(l=>l.companyId===a.id);return [L?L.code||'':'',L?L.discount||'':'']})]);
  const con=cl.flatMap(c=>(c.contacts||[]).map(k=>[c.name,...CX_CON.slice(1).map(([f])=>k[f]||'')]));
  return {A:[head,...rows],B:[CX_CON.map(x=>x[1]),...con]};
}
function cxCopyModal(txt){
  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet" style="width:min(760px,calc(100% - 24px))"><header><h3>Copia i clienti per Excel</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></header><p>Download non disponibile in questa vista: premi Copia tutto e incolla in Excel nella cella A1. (Dalla pagina aperta nel browser scarichi direttamente il file .xlsx.)</p><textarea id="tsvBox" readonly rows="10" style="font-family:var(--f-mono);font-size:12px;white-space:pre">${esc(txt)}</textarea><footer><button class="btn ghost" data-act="closeModal">Chiudi</button><button class="btn pri" data-act="copyTsv">Copia tutto</button></footer></div>`;
  const b=$('#tsvBox');b.focus();b.select();
}
async function cxExport(){
  const {A,B}=cxSheets();
  try{if(!DL||typeof XLSX==='undefined')throw 0;
    const wb=XLSX.utils.book_new(),w1=XLSX.utils.aoa_to_sheet(A),w2=XLSX.utils.aoa_to_sheet(B);
    w1['!cols']=A[0].map((h,i)=>({wch:Math.min(36,Math.max(12,String(h).length+2))}));w2['!cols']=B[0].map(()=>({wch:24}));
    XLSX.utils.book_append_sheet(wb,w1,'Clienti');XLSX.utils.book_append_sheet(wb,w2,'Contatti');
    await DL.save({filename:'clienti.xlsx',data:XLSX.write(wb,{bookType:'xlsx',type:'array'})});toast('File salvato');return}
  catch(e){if(e&&e.code==='declined')return}
  cxCopyModal(A.map(r=>r.join('\t')).join('\n'));
}
const CXI={res:null};
function cxMap(hdr,RE){const m={};hdr.forEach((h,i)=>{const n=nz(h);for(const k in RE){if(!(k in m)&&RE[k].test(n)){m[k]=i;break}}});return m}
function cxParse(wb){
  const names=wb.SheetNames,sh=n=>names.find(x=>nz(x)===n),sc=wb.Sheets[sh('clienti')||names[0]];
  const rows=XLSX.utils.sheet_to_json(sc,{header:1,raw:false,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
  if(rows.length<2)return {err:'Il foglio dei clienti è vuoto.'};
  const hdr=rows[0],m=cxMap(hdr,CX_RE);if(m.name==null)return {err:'Non trovo la colonna «Ragione sociale». Usa il file esportato dal programma come modello.'};
  const cc=[];hdr.forEach((h,i)=>{const a=String(h).match(/^\s*cod\.?\s*cliente\s*[–-]\s*(.+)$/i),b=String(h).match(/^\s*sconto\s*base\s*[–-]\s*(.+)$/i);
    if(a)cc.push({i,co:a[1].trim(),f:'code'});if(b)cc.push({i,co:b[1].trim(),f:'discount'})});
  const get=(r,k)=>m[k]==null?'':String(r[m[k]]==null?'':r[m[k]]).trim();
  const clients=rows.slice(1).map(r=>{const o={};Object.keys(CX_RE).forEach(k=>{o[k]=get(r,k)});o.links=cc.map(x=>({co:x.co,f:x.f,v:String(r[x.i]==null?'':r[x.i]).trim()})).filter(x=>x.v);return o}).filter(o=>o.name);
  let contacts=[];const cs=sh('contatti');
  if(cs){const r2=XLSX.utils.sheet_to_json(wb.Sheets[cs],{header:1,raw:false,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
    if(r2.length>1){const mm=cxMap(r2[0],CC_RE);if(mm.client!=null&&mm.name!=null)contacts=r2.slice(1).map(r=>{const o={};Object.keys(CC_RE).forEach(k=>{o[k]=mm[k]==null?'':String(r[mm[k]]==null?'':r[mm[k]]).trim()});return o}).filter(o=>o.client&&(o.name||o.email||o.phone||o.mobile))}}
  const ex=n=>S.clients.find(c=>c.name.trim().toLowerCase()===n.trim().toLowerCase());
  return {clients,contacts,nNew:clients.filter(o=>!ex(o.name)).length,nUpd:clients.filter(o=>ex(o.name)).length};
}
function cxModal(){
  const r=CXI.res;
  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet"><header><h3>Importa clienti da Excel</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>
  ${r?`<p>Trovati <b>${r.clients.length}</b> clienti: <b>${r.nNew}</b> nuovi e <b>${r.nUpd}</b> già presenti (stesso nome), che vengono aggiornati con i campi compilati nel file senza cancellare gli altri. Contatti di riferimento letti: <b>${r.contacts.length}</b>. I settori nuovi vengono creati in automatico.</p>`
  :`<p>Carica un file <b>Excel (.xlsx, .xls)</b>, <b>CSV</b> o <b>PDF</b> (nel PDF scegli tu colonne e righe da caricare). Il modo più semplice è partire dal file prodotto da <b>Esporta Excel</b>: foglio «Clienti» (Ragione sociale, Indirizzo, CAP, Città, Provincia, P.IVA, Telefono, Email, PEC, Sito web, Stato, Settori separati da virgola, Note, Cod. cliente e Sconto base per azienda) e foglio facoltativo «Contatti».</p>`}
  <label class="fld"><span>File</span><input type="file" accept=".xlsx,.xls,.csv,.ods,.txt,.pdf" data-cxi="file"></label><p id="cxErr" style="color:var(--bad)"></p>
  <footer><button class="btn ghost" data-act="cExport">Scarica modello (con i tuoi dati)</button><button class="btn ghost" data-act="closeModal">Annulla</button>${r?'<button class="btn pri" data-act="cxGo">Importa</button>':''}</footer></div>`;
}
async function cxGo(){
  const r=CXI.res;if(!r)return;let nn=0,nu=0,nc=0;
  const secId=name=>{name=name.trim();if(!name)return null;let s=S.sectors.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!s){s={id:uid(),name};S.sectors.push(s);save('sectors',s,true)}return s.id};
  for(const o of r.clients){
    let c=S.clients.find(x=>x.name.trim().toLowerCase()===o.name.toLowerCase());const isNew=!c;
    c=isNew?{id:uid(),name:o.name,status:'Attivo',contacts:[],links:[],sectorIds:[]}:{...c,contacts:[...(c.contacts||[])],links:(c.links||[]).map(l=>({...l})),sectorIds:[...(c.sectorIds||[])]};
    ['address','zip','city','prov','vat','phone','email','pec','web','notes'].forEach(k=>{if(o[k])c[k]=o[k]});
    if(o.status){const s=['Attivo','Potenziale','Inattivo'].find(x=>x.toLowerCase()===o.status.toLowerCase());if(s)c.status=s}
    o.sectors.split(/[,;]/).map(secId).filter(Boolean).forEach(id=>{if(!c.sectorIds.includes(id))c.sectorIds.push(id)});
    for(const x of o.links){const a=S.companies.find(z=>z.name.trim().toLowerCase()===x.co.toLowerCase());if(!a)continue;
      let L=c.links.find(l=>l.companyId===a.id);if(!L){L={companyId:a.id,code:'',discount:'',payment:'',notes:'',customs:[]};c.links.push(L)}L[x.f]=x.v}
    for(const k of r.contacts.filter(z=>z.client.trim().toLowerCase()===o.name.toLowerCase())){
      if(c.contacts.some(z=>(z.name||'').toLowerCase()===k.name.toLowerCase()&&(z.email||'').toLowerCase()===k.email.toLowerCase()))continue;
      const {client,...ct}=k;c.contacts.push(ct);nc++}
    await save('clients',c,true);isNew?nn++:nu++;
  }
  CXI.res=null;closeModal();render();toast(nn+' nuovi, '+nu+' aggiornati, '+nc+' contatti aggiunti');
}
document.addEventListener('change',async e=>{
  const t=e.target;if(!t.dataset||t.dataset.cxi!=='file')return;const f=t.files[0],er=$('#cxErr');if(!f)return;if(/\.pdf$/i.test(f.name))return;
  try{if(typeof XLSX==='undefined')throw 0;const res=cxParse(XLSX.read(await f.arrayBuffer(),{type:'array'}));
    if(res.err){er.textContent=res.err;return}CXI.res=res;cxModal()}
  catch(x){er.textContent='Impossibile leggere il file. Usa un file .xlsx, .xls o .csv.'}
});

  const o=(k,l)=>`<label class="chk"><input type="checkbox" data-sheet="${k}" ${SHEET_OPT[k]?'checked':''}> <span>${l}</span></label>`;

function clientSheetBody(c,logo){
  const me=ME(),sec=(c.sectorIds||[]).filter(id=>byId('sectors',id)).map(secName).join(', ');
  const kv=(l,v)=>v?`<tr><th>${l}</th><td>${esc(v)}</td></tr>`:'';

  const pls=links.map(({co})=>({co,P:getPl(c.id,co.id)})).filter(x=>x.P&&(x.P.rows||[]).length);
  const dati=`<table class="kvt">${kv('Indirizzo',addr(c))}${kv('Telefono',c.phone)}${kv('Email',c.email)}${kv('PEC / SDI',c.pec)}${kv('P.IVA / C.F.',c.vat)}${kv('Sito web',c.web)}${kv('Stato',c.status)}${kv('Settori',sec)}${kv('Note',c.notes)}</table>
  ${(c.contacts||[]).length?`<h3 class="cs">Contatti di riferimento</h3><table><thead><tr><th>Nome</th><th>Ruolo</th><th>Email lavoro</th><th>Email personale</th><th>Telefono</th><th>Cellulare</th></tr></thead><tbody>${c.contacts.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td>${esc(k.role)}</td><td>${esc(k.email)}</td><td>${esc(k.emailPers)}</td><td>${esc(k.phone)}</td><td>${esc(k.mobile)}</td></tr>`).join('')}</tbody></table>`:''}
  ${links.length?`<h3 class="cs">Aziende trattate</h3><table><thead><tr><th>Azienda</th><th>Cod. cliente</th><th>Sconto base</th><th>Pagamento</th></tr></thead><tbody>${links.map(({L,co})=>`<tr><td><b>${esc(co.name)}</b></td><td>${esc(L.code)}</td><td>${esc(L.discount?String(L.discount).replace('.',',')+'%':'')}</td><td>${esc(L.payment)}</td></tr>`).join('')}</tbody></table>`:''}`;
  const prev=`<h3 class="cs">Preventivi fatti</h3>${qs.length?`<table><thead><tr><th>N.</th><th>Data</th><th>Azienda</th><th>Stato</th><th class="n">Imponibile</th></tr></thead><tbody>${qs.map(q=>`<tr><td>${esc(q.number)}</td><td>${fdate(q.date)}</td><td>${esc((byId('companies',q.companyId)||{}).name||'')}</td><td>${esc(q.status)}</td><td class="n">${eur(qTotals(q).sub)}</td></tr>`).join('')}</tbody></table>`:'<p class="sm">Nessun preventivo.</p>'}`;
  const list=pls.length?pls.map(({co,P})=>`<h3 class="cs">Listino personalizzato · ${esc(co.name)}</h3><table><thead><tr><th>Articolo</th><th>Descrizione</th><th class="n">Qtà</th><th class="n">Prezzo</th><th class="n">SC 1</th><th class="n">SC 2</th><th class="n">Omaggio</th><th class="n">Netto finale</th></tr></thead><tbody>${P.rows.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.desc)}</td><td class="n">${esc(r.qty)}</td><td class="n">${esc(r.price)}</td><td class="n">${esc(r.sc1)}</td><td class="n">${esc(r.sc2)}</td><td class="n">${esc(r.gift)}</td><td class="n"><b>${fmtNet(r)}</b></td></tr>`).join('')}</tbody></table>`).join(''):`<h3 class="cs">Listini personalizzati</h3><p class="sm">Nessun listino personalizzato.</p>`;
  return `<div class="paper"><div class="ph"><div class="blk l">${logo?`<img class="lg" src="${esc(logo)}" alt="">`:''}<div class="nm">${esc(me.name||'')}</div></div><div class="blk r"><div class="sm">${esc(addr(me))}</div><div class="sm">${[me.phone,me.email].filter(Boolean).map(esc).join(' · ')}</div></div></div>
  <div class="meta"><div><h1>SCHEDA CLIENTE</h1><div class="sm">stampata il ${fdate(today())}</div></div></div>
  <h2 class="cs">${esc(c.name)}</h2>
  ${SHEET_OPT.dati?dati:''}${SHEET_OPT.prev?prev:''}${SHEET_OPT.list?list:''}
  ${me.footer?`<div class="ft">${esc(me.footer)}</div>`:''}</div>`;
}
const CS_CSS=`.paper table:not(.kvt) td,.paper table:not(.kvt) td.n{text-align:center!important}.paper h2.cs{font:700 14pt Arial,sans-serif;margin:4mm 0 2mm}.paper h3.cs{font:700 10pt Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:6mm 0 1mm;border-bottom:1px solid #111;padding-bottom:1mm}.paper table.kvt th{text-align:left!important;width:32mm;background:none;text-transform:none;font-size:9pt;color:#555;border-bottom:.5pt solid #ddd}.paper table.kvt td{font-size:10pt}`;

<script>
/* ---------- Aziende: import/export Excel + stampa scheda ---------- */
const AX_COLS=[['name','Nome azienda'],['address','Indirizzo'],['zip','CAP'],['city','Città'],['prov','Provincia'],['vat','Partita IVA'],['phone','Telefono'],['email','Email'],['web','Sito web'],['commission','Provvigione %'],['notes','Note']];
const AX_RE={name:/^(nomeazienda|ragionesociale|azienda|denominazione|nome$)/,address:/^(indirizzo|via)/,zip:/^cap/,city:/^(citta|comune|localita)/,prov:/^prov(incia|$)/,vat:/^(piva|partitaiva|cf|codfisc|codicefiscale)/,phone:/^(tel|telefono)/,email:/^(email|mail)/,web:/^(sito|web)/,commission:/^provvig/,notes:/^note/};
const AC_COLS=[['company','Azienda'],['name','Nome e cognome'],['role','Ruolo'],['email','Email di lavoro'],['emailPers','Email personale'],['phone','Telefono diretto'],['mobile','Cellulare'],['notes','Note']];
const AC_RE={company:/^(azienda|ragionesociale)/,name:/^(nome|referente|contatto)/,role:/^ruolo/,email:/^(emaildilavoro|email|mail)/,emailPers:/^(emailpers|mailpers|emailpersonale)/,phone:/^(tel|telefono)/,mobile:/^(cell|mobile)/,notes:/^note/};
function axSheets(){
  const co=S.companies.slice().sort((a,b)=>a.name.localeCompare(b.name,'it'));
  return {A:[AX_COLS.map(x=>x[1]),...co.map(c=>AX_COLS.map(([k])=>c[k]||''))],
    B:[AC_COLS.map(x=>x[1]),...co.flatMap(c=>(c.contacts||[]).map(k=>[c.name,...AC_COLS.slice(1).map(([f])=>k[f]||'')]))]};
}
async function axExport(){
  const {A,B}=axSheets();
  try{if(!DL||typeof XLSX==='undefined')throw 0;
    const wb=XLSX.utils.book_new(),w1=XLSX.utils.aoa_to_sheet(A),w2=XLSX.utils.aoa_to_sheet(B);
    w1['!cols']=A[0].map(h=>({wch:Math.min(36,Math.max(12,String(h).length+2))}));w2['!cols']=B[0].map(()=>({wch:24}));
    XLSX.utils.book_append_sheet(wb,w1,'Aziende');XLSX.utils.book_append_sheet(wb,w2,'Contatti');
    await DL.save({filename:'aziende.xlsx',data:XLSX.write(wb,{bookType:'xlsx',type:'array'})});toast('File salvato');return}
  catch(e){if(e&&e.code==='declined')return}
  cxCopyModal(A.map(r=>r.join('\t')).join('\n'));
}
const AXI={res:null};
function axParse(wb){
  const names=wb.SheetNames,sh=n=>names.find(x=>nz(x)===n),sc=wb.Sheets[sh('aziende')||names[0]];
  const rows=XLSX.utils.sheet_to_json(sc,{header:1,raw:false,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
  if(rows.length<2)return {err:'Il foglio delle aziende è vuoto.'};
  const m=cxMap(rows[0],AX_RE);if(m.name==null)return {err:'Non trovo la colonna «Nome azienda». Usa il file esportato dal programma come modello.'};
  const companies=rows.slice(1).map(r=>{const o={};Object.keys(AX_RE).forEach(k=>{o[k]=m[k]==null?'':String(r[m[k]]==null?'':r[m[k]]).trim()});return o}).filter(o=>o.name);
  let contacts=[];const cs=sh('contatti');
  if(cs){const r2=XLSX.utils.sheet_to_json(wb.Sheets[cs],{header:1,raw:false,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
    if(r2.length>1){const mm=cxMap(r2[0],AC_RE);if(mm.company!=null&&mm.name!=null)contacts=r2.slice(1).map(r=>{const o={};Object.keys(AC_RE).forEach(k=>{o[k]=mm[k]==null?'':String(r[mm[k]]==null?'':r[mm[k]]).trim()});return o}).filter(o=>o.company&&(o.name||o.email||o.phone||o.mobile))}}
  const ex=n=>S.companies.find(c=>c.name.trim().toLowerCase()===n.trim().toLowerCase());
  return {companies,contacts,nNew:companies.filter(o=>!ex(o.name)).length,nUpd:companies.filter(o=>ex(o.name)).length};
}
function axModal(){
  const r=AXI.res;
  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet"><header><h3>Importa aziende da Excel</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>
  ${r?`<p>Trovate <b>${r.companies.length}</b> aziende: <b>${r.nNew}</b> nuove e <b>${r.nUpd}</b> già presenti (stesso nome), che vengono aggiornate con i campi compilati nel file senza cancellare gli altri, listino compreso. Contatti di riferimento letti: <b>${r.contacts.length}</b>.</p>`
  :`<p>Carica un file <b>Excel (.xlsx, .xls)</b> o <b>CSV</b>. Il modo più semplice è partire dal file prodotto da <b>Esporta Excel</b>: foglio «Aziende» (Nome azienda, Indirizzo, CAP, Città, Provincia, Partita IVA, Telefono, Email, Sito web, Provvigione %, Note) e foglio facoltativo «Contatti». Il listino articoli si importa dalla scheda dell'azienda.</p>`}
  <label class="fld"><span>File</span><input type="file" accept=".xlsx,.xls,.csv,.ods,.txt" data-axi="file"></label><p id="axErr" style="color:var(--bad)"></p>
  <footer><button class="btn ghost" data-act="aExport">Scarica modello (con i tuoi dati)</button><button class="btn ghost" data-act="closeModal">Annulla</button>${r?'<button class="btn pri" data-act="axGo">Importa</button>':''}</footer></div>`;
}
async function axGo(){
  const r=AXI.res;if(!r)return;let nn=0,nu=0,nc=0;
  for(const o of r.companies){
    let c=S.companies.find(x=>x.name.trim().toLowerCase()===o.name.toLowerCase());const isNew=!c;
    c=isNew?{id:uid(),name:o.name,contacts:[]}:{...c,contacts:[...(c.contacts||[])]};
    ['address','zip','city','prov','vat','phone','email','web','notes'].forEach(k=>{if(o[k])c[k]=o[k]});
    if(o.commission)c.commission=num(o.commission);
    for(const k of r.contacts.filter(z=>z.company.trim().toLowerCase()===o.name.toLowerCase())){
      if(c.contacts.some(z=>(z.name||'').toLowerCase()===k.name.toLowerCase()&&(z.email||'').toLowerCase()===k.email.toLowerCase()))continue;
      const {company,...ct}=k;c.contacts.push(ct);nc++}
    await save('companies',c,true);isNew?nn++:nu++;
  }
  AXI.res=null;closeModal();render();toast(nn+' nuove, '+nu+' aggiornate, '+nc+' contatti aggiunti');
}
document.addEventListener('change',async e=>{
  const t=e.target;if(!t.dataset||t.dataset.axi!=='file')return;const f=t.files[0],er=$('#axErr');if(!f)return;
  try{if(typeof XLSX==='undefined')throw 0;const res=axParse(XLSX.read(await f.arrayBuffer(),{type:'array'}));
    if(res.err){er.textContent=res.err;return}AXI.res=res;axModal()}
  catch(x){er.textContent='Impossibile leggere il file. Usa un file .xlsx, .xls o .csv.'}
});
Object.assign(ACT,{
  aExport:()=>axExport(),
  aImport:()=>{AXI.res=null;axModal()},
  axGo:()=>axGo(),
  aPrint:d=>{ui.aprev=d.id;render();$('#app').scrollTop=0},
  aBack:()=>{ui.aprev=null;render()},
  aPrintGo:()=>aDownload(true),
  aSaveDoc:()=>aDownload(false)
});
const _sel1=ACT.sel,_back1=ACT.back;
ACT.sel=d=>{ui.aprev=null;_sel1(d)};ACT.back=d=>{ui.aprev=null;_back1(d)};
const _companyList0=companyList;
companyList=function(){const h=_companyList0(),bar=`<div class="acts abar"><button class="btn sm" data-act="aImport">Importa Excel</button><button class="btn sm" data-act="aExport">Esporta Excel</button></div>`;
  return h.startsWith('<div class="list">')?h.replace('<div class="list">','<div class="list">'+bar):bar+h};
const _companyDetail0=companyDetail;
companyDetail=function(c){
  if(ui.aprev===c.id)return companyPreview(c);
  return _companyDetail0(c).replace('<button class="btn" data-act="editCompany"','<button class="btn" data-act="aPrint" data-id="'+c.id+'">Stampa scheda</button><button class="btn" data-act="editCompany"');
};
function companySheetBody(c,logo){
  const me=ME(),kv=(l,v)=>v?`<tr><th>${l}</th><td>${esc(v)}</td></tr>`:'';
  const its=S.items.filter(i=>i.companyId===c.id).sort((a,b)=>String(a.code).localeCompare(String(b.code),'it',{numeric:true}));
  const cls=S.clients.filter(k=>(k.links||[]).some(l=>l.companyId===c.id)).sort((a,b)=>a.name.localeCompare(b.name,'it'));
  const qs=S.quotes.filter(q=>q.companyId===c.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const dati=`<table class="kvt">${kv('Indirizzo',addr(c))}${kv('Telefono',c.phone)}${kv('Email',c.email)}${kv('Partita IVA',c.vat)}${kv('Sito web',c.web)}${kv('Provvigione',c.commission?String(c.commission).replace('.',',')+'%':'')}${kv('Note',c.notes)}</table>
  ${(c.contacts||[]).length?`<h3 class="cs">Contatti di riferimento</h3><table><thead><tr><th>Nome</th><th>Ruolo</th><th>Email lavoro</th><th>Email personale</th><th>Telefono</th><th>Cellulare</th></tr></thead><tbody>${c.contacts.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td>${esc(k.role)}</td><td>${esc(k.email)}</td><td>${esc(k.emailPers)}</td><td>${esc(k.phone)}</td><td>${esc(k.mobile)}</td></tr>`).join('')}</tbody></table>`:''}
  ${cls.length?`<h3 class="cs">Clienti trattati (${cls.length})</h3><table><thead><tr><th>Cliente</th><th>Cod. cliente</th><th>Sconto base</th></tr></thead><tbody>${cls.map(k=>{const L=k.links.find(l=>l.companyId===c.id);return `<tr><td><b>${esc(k.name)}</b></td><td>${esc(L.code)}</td><td>${esc(L.discount?String(L.discount).replace('.',',')+'%':'')}</td></tr>`}).join('')}</tbody></table>`:''}`;
  const prev=`<h3 class="cs">Preventivi fatti</h3>${qs.length?`<table><thead><tr><th>N.</th><th>Data</th><th>Cliente</th><th>Stato</th><th class="n">Imponibile</th></tr></thead><tbody>${qs.map(q=>`<tr><td>${esc(q.number)}</td><td>${fdate(q.date)}</td><td>${esc(qCN(q))}</td><td>${esc(q.status)}</td><td class="n">${eur(qTotals(q).sub)}</td></tr>`).join('')}</tbody></table>`:'<p class="sm">Nessun preventivo.</p>'}`;
  const list=`<h3 class="cs">Listino articoli (${its.length})</h3>${its.length?`<table><thead><tr><th>Codice</th><th>Descrizione</th><th>UM</th><th class="n">Listino</th></tr></thead><tbody>${its.map(i=>`<tr><td>${esc(i.code)}</td><td><b>${esc(i.name)}</b>${i.description?`<div class="sm">${esc(i.description)}</div>`:''}</td><td>${esc(i.unit||'')}</td><td class="n">${eurp(i.price)}</td></tr>`).join('')}</tbody></table>`:'<p class="sm">Listino vuoto.</p>'}`;
  return `<div class="paper"><div class="ph"><div class="blk l">${logo?`<img class="lg" src="${esc(logo)}" alt="">`:''}<div class="nm">${esc(me.name||'')}</div></div><div class="blk r"><div class="sm">${esc(addr(me))}</div><div class="sm">${[me.phone,me.email].filter(Boolean).map(esc).join(' · ')}</div></div></div>
  <div class="meta"><div><h1>SCHEDA AZIENDA</h1><div class="sm">stampata il ${fdate(today())}</div></div></div>
  <h2 class="cs">${esc(c.name)}</h2>
  ${SHEET_OPT.dati?dati:''}${SHEET_OPT.prev?prev:''}${SHEET_OPT.list?list:''}
  ${me.footer?`<div class="ft">${esc(me.footer)}</div>`:''}</div>`;
}
function companyPreview(c){
  return `<div class="detail"><div class="dhead"><div class="t"><button class="back" style="display:block" data-act="aBack">← Torna alla scheda</button><h2>Anteprima scheda azienda</h2></div>
  <div class="acts"><button class="btn" data-act="editMe">La mia azienda e logo</button><button class="btn" data-act="aSaveDoc">Salva documento</button><button class="btn pri" data-act="aPrintGo">Stampa</button></div></div>
  ${sheetOptsBar('Listino articoli')}<div style="background:var(--line);padding:16px;border-radius:10px;overflow-x:auto"><style>${PAPER_CSS}${CS_CSS}.paper{box-shadow:0 2px 16px rgba(0,0,0,.25)}</style>${companySheetBody(c,logoSrc(ME()))}</div></div>`;
}
async function aDownload(auto){
  const c=byId('companies',ui.aprev);if(!c)return;
  if(!DL){$('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet"><h3>Stampa non disponibile in questa vista</h3><p>Da qui non è possibile stampare né scaricare file. Apri la pagina dal suo link nel browser e usa di nuovo <b>Stampa</b>: scarica la scheda e apre la finestra di stampa, dove puoi anche scegliere «Salva come PDF».</p><footer><button class="btn pri" data-act="closeModal">Ho capito</button></footer></div>`;return}
  const html=`<!doctype html><html lang="it"><meta charset="utf-8"><title>Scheda azienda</title><style>${PAPER_CSS}${CS_CSS}@page{size:A4;margin:12mm}@media screen{body{margin:0;background:#e5e7eb;padding:16px}.paper{box-shadow:0 2px 16px rgba(0,0,0,.25)}}@media print{body{margin:0}.paper{padding:0;width:auto}}</style>${companySheetBody(c,await toDataUri(logoSrc(ME())))}${auto?'<script>onload=function(){setTimeout(function(){print()},400)}<\/script>':''}</html>`;
  await dl('Scheda_'+String(c.name).replace(/[\\/:*?"<>|]/g,'-')+'.html',html);
  if(auto)toast('Apri il file scaricato: si apre la stampa (scegli «Salva come PDF» per il PDF)');
}
</script>
<script>
/* ---------- Marketing: campioni, cataloghi e listini, comunicazioni ---------- */
const MK_T={
  campioni:{label:'Campioni',new:'Nuovo campione',type:'campione',modes:[['mano','Consegnato a mano'],['spedito','Spedito']]},
  cataloghi:{label:'Cataloghi e listini',new:'Nuovo invio',type:'catalogo',modes:[['mano','Consegnato a mano'],['mail','Inviato via mail']]},
  comunicazioni:{label:'Comunicazioni',new:'Nuova comunicazione',type:'comunicazione',modes:[['mano','Consegnata a mano'],['mail','Inviata via mail']]}
};
const MK_MODE={mano:'A mano',spedito:'Spedito',mail:'Via mail'};
ui.mk='campioni';
const mkRecs=t=>S.marketing.filter(r=>r.type===MK_T[t].type).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||String(b.id).localeCompare(String(a.id)));
function marketingView(){
  const t=ui.mk,list=mkRecs(t);
  const tabs=Object.keys(MK_T).map(k=>`<button class="btn ${k===t?'pri':''}" data-act="mkTab" data-v="${k}">${MK_T[k].label} <span class="muted" style="${k===t?'color:inherit;opacity:.8':''}">(${mkRecs(k).length})</span></button>`).join('');
  const th=t==='campioni'?'<th>Articolo</th>':t==='cataloghi'?'<th>Testo</th>':'<th>Comunicazione</th>';
  const rows=list.map(r=>{
    const mid=t==='campioni'?((r.itemList&&r.itemList.length?r.itemList:(r.itemText?[r.itemText]:[])).map(esc).join('<br>')):t==='cataloghi'?`<div style="max-width:420px;white-space:pre-line;text-align:left">${esc(r.text||'')}</div>`:`<div style="max-width:420px;white-space:pre-line;text-align:left">${esc(r.text||'')}</div>`;
    const rc=(r.recipients||[]).length;
    return `<tr><td>${fdate(r.date)}</td><td><b>${esc(r.clientName||'')}</b></td><td>${esc(r.companyName||'')}${r.contactName?`<div class="muted" style="font-size:12px">Ref.: ${esc(r.contactName)}</div>`:''}</td><td>${mid}</td><td>${esc(MK_MODE[r.mode]||'')}</td>${t!=='campioni'?`<td>${rc?`<button class="btn sm" data-act="mkRecips" data-id="${r.id}">${rc} contatti</button>`:'—'}</td>`:''}<td style="max-width:240px;white-space:pre-line">${esc(r.notes||'')}</td><td style="white-space:nowrap"><button class="btn sm" data-act="mkEdit" data-id="${r.id}">Modifica</button> <button class="x" data-act="mkDel" data-id="${r.id}" aria-label="Elimina">×</button></td></tr>`}).join('');
  return `<div class="acts" style="margin-bottom:12px;flex-wrap:wrap">${tabs}</div>
  ${list.length?`<div class="tw"><table class="mkt"><thead><tr><th>Data</th><th>Cliente</th><th>Azienda</th>${th}<th>Modalità</th>${t!=='campioni'?'<th>Destinatari</th>':''}<th>Note</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
  :`<div class="empty"><span>Nessun elemento in «${MK_T[t].label}». Premi «+ ${MK_T[t].new}» in alto a destra per registrarne uno.</span></div>`}
  <style>.mkt th,.mkt td{text-align:center;vertical-align:middle}.mkt td:last-child{text-align:right}</style>`;
}
/* ---- form ---- */
const MKF={rec:null};
function mkItems(coId,coName){
  let id=coId;if(!id&&coName){const c=S.companies.find(x=>x.name.trim().toLowerCase()===String(coName).trim().toLowerCase());id=c&&c.id}
  return id?S.items.filter(i=>i.companyId===id):[];
}
function mkItemOpts(coId,coName){return mkItems(coId,coName).map(i=>`<option value="${esc((i.code?i.code+' - ':'')+i.name)}">`).join('')}
function mkCtBox(){
  const r=MKF.rec,c=r.companyId&&byId('companies',r.companyId),L=c?(c.contacts||[]):[],sel=new Set(r.contactNames||[]);
  const names=new Set(L.map(k=>k.name||k.email||''));
  const extra=(r.contactNames||[]).filter(n=>!names.has(n));
  const row=(n,label,checked)=>`<label class="chk" style="display:flex;gap:8px;align-items:center;padding:3px 0"><input type="checkbox" data-mkct="${esc(n)}" ${checked?'checked':''}> <span>${label}</span></label>`;
  const body=L.map(k=>row(k.name||k.email||'',`<b>${esc(k.name||'')}</b>${k.role?' ('+esc(k.role)+')':''}${k.email?' <span class="muted">'+esc(k.email)+'</span>':''}`,sel.has(k.name||k.email||''))).join('')+extra.map(n=>row(n,esc(n)+' <span class="muted">(scritto a mano)</span>',true)).join('');
  return body||`<p class="muted" style="margin:0">${c?'Questa azienda non ha ancora contatti: aggiungine uno qui sotto.':'Scegli un\'azienda dall\'archivio per vedere i suoi referenti, oppure scrivi i referenti a mano qui sotto.'}</p>`;
}
function mkCtRefresh(){const b=$('#mk_ctbox');if(b)b.innerHTML=mkCtBox()}
function mkItRefresh(){const b=$('#mk_itbox');if(!b)return;const L=MKF.rec.itemList||[];
  b.innerHTML=L.length?L.map((n,i)=>`<span class="chip" style="display:inline-flex;gap:6px;align-items:center">${esc(n)} <button type="button" class="x" data-act="mkDelItem" data-i="${i}" aria-label="Rimuovi" style="padding:0 2px">×</button></span>`).join(''):'<span class="muted">Nessun articolo aggiunto.</span>'}
function mkForm(t,id){
  const ex=id&&byId('marketing',id);
  const r=MKF.rec=ex?JSON.parse(JSON.stringify(ex)):{id:uid(),type:MK_T[t].type,date:today(),mode:MK_T[t].modes[0][0],recipients:[]};
  if(!r.itemList)r.itemList=r.itemText?[r.itemText]:[];
  if(!r.contactNames)r.contactNames=r.contactName?String(r.contactName).split(/\s*,\s*/).filter(Boolean):[];
  const isC=t==='campioni',isK=t==='cataloghi',isM=t==='comunicazioni';
  const cls=S.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'it')),cos=S.companies.slice().sort((a,b)=>a.name.localeCompare(b.name,'it'));
  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><form class="sheet" id="mkForm" style="width:min(680px,calc(100% - 24px));max-height:92vh;overflow:auto"><header><h3>${ex?'Modifica':MK_T[t].new}</h3><button type="button" class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>
  <div class="grid">
   <label class="fld full"><span>Cliente (scegli dalla lista oppure scrivi a mano)</span><select id="mk_clsel"><option value="">▾ Scegli un cliente memorizzato…</option>${cls.map(c=>`<option value="${c.id}" ${r.clientId===c.id?'selected':''}>${esc(c.name)}${c.city?' — '+esc(c.city):''}</option>`).join('')}</select><input id="mk_client" value="${esc(r.clientName||'')}" placeholder="…oppure scrivi un nome" style="margin-top:6px" autocomplete="off"></label>

function mkRc(){const r=MKF.rec,el=$('#mk_rc');if(!el)return;const n=(r.recipients||[]).length;

function mkParseRecipients(wb){
  const ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
  const EM=/[^\s@;,<>]+@[^\s@;,<>]+\.[^\s@;,<>]+/;
  const hdr=rows[0]||[],ei=hdr.findIndex(h=>/mail|pec/.test(nz(h))),ni=hdr.findIndex(h=>/^(nome|ragione|cliente|azienda|contatto|referente|denomin)/.test(nz(h)));
  const body=ei>=0?rows.slice(1):rows,out=[],seen=new Set();
  body.forEach(r=>{let em='';
    if(ei>=0){const m=String(r[ei]||'').match(EM);em=m?m[0]:''}else{for(const c of r){const m=String(c).match(EM);if(m){em=m[0];break}}}
    if(!em||seen.has(em.toLowerCase()))return;seen.add(em.toLowerCase());
    let nm=ni>=0?String(r[ni]||'').trim():(r.find(c=>String(c).trim()&&!EM.test(String(c)))||'');
    out.push({name:String(nm).trim(),email:em})});
  return out;
}

function mapSchema(w,h,z,x0,y0){

<script>

const PDFJS_V='3.11.174',PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_V+'/';
function pdfScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
async function pdfLoadLib(){

async function pdfLines(file){
  const lib=await pdfLoadLib(),doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,out=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent(),its=tc.items.filter(i=>String(i.str).trim()!=='').map(i=>({t:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0}));
    its.sort((a,b)=>b.y-a.y||a.x-b.x);
    const lines=[];its.forEach(i=>{const L=lines.find(l=>Math.abs(l.y-i.y)<=2.5);if(L){L.it.push(i)}else lines.push({y:i.y,it:[i]})});
    lines.sort((a,b)=>b.y-a.y).forEach(l=>{l.it.sort((a,b)=>a.x-b.x);const cells=[];
      l.it.forEach(i=>{const c=cells[cells.length-1];if(c&&i.x-c.xe<=Math.max(4,c.fs*.7)){c.t+=(i.x-c.xe>1?' ':'')+i.t.trim();c.xe=i.x+i.w}else cells.push({t:i.t.trim(),xs:i.x,xe:i.x+i.w,fs:Math.max(6,Math.min(14,(i.w/Math.max(1,i.t.length))*1.8))})});
      out.push(cells)})
  }
  return out;
}
function pdfGrid(lines){
  const ref=lines.filter(l=>l.length>=3).sort((a,b)=>b.length-a.length)[0]||lines.slice().sort((a,b)=>b.length-a.length)[0];
  if(!ref)return [];

  return lines.map(l=>{const row=A.map(()=>'');
    l.forEach(c=>{let bi=0,bd=1e9;A.forEach((a,i)=>{const d=Math.min(Math.abs(c.xs-a.xs),Math.abs(c.xe-a.xe),Math.abs((c.xs+c.xe)/2-(a.xs+a.xe)/2));if(d<bd){bd=d;bi=i}});row[bi]=row[bi]?row[bi]+' '+c.t:c.t});

}
const PD={kind:'',fname:'',grid:[],map:[],sel:[],fields:[]};
const PD_PL=[['','— ignora —'],['code','Articolo'],['desc','Descrizione'],['qty','Quantità'],['price','Prezzo'],['sc1','SC 1'],['sc2','SC 2'],['gift','Omaggio']];

const pdIsNum=v=>/^[-+]?\d{1,3}(\.\d{3})*(,\d+)?%?$|^[-+]?\d+([.,]\d+)?%?$/.test(String(v).trim());
function pdGuess(){

  if(PD.kind==='plist'){
    const stat=[...Array(n).keys()].map(j=>{const c=col(j);return {j,num:c.filter(pdIsNum).length/Math.max(1,c.length),len:c.reduce((a,x)=>a+x.length,0)/Math.max(1,c.length),n:c.length}});
    const used=new Set(),txt=stat.filter(s=>s.num<.5&&s.n>2);
    const code=txt.find(s=>s.len<=22)||txt[0];if(code){m[code.j]='code';used.add(code.j)}
    const desc=txt.filter(s=>!used.has(s.j)).sort((a,b)=>b.len-a.len)[0];if(desc){m[desc.j]='desc';used.add(desc.j)}

}
function pdModal(){

  ${g.length>300?`<p class="muted">Mostrate le prime 300 righe su ${g.length}: le altre non vengono caricate. Per file più lunghi importa a blocchi.</p>`:''}
  <p id="pdwarn" style="color:var(--warn)"></p>
  <footer><button class="btn ghost" data-act="closeModal">Annulla</button><button class="btn pri" data-act="pdGo">Continua</button></footer></div>`;

function pdValidRow(r){const get=k=>{const j=PD.map.indexOf(k);return j>=0?String(r[j]||'').trim():''};return PD.kind==='plist'?(get('code')&&!/^(totale|subtotale|pag\.?|pagina|listino)\b/i.test(get('code'))&&parsePrice(get('price'))!=null):!!get('name')}

      const res=plParse(arr);PI.fname=PD.fname;PI.rows=res.rows;PI.append=false;
      if(!res.rows.length){w.textContent='Nessuna riga valida: servono articolo e prezzo numerico.';return}

      const clients=rows.map(r=>{const o={};['name','address','zip','city','prov','vat','phone','email','pec','web','status','sectors','notes'].forEach(k=>o[k]=get(r,k));o.links=[];return o}).filter(o=>o.name);

<script>
/* ---------- Importazione "Stampa listini" del mandante (PDF anche scansionato → OCR) ---------- */
const ES={pre:'',fname:'',info:{company:''},clients:[],sel:[],coId:'',opt:{fisc:1,cond:1,cont:1,list:1,cond2:1},append:false,cancel:false,doc:null,worker:null,skip:0};
const esN=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const esClean=s=>String(s||'').replace(/^[\s—–\-_.~|'"`]+/,'').replace(/\s+[YN]$/,'').replace(/\s+/g,' ').trim();
const ES_NUM=/^(?:\d{1,3}(?:\.\d{3})*|\d+),\d+$/;
function esDisc(s){s=String(s||'').replace(/[^\d,.+]/g,'');if(!s)return '';return s.split('+').map(p=>{const n=parseFloat(p.replace(',','.'));return isFinite(n)?String(+n.toFixed(2)):''}).filter(Boolean).join('+')}
function esRow(s){
  s=s.replace(/(\d)(EUR)\b/g,'$1 $2').replace(/(EUR)([*®])/g,'$1 $2');
  const m=s.match(/^(\d{6,13})\s+(.+)$/);if(!m)return null;
  const t=m[2].split(' '),nums=[];
  while(t.length>1&&nums.length<4&&ES_NUM.test(t[t.length-1]))nums.unshift(t.pop());
  if(!nums.length)return null;
  while(t.length>1&&/^(EUR|€|[*®"'`.,;:]+|EUR[*®])$/i.test(t[t.length-1]))t.pop();
  let qty='';
  if(t.length>1&&/^(?:\d{1,3}(?:[.,]\d{3})+|\d+)$/.test(t[t.length-1]))qty=t.pop().replace(/[.,]/g,'');
  return {code:m[1],desc:t.join(' ').trim(),qty,price:nums[0],sc1:nums[1]||'',sc2:nums[2]||'',gift:nums[3]||''};
}
function esPers(s){
  s=s.replace(/(\d)(EUR)\b/g,'$1 $2');const t=s.split(' '),e=t.findIndex((x,i)=>i>2&&/^(EUR|€)$/i.test(x));
  if(e<0)return null;const k=t.findIndex((x,i)=>i>=2&&i<e&&/^\d+$/.test(x));if(k<0)return null;
  const tail=t.slice(e+1),pc=tail.filter(x=>/%/.test(x)).map(x=>x.replace('%','')),pl=tail.filter(x=>!/%/.test(x)&&/^\d/.test(x));
  let incr=pl[1]||'',s1='',s2='';if(pc.length>=3){incr=pc[0];s1=pc[1];s2=pc[2]}else{s1=pc[0]||'';s2=pc[1]||''}
  return {group:t.slice(0,k).join(' '),tipo:t[k],colore:t.slice(k+1,e).join(' '),base:pl[0]||'',incr,s1,s2};
}
function esMail(s){const m=String(s||'').replace(/\s+/g,'').match(/[\w.+\-]+@[\w\-]+(?:\.[\w\-]+)+/);return m?m[0].toLowerCase().replace(/[.,;]+$/,''):''}
function esParse(pages){
  const out=[],info={company:''};let cur=null,mode='',ct=null,skip=0;
  const KW=/^(AGENTE|BANCA|TEL\b|FIDO|SCONTI|Listino|DATA PER|OSSERVAZIONI|P\.?\s*IVA)/i;
  const start=(code,name)=>{cur={code:code||'',name:esClean(name),address:'',zip:'',city:'',prov:'',vat:'',phone:'',fax:'',pec:'',agent:'',channel:'',bank:'',payment:'',listino:'',discount:'',fido:'',exMonths:'',dueDays:'',obs:'',contacts:[],rows:[],condTitle:'',cond:[]};out.push(cur);mode='head';ct=null};
  pages.forEach(txt=>String(txt).split(/\r?\n/).forEach(raw=>{
    const s=String(raw).replace(/[|¦]/g,' ').replace(/\s+/g,' ').trim();if(!s)return;let m;
    if(m=s.match(/^(.*?)\s*-\s*STAMPA\s+LISTINI/i)){if(!info.company)info.company=m[1].trim();return}
    if(/^Pagina\s+\d+\s+di\s+\d+/i.test(s))return;
    if(m=s.match(/^[C€G]\s?(\d{6})\s+(.+)$/)){start('C'+m[1],m[2]);return}
    if(mode!=='pers'&&(m=s.match(/^(0{2}\d{4})\s+([A-Za-zÀ-ÿ].*)$/))&&!/\d,\d{2,}\s*$/.test(s)){start('C'+m[1],m[2]);return}
    if(!cur)return;
    if(/^Contatti\b/i.test(s)){mode='cont';return}
    if(/^Articolo\s+Descrizione/i.test(s)){mode='art';return}
    if(/^Listini\s+\S/i.test(s)&&!/STAMPA/i.test(s)){mode='pers';cur.condTitle=s.replace(/\s+/g,' ');return}
    if(/^Gruppo\s+Prodotto/i.test(s))return;
    if(mode==='pers'){const r=esPers(s);if(r)cur.cond.push(r);else skip++;return}
    if(mode==='art'){const r=esRow(s);if(r)cur.rows.push(r);else if(s.length>4)skip++;return}
    if(mode==='cont'){
      if(m=s.match(/^Nome\s*:?\s*(.*?)(?:\s+Posizione\s*:?\s*(.*))?$/i)){ct={name:esClean(m[1]).replace(/\s+[YN]$/,''),role:(m[2]||'').trim(),email:'',phone:'',mobile:''};cur.contacts.push(ct);return}
      if(ct&&/(Cellulare|Email|^Te[l1tIi])/i.test(s)){
        const before=s.split(/Cellulare/i)[0].replace(/Te[l1tIi]{1,2}\s*[12]?\s*:/gi,' '),ph=before.match(/\+?\d[\d\-\/. ]{4,}\d/g)||[];
        const cm=s.match(/Cellulare\s*:?\s*(.*?)\s*Email/i),em=s.match(/Email\s*:?\s*(.*)$/i);
        if(ph[0]&&!ct.phone)ct.phone=ph[0].trim();
        if(cm&&/\d/.test(cm[1]))ct.mobile=cm[1].replace(/[^\d+\-\/ ]/g,'').trim();
        if(em)ct.email=esMail(em[1]);
        return}
      return}
    /* intestazione del cliente */
    if(m=s.match(/^OSSERVAZIONI\s*:?\s*[—–\-_.~]*\s*(.*)$/i)){mode='obs';cur.obs=m[1].trim();return}
    if(mode==='obs'){cur.obs+=(cur.obs?'\n':'')+s;return}
    if(m=s.match(/P\.?\s*IVA\s*[:.]?\s*([A-Za-z1]{2})?\s*(\d{8,11})/i)){const pre=(m[1]||'').toUpperCase().replace(/[1L]/,'I');cur.vat=(pre?pre:'')+m[2]}
    const pre=s.split(/P\.?\s*IVA/i)[0].trim();
    if((m=pre.match(/^(\d{5})\s+(.+?)\s+([A-Z]{2})(?:\s+[A-Z]{2})?$/))&&!cur.zip){cur.zip=m[1];cur.city=m[2].trim();cur.prov=m[3];return}
    if(/\bTEL\b/i.test(s)||/\bFAX\b/i.test(s)){
      const a=s.split(/\bTEL\b\.?|\bFAX\b/i)[0].trim();if(a&&!cur.address&&!/^P\.?\s*IVA/i.test(a))cur.address=a;
      const tm=s.match(/\bTEL\b\.?\s*:?\s*([\d\-\/. +]*\d)/i),fm=s.match(/\bFAX\b\s*:?\s*([\d\-\/. +]*\d)/i);if(tm)cur.phone=tm[1].trim();if(fm)cur.fax=fm[1].trim();return}
    if(m=s.match(/AGENTE\s*:?\s*(.*?)(?:\s+CANALE\s*:?\s*(.*))?$/i)){cur.agent=(m[1]||'').trim();if(m[2])cur.channel=m[2].replace(/^[\s_—–\-]+/,'').trim();return}
    if(/^CANALE/i.test(s)){cur.channel=s.replace(/^CANALE\s*:?\s*/i,'').replace(/^[\s_—–\-]+/,'').trim();return}
    if(m=s.match(/^BANCA\s*:?\s*(.*)$/i)){cur.bank=m[1].trim();return}
    if(/Listino\s*\d|SCONTI/i.test(s)){
      const l=s.match(/Listino\s*(\d+)/i),sc=s.match(/SCONTI\s*:?\s*([\d,.+]+)/i);
      if(l)cur.listino=l[1];if(sc)cur.discount=esDisc(sc[1]);
      cur.payment=s.replace(/Listino\s*\d*/i,'').replace(/SCONTI\s*:?\s*[\d,.+]*/i,'').replace(/\s+/g,' ').trim();return}
    if(/FIDO|MESI\s*ESCLUSI|Scadenze/i.test(s)){
      const f=s.match(/FIDO\s*:?\s*([\d.,]+)/i),me=s.match(/MESI\s*ESCLUSI\s*:?\s*((?:\d+\s*)*)/i),gg=s.match(/Scadenze\s*:?\s*((?:\d+\s*)*)/i);
      if(f)cur.fido=f[1];if(me&&me[1].trim())cur.exMonths=me[1].trim().split(/\s+/).join(', ');if(gg&&gg[1].trim())cur.dueDays=gg[1].trim().split(/\s+/).join(', ');return}
    if(/^DATA PER/i.test(s))return;
    if(!cur.address&&!KW.test(s)){cur.address=s;return}
  }));
  out.forEach(c=>{const keep=[];c.contacts.forEach(k=>{if(/^PEC$/i.test(k.name)){if(k.email)c.pec=k.email}else if(k.name||k.email||k.phone||k.mobile)keep.push(k)});c.contacts=keep});
  info.skip=skip;return {info,clients:out};
}

async function esPageText(page){
  const tc=await page.getTextContent(),its=tc.items.filter(i=>String(i.str).trim()!=='').map(i=>({t:i.str,x:i.transform[4],y:i.transform[5]}));
  if(its.length<15)return null;
  its.sort((a,b)=>b.y-a.y||a.x-b.x);const L=[];its.forEach(i=>{const l=L.find(z=>Math.abs(z.y-i.y)<=2.5);if(l)l.it.push(i);else L.push({y:i.y,it:[i]})});
  return L.sort((a,b)=>b.y-a.y).map(l=>l.it.sort((a,b)=>a.x-b.x).map(i=>i.t.trim()).join(' ')).join('\n');
}
async function esWorker(){

  ES.worker=w;return w;
}
async function esOcrPage(page){

async function esRead(){

Object.assign(ACT,{lsMails:d=>{

<script>
/* ---------- Clienti da PDF / foto / testo: scegli tu le voci riga per riga ---------- */
const CP={fname:'',rows:[]};
const CP_F=[['','— ignora —'],['name','Ragione sociale (nuovo cliente)'],['address','Indirizzo'],['capcity','CAP · Città · Prov.'],['zip','CAP'],['city','Città'],['prov','Provincia'],['vat','P.IVA / Cod. fiscale'],['phone','Telefono'],['email','Email'],['pec','PEC / Codice SDI'],['web','Sito web'],['notes','Note']];
const CP_LAB={name:/^(ragionesociale|denominazione|cliente|spett|spettle|nome|azienda|societa)$/,address:/^(indirizzo|via|sede|sedelegale|sedeoperativa)$/,zip:/^cap$/,city:/^(citta|comune|localita)$/,prov:/^(prov|provincia|pr)$/,vat:/^(piva|partitaiva|cf|codfisc|codfiscale|codicefiscale|vat|cfpiva|pivacf)$/,phone:/^(tel|telefono|cell|cellulare|mobile)$/,email:/^(email|mail|emailpec)$/,pec:/^(pec|sdi|codicesdi|codicedestinatario|destinatario)$/,web:/^(sito|web|sitoweb|www)$/,notes:/^(note|annotazioni|osservazioni)$/};
const CP_CO=/\b(s\.?\s?r\.?\s?l\.?s?|s\.?\s?p\.?\s?a\.?|s\.?\s?n\.?\s?c\.?|s\.?\s?a\.?\s?s\.?|snc|sas|srl|spa|soc\.?\s*coop|coop|ditta|studio|impresa|edil|costruzioni|di\s+[A-Z][a-z]+)\b/i;
function cpGuess(line){
  let s=String(line||'').trim(),m;
  if((m=s.match(/^\s*([A-Za-zÀ-ÿ.\/ ]{2,26}?)\s*[:：]\s*(.+)$/))){
    const lab=nz(m[1]);for(const k in CP_LAB){if(CP_LAB[k].test(lab)){
      let v=m[2].trim();if(k==='email')v=esMail(v)||v;return {f:k==='zip'&&/^\d{5}\s+\S/.test(v)?'capcity':k,v}}}}
  if((m=s.match(/(?:p\.?\s*iva|partita\s+iva|c\.?\s?f\.?|cod\.?\s*fisc\.?)\s*[:.]?\s*((?:IT)?\s?\d{11}|[A-Z0-9]{16})\b/i)))return {f:'vat',v:m[1].replace(/\s/g,'')};
  if((m=s.match(/^(?:tel|telefono|cell|cellulare|mobile)\.?\s*[:.]?\s*([+\d][\d\s./-]{5,})$/i)))return {f:'phone',v:m[1].trim()};
  if(esMail(s)&&s.length<70)return {f:/pec/i.test(s)?'pec':'email',v:esMail(s)};
  if(/^\s*(https?:\/\/|www\.)\S+$/i.test(s))return {f:'web',v:s};
  if(/^(?:IT)?\s?\d{11}$/i.test(s))return {f:'vat',v:s.replace(/\s/g,'')};
  if(/^[+\d][\d\s./-]{6,}$/.test(s)&&s.replace(/\D/g,'').length>=7&&s.replace(/\D/g,'').length<=13)return {f:'phone',v:s};
  if(/^\d{5}\s+\S/.test(s))return {f:'capcity',v:s};
  if(/^(via|viale|v\.le|piazza|p\.zza|corso|c\.so|largo|strada|str\.|loc\.|località|vicolo|contrada)\b/i.test(s))return {f:'address',v:s};
  if(CP_CO.test(s)&&s.length<=70&&!/\d{5}/.test(s))return {f:'name',v:s};
  return {f:'',v:s};
}
function cpSet(text,fname){
  const lines=String(text||'').split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x.length>1&&!/^[-–_=*.\s]+$/.test(x)).slice(0,600);
  if(!lines.length){esErr('Non ho trovato testo da leggere.');return}
  CP.fname=fname||'';CP.rows=lines.map(l=>{const g=cpGuess(l);return {f:g.f,v:g.v,raw:l}});

  cpModal();
}
function cpCount(){const n=CP.rows.filter(r=>r.f==='name'&&r.v.trim()).length,k=CP.rows.filter(r=>r.f&&r.f!=='name').length,e=$('#cpn');if(e)e.textContent=n+' clienti · '+k+' voci assegnate'}
function cpModal(){

  $('#modal').innerHTML=`<div class="scrim" data-act="closeModal"></div><div class="sheet" style="width:min(1000px,calc(100% - 24px));max-height:94vh;overflow:auto"><header><h3>Clienti da PDF · scegli le voci</h3><button class="x" data-act="closeModal" aria-label="Chiudi">×</button></header>
  <p class="muted">${CP.fname?'File: <b>'+esc(CP.fname)+'</b> · ':''}${rows.length} righe di testo. Per ogni riga che ti serve scegli <b>che dato è</b>; le righe «ignora» non vengono caricate. Una riga marcata <b>Ragione sociale</b> inizia un nuovo cliente: le voci sotto di lei (indirizzo, P.IVA, telefono…) vanno a quel cliente, quindi con un PDF di più clienti puoi caricarli tutti insieme. Il testo si può correggere.</p>
  <div class="acts" style="gap:8px;margin-bottom:8px"><span id="cpn" class="muted"></span></div>
  <div class="tw" style="max-height:56vh;overflow:auto"><table class="plt" style="min-width:640px"><tbody>${rows.map((r,i)=>`<tr data-cprow="${i}" style="${r.f?'background:var(--pri-soft,#e6f3f1)':''}"><td style="width:250px"><select data-cpf="${i}">${CP_F.map(o=>`<option value="${o[0]}" ${r.f===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></td><td><input data-cpv="${i}" value="${esc(r.v)}" style="width:100%"></td></tr>`).join('')}</tbody></table></div>

function cpGo(){
  const w=$('#cpwarn'),cl=[];let cur=null;
  for(const r of CP.rows){const v=String(r.v||'').trim();if(!r.f||!v)continue;
    if(r.f==='name'){cur={name:v,address:'',zip:'',city:'',prov:'',vat:'',phone:'',email:'',pec:'',web:'',status:'',sectors:'',notes:'',links:[]};cl.push(cur);continue}
    if(!cur){w.textContent='Prima delle voci del cliente ci vuole una riga «Ragione sociale».';return}
    if(r.f==='capcity'){const m=v.match(/^(\d{5})\s+(.+?)(?:\s*[(\-,]?\s*([A-Za-z]{2})\)?)?$/);if(m){cur.zip=cur.zip||m[1];cur.city=cur.city||m[2].replace(/[,\s]+$/,'');if(m[3]&&!cur.prov)cur.prov=m[3].toUpperCase()}else cur.city=cur.city||v;continue}

    if(!cur[r.f])cur[r.f]=r.f==='prov'?v.toUpperCase().slice(0,2):v;

  if(!cl.length){w.textContent='Indica almeno una riga come «Ragione sociale».';return}
  const ex=n=>S.clients.find(c=>c.name.trim().toLowerCase()===n.trim().toLowerCase());
  CXI.res={clients:cl,contacts:[],nNew:cl.filter(o=>!ex(o.name)).length,nUpd:cl.filter(o=>ex(o.name)).length};cxModal();
}
async function cpRead(files){
  ES.cancel=false;const pages=[];

    return {co,name:name.trim(),role:soOne(g(r,'role')),address:addr,city:soOne(g(r,'city')),prov:soProv(g(r,'prov')),zip:zm?zm[0]:'',phone:soOne(g(r,'phone')||g(r,'phone2')),fax:soOne(g(r,'fax')),mobile:soOne(g(r,'mobile')),
      email:g(r,'email').toLowerCase(),email2:g(r,'email2').toLowerCase(),email3:g(r,'email3').toLowerCase(),web:soOne(g(r,'web')),notes:soClean(g(r,'notes')),cats:g(r,'cat').split(/[;,]/).map(x=>x.trim()).filter(Boolean)};

function soSites(g){

function soBuild(rows){

    g.name=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0])[0]||g.recs[0].name;

function soFill(g){

  if(!g.mand)['address','zip','city','prov','phone','fax','web'].forEach(k=>{
    const op=soOpts(g.mainRecs||g.recs,k);if(!op.length)return;const crm=e&&e[k]?String(e[k]):'';

    const nk=soNk(k,crm);if(op.some(o=>o.nk===nk))return;
    g.f[k]={crm,opts:[{v:crm,crm:1},...op.map(o=>({v:o.v,n:o.n}))],pick:0,conflict:1}});
  const ex=(e&&e.contacts)||[];
  g.cx=g.contacts.map(c=>{
    const cm=ex.findIndex(x=>{const a=[x.email,x.emailPers].filter(Boolean).map(s=>s.toLowerCase()),b=[c.email,c.emailPers].filter(Boolean);return b.some(y=>a.includes(y))||(c.name&&x.name&&soNk('n',x.name)===soNk('n',c.name))});

      if(!ov)o.d[k]={crm:'',out:nv,pick:1,fill:1};else if(soNk(k==='email'||k==='emailPers'?'x':k,ov)!==soNk(k==='email'||k==='emailPers'?'x':k,nv))o.d[k]={crm:ov,out:nv,pick:0,conflict:1}});

}

async function soGo(){

  const applyContacts=(g,ent)=>{ent.contacts=(ent.contacts||[]).map(x=>({...x}));const sm=soSiteMap(g,ent);
    g.cx.forEach(o=>{if(!o.inc)return;
      if(o.m>=0&&ent.contacts[o.m]){Object.entries(o.d).forEach(([k,d])=>{if(d.pick===1)ent.contacts[o.m][k]=d.out});if(sm[o.c._k]&&!ent.contacts[o.m].siteId)ent.contacts[o.m].siteId=sm[o.c._k]}
      else if(o.m<0){const {name,_k,...r}=o.c;if(name||r.email){ent.contacts.push({name,...r,siteId:sm[_k]||''});nc++}}})};
  for(const g of SO.groups){
    if(g.mode==='skip')continue;
    if(g.mand){
      let co=g.coId==='__new'?null:byId('companies',g.coId);
      if(g.coId==='__new'){co={id:uid(),name:g.name,contacts:[]}}
      if(!co)continue;co={...co};applyContacts(g,co);await save('companies',co,true);nm++;continue}
    let c=g.mode==='update'?byId('clients',g.cid):null;
    if(g.mode==='update'&&!c)continue;
    const isNew=!c;c=isNew?{id:uid(),name:g.name,status:'Attivo',contacts:[],links:[],sectorIds:[]}:{...c,sectorIds:[...(c.sectorIds||[])]};

}
